/* ================================================================
   [S11.5] 스펠링 타일 — 6자 이하 단어를 맞추면 글자 타일로 철자 완성
================================================================ */
const Spelling = {
  target: "", fullWord: "", idx: 0, wrongStreak: 0, mistakes: 0, onDone: null,

  eligible(w) { return /^[a-z]{2,}$/.test(w.en); }, // 알파벳으로만 된 단어 (공백·하이픈 제외)

  // 정답 후 30% 확률로 발동하는 보너스 찬스
  roll(w) { return this.eligible(w) && Math.random() < CONFIG.spellChance; },

  show(w, onDone) {
    // 6글자 초과 단어는 뒤를 미리 채우고 앞 6글자만 입력 (예: helico□□□□ → helico + pter 표시)
    this.fullWord = w.en;
    const fillCount = Math.min(w.en.length, 6);
    this.target = w.en.slice(0, fillCount);
    this.idx = 0;
    this.wrongStreak = 0;
    this.mistakes = 0;
    this.onDone = onDone;
    const letters = this.target.split("");
    const rest = w.en.slice(fillCount);
    const nDecoys = letters.length <= 4 ? 1 : 2; // 함정 글자 1~2개
    const decoys = [];
    while (decoys.length < nDecoys) {
      decoys.push("abcdefghijklmnopqrstuvwxyz"[Math.floor(Math.random() * 26)]);
    }
    const tiles = shuffle(letters.concat(decoys));
    const wrap = document.createElement("div");
    wrap.id = "spell-wrap";
    wrap.innerHTML =
      '<div class="spell-card">' +
        '<div class="spell-banner">✨ 스펠링 보너스 찬스! ✨</div>' +
        '<div class="spell-sub">한 번도 안 틀리고 완성하면 🪙 +' + CONFIG.spellBonus + "!</div>" +
        '<div class="prompt-emoji" style="font-size:46px">' + emojiHtml(w) + "</div>" +
        '<div class="prompt-ko" style="font-size:20px">' + esc(w.ko) + "</div>" +
        '<div class="prompt-hint">글자를 순서대로 눌러서 영어 단어를 완성해요!</div>' +
        '<div class="spell-slots' + (w.en.length > 8 ? " compact" : "") + '">' +
          letters.map(() => '<div class="spell-slot"></div>').join("") +
          rest.split("").map(c => '<div class="spell-slot prefilled">' + c + "</div>").join("") +
        "</div>" +
        '<div class="spell-tiles">' + tiles.map(c => '<button class="spell-tile" data-l="' + c + '">' + c + "</button>").join("") + "</div>" +
      "</div>";
    document.body.appendChild(wrap);
    TTS.speak(w.en);
    wrap.addEventListener("click", e => {
      const t = e.target.closest(".spell-tile");
      if (t) this.tap(t);
    });
  },

  tap(tile) {
    const need = this.target[this.idx];
    if (tile.dataset.l === need) {
      SFX.click();
      tile.classList.add("used");
      const slot = document.querySelectorAll("#spell-wrap .spell-slot")[this.idx];
      if (slot) { slot.textContent = need; slot.classList.add("filled"); }
      this.idx++;
      this.wrongStreak = 0;
      document.querySelectorAll("#spell-wrap .spell-tile.hint").forEach(t => t.classList.remove("hint"));
      if (this.idx >= this.target.length) this.complete();
    } else {
      SFX.wrong();
      this.wrongStreak++;
      this.mistakes++;
      tile.classList.add("wrong");
      setTimeout(() => tile.classList.remove("wrong"), 420);
      if (this.wrongStreak >= 3) {
        // 3번 헤매면 다음 글자 타일을 반짝여서 도와줌
        const next = [...document.querySelectorAll("#spell-wrap .spell-tile:not(.used)")].find(t => t.dataset.l === this.target[this.idx]);
        if (next) next.classList.add("hint");
      }
    }
  },

  complete() {
    SFX.catchOk();
    TTS.speak(this.fullWord);
    if (this.mistakes === 0) {
      // 한 번도 안 틀리고 완성 → 보너스 코인!
      addCoins(CONFIG.spellBonus, window.innerWidth / 2, window.innerHeight * 0.35);
      SFX.coin();
      fxConfetti(["🪙", "✨", "⭐", "🎉"], 12);
      toast("🎉 한 번에 완성! 보너스 🪙 +" + CONFIG.spellBonus, 2200);
    } else {
      fxConfetti(["✨", "⭐"], 8);
    }
    const done = this.onDone;
    this.onDone = null;
    setTimeout(() => {
      const w = $("#spell-wrap");
      if (w) w.remove();
      if (done) done();
    }, 1000);
  },
};

/* ================================================================
   [S11.6] 문장 문제 — 빈칸 채우기 & 문장 만들기 (아이 모드 전용)
   문법이 깨지지 않도록 템플릿마다 어울리는 단어 풀을 붙임
================================================================ */
const Sentence = {
  // 셀 수 없는 단어 (a/an 불가)
  MASS: new Set(["water","milk","juice","tea","rice","bread","cheese","butter","honey","meat","ham",
    "soup","salad","popcorn","chocolate","ice cream","yogurt","noodle","pizza","money","paper",
    "homework","math","music","art","hair","blood","corn","broccoli","lettuce","garlic"]),
  // 항상 복수로 쓰는 단어
  PLURAL: new Set(["pants","shorts","socks","shoes","boots","glasses","sunglasses","gloves","scissors","chopsticks"]),
  // "This is a ___"가 어색한 단어
  EXCLUDE: new Set(["name","question","word","alphabet","body","home"]),
  tpls: [],

  init() {
    const byCat = cats => WORDS.filter(w => cats.includes(w.cat));
    const countable = cats => byCat(cats).filter(w =>
      !this.MASS.has(w.en) && !this.PLURAL.has(w.en) && !this.EXCLUDE.has(w.en));
    const T = (en, ko, pool, koHint) => {
      if (pool.length >= 3) this.tpls.push({ en, ko, pool, koHint: !!koHint });
    };
    T("This is {a} ___.", "이것은 {w:이에}.",
      countable(["animal","fruit","food","house","clothes","vehicle","school","body","place","job"]));
    T("These are ___.", "이것들은 {w:이에}.", WORDS.filter(w => this.PLURAL.has(w.en)));
    T("I like ___.", "나는 {w:을를} 좋아해요.",
      byCat(["sport","weather"]).concat(WORDS.filter(w => this.MASS.has(w.en) && ["food","fruit"].includes(w.cat))));
    T("I ___ every day.", "", byCat(["verb"]), true);
    T("I am ___ now.", "나는 지금 {w} 기분이에요.", byCat(["feeling"]).filter(w => w.en !== "love"));
    T("The ___ is very big.", "{w:은는} 아주 커요.", byCat(["animal"]));
    T("My bag is ___.", "내 가방은 {w}색이에요.",
      byCat(["color"]).filter(w => !["rainbow","gold","silver"].includes(w.en)));
    T("Let's go to the ___.", "우리 {w}에 가자!", byCat(["place"]));
    T("Today is ___.", "오늘은 {w:이에}.",
      WORDS.filter(w => ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"].includes(w.en)));
    T("I see {a} ___.", "{w:이가} 보여요!", countable(["animal","vehicle"]));
    T("I want {a} ___.", "나는 {w:이가} 갖고 싶어요.", countable(["house","clothes","school","fruit","food"]));
    T("I go to school by ___.", "나는 {w:을를} 타고 학교에 가요.",
      WORDS.filter(w => ["bus","taxi","train","subway","bicycle","car","scooter"].includes(w.en)));
  },

  forWord(w) {
    const c = this.tpls.filter(t => t.pool.some(x => x.id === w.id));
    return c.length ? c[Math.floor(Math.random() * c.length)] : null;
  },

  articleOf(w) { return /^[aeiou]/.test(w.en) ? "an" : "a"; },

  make(tpl, w) {
    const hasArt = tpl.en.includes("{a}");
    const art = this.articleOf(w);
    const en = hasArt ? tpl.en.replace("{a}", art) : tpl.en;
    const enFull = en.replace("___", w.en);
    const koLine = tpl.koHint
      ? "힌트: " + w.ko
      : tpl.ko.replace(/\{w(?::([^}]+))?\}/g, (m, pair) => (pair ? josa(w.ko, pair) : w.ko));
    const tokens = enFull.replace(/[.!?]/g, "").split(" ");
    return { tpl, art: hasArt ? art : null, enBlank: en, enFull, koLine, tokens };
  },
};
Sentence.init();

/* ================================================================
   [S12] 게임 모드 1 — 단어 퀴즈 (한→영 / 영→한 듣기 / 문장)
================================================================ */
let lastGame = null; // { restart: fn } — 결과 화면 "한 번 더"용

const Quiz = {
  list: [], pool: [], direction: "mix", qdir: null, word: null, hadWrong: false,

  start(cat, direction) {
    Session.reset("quiz", CONFIG.quizRounds);
    SAVE.stats.gamesPlayed.quiz++; saveNow();
    lastGame = { restart: () => Quiz.start(cat, direction) };
    this.direction = direction;
    this.pool = cat ? activeWords().filter(w => w.cat === cat) : activeWords();
    // 복습 우선: ① 지난번에 못 맞히고 넘어간 단어 ② 자주 틀린 단어 순으로 반드시 포함
    const weak = takeRetryWords(3).filter(w => this.pool.includes(w));
    pickN(this.pool.filter(w => isWeakWord(w.id) && !weak.includes(w)), 3)
      .forEach(w => { if (weak.length < 4) weak.push(w); });
    const rest = shuffle(this.pool.filter(w => !weak.includes(w)));
    let list = shuffle(weak.concat(rest.slice(0, Math.max(0, CONFIG.quizRounds - weak.length))));
    while (list.length < CONFIG.quizRounds) list = list.concat(shuffle(this.pool));
    this.list = list.slice(0, CONFIG.quizRounds);
    showScreen("quiz");
  },

  // 오답 보기: 같은 카테고리 우선 + 부족하면 전체에서
  distractors(word, n) {
    const sameCat = activeWords().filter(w => w.cat === word.cat && w.id !== word.id);
    let picks = pickN(sameCat, n);
    if (picks.length < n) {
      const rest = activeWords().filter(w => w.id !== word.id && !picks.includes(w));
      picks = picks.concat(pickN(rest, n - picks.length));
    }
    return picks;
  },

  question() {
    this.word = this.list[Session.round];
    this.hadWrong = false;
    this.tries = 0;
    this.failed = false;
    Session.round++;
    setProgress();

    // 아이 모드: 35% 확률로 문장 문제 (빈칸 채우기 / 문장 만들기)
    this.qtype = "word";
    this.sData = null;
    if (isKidMode() && Math.random() < CONFIG.sentenceChance) {
      const tpl = Sentence.forWord(this.word);
      if (tpl) {
        this.sData = Sentence.make(tpl, this.word);
        this.qtype = Math.random() < 0.55 ? "sblank" : "sarrange";
      }
    }
    if (this.qtype === "sblank") { this.renderBlank(); return; }
    if (this.qtype === "sarrange") { this.renderArrange(); return; }

    const listenOk = TTS.ok && SAVE.settings.tts;
    this.qdir = this.direction === "mix"
      ? (listenOk && Math.random() < 0.5 ? "enko" : "koen")
      : (this.direction === "enko" && !listenOk ? "koen2" : this.direction);
    // koen2: TTS 불가 시 대체 — 영어 글자 보고 한글 고르기

    const w = this.word;
    const choices = shuffle([w, ...this.distractors(w, 3)]);
    const box = $("#quiz-box");
    let promptHtml, choicesHtml;

    if (this.qdir === "koen") {
      promptHtml =
        '<div class="prompt-card"><div class="prompt-emoji">' + emojiHtml(w) + "</div>" +
        '<div class="prompt-ko">' + esc(w.ko) + "</div>" +
        '<div class="prompt-hint">영어로 뭘까요?</div></div>';
      // 아이 모드: 첫 글자를 파란색으로 강조 — "아, t로 시작하는구나!" (부모 모드는 하드모드)
      choicesHtml = choices.map(c =>
        '<button class="choice" data-wid="' + c.id + '"><span class="en">' +
        (hintsOn() ? '<b class="fl">' + esc(c.en[0]) + "</b>" + esc(c.en.slice(1)) : esc(c.en)) +
        "</span></button>"
      ).join("");
    } else if (this.qdir === "enko") {
      promptHtml =
        '<div class="prompt-card"><button class="speak-btn" id="q-speak">🔊</button>' +
        '<div class="prompt-hint">잘 듣고 뜻을 골라요! (🔊 다시 듣기)</div></div>';
      choicesHtml = choices.map(c =>
        '<button class="choice" data-wid="' + c.id + '"><span class="em">' + emojiHtml(c) + '</span><span class="ko">' + esc(c.ko) + "</span></button>"
      ).join("");
    } else { // koen2 (듣기 대체: 영어 보고 한글 고르기)
      promptHtml =
        '<div class="prompt-card"><div class="prompt-en">' + esc(w.en) + "</div>" +
        '<div class="prompt-hint">무슨 뜻일까요?</div></div>';
      choicesHtml = choices.map(c =>
        '<button class="choice" data-wid="' + c.id + '"><span class="em">' + emojiHtml(c) + '</span><span class="ko">' + esc(c.ko) + "</span></button>"
      ).join("");
    }

    box.innerHTML = promptHtml + '<div class="choices">' + choicesHtml + "</div>";
    armChoices(box.querySelector(".choices")); // 아이 모드: 문제를 읽을 시간만큼 보기 잠금

    if (this.qdir === "enko") {
      const sp = $("#q-speak");
      sp.addEventListener("click", () => { SFX.tap(); TTS.speak(w.en); });
      later(() => {
        TTS.speak(w.en);
        later(() => { if (TTS.ok && !speechSynthesis.speaking) sp.classList.add("nudge"); }, 900);
      }, 350);
    }

    box.querySelectorAll(".choice").forEach(c => c.addEventListener("click", (e) => this.answer(e, c)));
  },

  // 문장 빈칸 채우기: 그림+한글 문장 보고 빈칸에 들어갈 단어 고르기 (3지선다)
  renderBlank() {
    const w = this.word, d = this.sData;
    // 오답은 같은 문법 풀에서 (관사가 있으면 같은 관사끼리 — a/an 힌트 누출 방지)
    let pool = d.tpl.pool.filter(x => x.id !== w.id);
    if (d.art) {
      const same = pool.filter(x => Sentence.articleOf(x) === d.art);
      if (same.length >= 2) pool = same;
    }
    let wrongs = pickN(pool, 2);
    if (wrongs.length < 2) {
      wrongs = wrongs.concat(pickN(activeWords().filter(x => x.id !== w.id && !wrongs.includes(x)), 2 - wrongs.length));
    }
    const choices = shuffle([w, ...wrongs]);
    const box = $("#quiz-box");
    box.innerHTML =
      '<div class="prompt-card">' +
        '<div class="prompt-emoji" style="font-size:56px">' + emojiHtml(w) + "</div>" +
        '<div class="sent-en">' + esc(d.enBlank).replace("___", "<u>___</u>") + "</div>" +
        '<div class="sent-ko">' + esc(d.koLine) + "</div>" +
      "</div>" +
      '<div class="choices list">' + choices.map(c =>
        '<button class="choice" data-wid="' + c.id + '"><span class="en">' +
        (hintsOn() ? '<b class="fl">' + esc(c.en[0]) + "</b>" + esc(c.en.slice(1)) : esc(c.en)) +
        "</span></button>"
      ).join("") + "</div>";
    armChoices(box.querySelector(".choices"));
    box.querySelectorAll(".choice").forEach(c => c.addEventListener("click", (e) => this.answer(e, c)));
  },

  // 문장 만들기: 단어 타일을 순서대로 눌러 문장 완성
  renderArrange() {
    const w = this.word, d = this.sData;
    this.arrIdx = 0;
    const tiles = shuffle(d.tokens.slice());
    const box = $("#quiz-box");
    box.innerHTML =
      '<div class="prompt-card">' +
        '<div class="prompt-emoji" style="font-size:52px">' + emojiHtml(w) + "</div>" +
        '<div class="sent-ko" style="font-size:17px;font-weight:900;color:var(--ink)">' + esc(d.koLine) + "</div>" +
        '<button class="speak-btn small" id="arr-speak" style="position:static;margin:6px auto 0;display:block">🔊</button>' +
        '<div class="prompt-hint">잘 듣고, 단어 타일을 순서대로 눌러서 문장을 만들어요!</div>' +
      "</div>" +
      '<div class="spell-slots sent-slots">' + d.tokens.map(() => '<div class="spell-slot word-slot"></div>').join("") + "</div>" +
      '<div class="spell-tiles">' + tiles.map(t => '<button class="spell-tile word-tile" data-tok="' + esc(t) + '">' + esc(t) + "</button>").join("") + "</div>";
    armChoices(box.querySelector(".spell-tiles"));
    const asp = $("#arr-speak");
    if (asp) asp.addEventListener("click", () => { SFX.tap(); TTS.speak(d.enFull); });
    box.querySelectorAll(".word-tile").forEach(b => b.addEventListener("click", (e) => this.arrTap(e, b)));
  },

  arrTap(e, btn) {
    if (Session.lock || btn.classList.contains("used")) return;
    const d = this.sData;
    const need = d.tokens[this.arrIdx];
    if (btn.dataset.tok !== need) {
      if (!this.hadWrong) {
        this.hadWrong = true;
        SAVE.stats.totalAnswered++;
        noteWordResult(this.word.id, false);
        breakCombo();
      }
      this.tries++;
      SFX.wrong();
      btn.classList.add("wrong");
      later(() => btn.classList.remove("wrong"), 420);
      if (kidFocusOn()) {
        if (this.tries >= CONFIG.kidFocus.maxTries) { this.revealSkip(); return; }
        coachPause($("#quiz-box"), "아직 순서가 달라요! 문장을 잘 듣고 순서를 맞춰 봐요", d.enFull);
      }
      return;
    }
    SFX.click();
    btn.classList.add("used");
    const slot = document.querySelectorAll("#quiz-box .word-slot")[this.arrIdx];
    if (slot) { slot.textContent = need; slot.classList.add("filled"); }
    this.arrIdx++;
    if (this.arrIdx >= d.tokens.length) {
      Session.lock = true;
      if (!this.hadWrong) {
        SAVE.stats.totalAnswered++;
        noteWordResult(this.word.id, true);
        awardFirstTry(e.clientX, e.clientY);
      } else {
        SFX.correct();
      }
      this.showResultBanner();
    }
  },

  answer(e, btn) {
    if (Session.lock) return;
    const wid = Number(btn.dataset.wid);
    if (wid !== this.word.id) {
      // 오답: 재시도 허용, 첫 시도 보상만 무효
      if (!this.hadWrong) {
        this.hadWrong = true;
        SAVE.stats.totalAnswered++;
        noteWordResult(this.word.id, false);
        breakCombo();
      }
      this.tries++;
      SFX.wrong();
      btn.classList.add("wrong");
      // 아이 모드: 난사 대신 잠깐 멈추고, 고른 보기에서 배우기 → 시도를 다 쓰면 정답 공개
      if (kidFocusOn()) {
        if (this.tries >= CONFIG.kidFocus.maxTries) { this.revealSkip(); return; }
        const picked = activeWords().find(x => x.id === wid);
        if (picked) this.wrongCoach(picked);
      }
      return;
    }
    Session.lock = true;
    btn.classList.add("right");
    if (!this.hadWrong) {
      SAVE.stats.totalAnswered++;
      noteWordResult(this.word.id, true);
      awardFirstTry(e.clientX, e.clientY);
    } else {
      SFX.correct();
    }
    this.showResultBanner();
  },

  // 고른 오답에서 배우기 — 문제 유형에 따라 알려줄 내용을 바꾼다 (정답은 알려주지 않음)
  wrongCoach(picked) {
    const box = $("#quiz-box"), w = this.word;
    if (this.qtype === "sblank") {                       // 문장 빈칸 (보기 = 영어)
      coachPause(box, coachMsg(picked, "문장을 다시 읽어 보자!"), picked.en);
    } else if (this.qdir === "koen") {                   // 한글 → 영어 (보기 = 영어)
      coachPause(box, coachMsg(picked, "우리가 찾는 건 <b>" + esc(w.ko) + "</b>!"), picked.en);
    } else {                                             // 듣기·영어 → 한글 (보기 = 한글)
      coachPause(box, coachMsgKo(picked, "🔊 를 눌러 다시 들어 볼까?"), w.en);
    }
  },

  // 시도를 다 썼다 → 혼내지 않고 정답을 보여준 뒤, 이 단어를 다시 만나게 예약
  revealSkip() {
    Session.lock = true;
    this.failed = true;
    const box = $("#quiz-box");
    const old = box && box.querySelector(".coach-line");
    if (old) old.remove();
    if (this.qtype === "sarrange") {
      // 남은 타일을 정답 순서로 채워 보여주기
      const slots = document.querySelectorAll("#quiz-box .word-slot");
      this.sData.tokens.forEach((t, i) => {
        const s = slots[i];
        if (s && !s.classList.contains("filled")) { s.textContent = t; s.classList.add("filled"); }
      });
      document.querySelectorAll("#quiz-box .word-tile").forEach(b => b.classList.add("used"));
    } else {
      const right = box && box.querySelector('.choice[data-wid="' + this.word.id + '"]');
      if (right) { right.classList.remove("wrong"); right.classList.add("right"); }
    }
    queueRetry(this.word.id);
    this.requeue(this.word);
    SFX.tap();
    toast("이 단어는 이따 다시 만나자! 🔁", 1800);
    this.showResultBanner();
  },

  // 이번 세션 뒤쪽에 한 번 더 넣기 (자리가 없으면 다음 세션 앞부분에서 만난다)
  requeue(w) {
    const at = Session.round + 1;
    if (at < Session.total) this.list.splice(at, 0, w);
  },

  // 정답 배너 (단어: 이모지+영어+한글 / 문장: 완성된 문장) → 스펠링 찬스 → 다음 문제
  showResultBanner() {
    const w = this.word;
    const isSent = this.qtype !== "word";
    later(() => {
      const banner = document.createElement("div");
      banner.className = "answer-banner";
      banner.innerHTML = isSent
        ? '<div class="be">' + emojiHtml(w) + '</div><div class="bn" style="font-size:21px">' + esc(this.sData.enFull) + '</div><div class="bk">' + esc(this.sData.koLine) + "</div>"
        : '<div class="be">' + emojiHtml(w) + '</div><div class="bn">' + esc(w.en) + '</div><div class="bk">' + esc(w.ko) + "</div>";
      document.body.appendChild(banner);
      TTS.speak(isSent ? this.sData.enFull : w.en);
      later(() => {
        banner.remove();
        const proceed = () => {
          if (Session.round >= Session.total) Result.show();
          else this.question();
        };
        // 보너스 찬스: 스펠링 타일 (문장 문제·못 맞히고 넘어간 라운드는 제외)
        if (this.qtype === "word" && !this.failed && Spelling.roll(w)) Spelling.show(w, proceed);
        else proceed();
      }, isSent ? 1750 : 1350);
    }, 450);
  },
};

/* ================================================================
   [S14] 게임 모드 2 — 영어 끝말잇기
================================================================ */
const firstLetter = w => w.en[0].toLowerCase();
const lastLetter = w => {
  const s = w.en.toLowerCase().replace(/[^a-z]/g, "");
  return s[s.length - 1];
};
function buildStartIndex(words) {
  const idx = {};
  words.forEach(w => {
    const f = firstLetter(w);
    (idx[f] = idx[f] || []).push(w);
  });
  return idx;
}
// 아이/부모 모드별 단어 세트 — 코인·볼·도감은 공유, 출제 단어만 다름
// 부모는 TOEFL(500) 또는 IELTS(레벨 1·2·3 × 150) 중 선택
const WORD_SETS = {
  kid:    { words: WORDS,       categories: CATEGORIES,       startIndex: buildStartIndex(WORDS) },
  parent: { words: WORDS_ADULT, categories: CATEGORIES_ADULT, startIndex: buildStartIndex(WORDS_ADULT) },
};
[1, 2, 3].forEach(lv => {
  const iw = WORDS_IELTS.filter(w => w.lv === lv);
  WORD_SETS["ielts" + lv] = { words: iw, categories: CATEGORIES_IELTS, startIndex: buildStartIndex(iw) };
  const tw = WORDS_TRAVEL.filter(w => w.lv === lv);
  WORD_SETS["travel" + lv] = { words: tw, categories: CATEGORIES_TRAVEL, startIndex: buildStartIndex(tw) };
});
const lvOf = (v, dflt) => ([1, 2, 3].includes(v) ? v : dflt);
const isKidMode = () => SAVE.mode === "kid";       // 아이 전용 기능(문장 문제 등)
const isGranny = () => SAVE.mode === "granny";     // 할머니(해외여행) 모드
// 어른 모드(부모·이모) — 학습 내용은 동일, 가족 톡에서만 구분됨
const isAdult = () => SAVE.mode === "parent" || SAVE.mode === "aunt";
const hintsOn = () => !isAdult();                  // 힌트: 아이·할머니 O, 어른 X(하드모드)
const activeSet = () => {
  if (isGranny()) return WORD_SETS["travel" + lvOf(SAVE.grannyLevel, 1)];
  if (!isAdult()) return WORD_SETS.kid;
  if (SAVE.course === "ielts") return WORD_SETS["ielts" + lvOf(SAVE.ieltsLevel, 2)];
  return WORD_SETS.parent;
};
const activeWords = () => activeSet().words;
// 할머니 모드는 발음을 더 천천히
const speakRate = () => (isGranny() ? 0.72 : 0.85);
// 제시어로 쓸 수 있는 단어: 끝글자로 시작하는 다른 단어가 1개 이상
const chainSafe = (w, idx) => ((idx || activeSet().startIndex)[lastLetter(w)] || []).some(c => c.id !== w.id);

const Chain = {
  current: null, used: null, wrongCount: 0, answerWord: null,

  start() {
    Session.reset("chain", CONFIG.chainRounds);
    SAVE.stats.gamesPlayed.chain++; saveNow();
    lastGame = { restart: () => Chain.start() };
    this.used = new Set();
    this.current = this.pickStarter();
    this.used.add(this.current.id);
    showScreen("chain");
  },

  pickStarter() {
    // 이어가기 좋은(끝글자 시작 단어가 4개 이상 남은) 단어에서 랜덤
    const good = activeWords().filter(w =>
      !this.used || !this.used.has(w.id)
    ).filter(w => (activeSet().startIndex[lastLetter(w)] || []).filter(c => c.id !== w.id && (!this.used || !this.used.has(c.id))).length >= 4);
    const pool = good.length ? good : activeWords().filter(w => chainSafe(w));
    return pool[Math.floor(Math.random() * pool.length)];
  },

  candidatesFor(word) {
    return (activeSet().startIndex[lastLetter(word)] || []).filter(c => c.id !== word.id && !this.used.has(c.id));
  },

  question() {
    Session.round++;
    setProgress();
    this.wrongCount = 0;
    this.skipped = false;

    let cands = this.candidatesFor(this.current);
    if (!cands.length) {
      // 막힘 → 새 기차 출발
      toast("칙칙폭폭! 새 기차 출발~ 🚂", 1800);
      this.current = this.pickStarter();
      this.used.add(this.current.id);
      this.renderTrain();
      cands = this.candidatesFor(this.current);
    }
    // 1수 앞보기: 다음에도 이어갈 수 있는 후보 우선
    const forward = cands.filter(c =>
      (activeSet().startIndex[lastLetter(c)] || []).some(n => n.id !== c.id && !this.used.has(n.id))
    );
    this.answerWord = (forward.length ? forward : cands)[Math.floor(Math.random() * (forward.length ? forward.length : cands.length))];

    const need = lastLetter(this.current);
    // 오답: 요구 글자로 시작하지 않는 단어, 서로 다른 첫 글자 우선
    const wrongPool = shuffle(activeWords().filter(w =>
      firstLetter(w) !== need && w.id !== this.answerWord.id && !this.used.has(w.id)
    ));
    const wrongs = [];
    const usedLetters = new Set([need]);
    for (const w of wrongPool) {
      if (wrongs.length >= 3) break;
      if (usedLetters.has(firstLetter(w))) continue;
      usedLetters.add(firstLetter(w));
      wrongs.push(w);
    }
    for (const w of wrongPool) { // 부족분 보충
      if (wrongs.length >= 3) break;
      if (!wrongs.includes(w)) wrongs.push(w);
    }

    const cur = this.current;
    const enHtml = (() => {
      const en = esc(cur.en);
      const idx = cur.en.toLowerCase().lastIndexOf(need);
      if (idx < 0) return en;
      return esc(cur.en.slice(0, idx)) + '<span class="chain-last">' + esc(cur.en.slice(idx, idx + 1)) + "</span>" + esc(cur.en.slice(idx + 1));
    })();

    const choices = shuffle([this.answerWord, ...wrongs]);
    $("#chain-box").innerHTML =
      '<div class="prompt-card">' +
        '<button class="speak-btn small" id="c-speak">🔊</button>' +
        '<div class="prompt-emoji">' + emojiHtml(cur) + "</div>" +
        '<div class="prompt-en">' + enHtml + "</div>" +
        '<div class="prompt-ko" style="font-size:17px;color:var(--ink-soft)">' + esc(cur.ko) + "</div>" +
        '<div class="prompt-hint" style="font-size:17px;margin-top:8px">👉 <span class="chain-last" style="font-size:24px;font-weight:900">' + need + "</span> 로 시작하는 단어는?</div>" +
      "</div>" +
      '<div class="choices">' + choices.map(c =>
        '<button class="choice" data-wid="' + c.id + '"><span class="em">' + emojiHtml(c) + '</span><span class="ko" style="font-size:17px">' + esc(c.ko) + "</span></button>"
      ).join("") + "</div>";

    armChoices($("#chain-box").querySelector(".choices"));
    $("#c-speak").addEventListener("click", () => { SFX.tap(); TTS.speak(cur.en); });
    later(() => TTS.speak(cur.en), 300);
    document.querySelectorAll("#chain-box .choice").forEach(c =>
      c.addEventListener("click", (e) => this.answer(e, c)));
  },

  answer(e, btn) {
    if (Session.lock) return;
    const wid = Number(btn.dataset.wid);
    if (wid !== this.answerWord.id) {
      if (this.wrongCount === 0) {
        SAVE.stats.totalAnswered++;
        noteWordResult(this.answerWord.id, false);
        breakCombo();
      }
      this.wrongCount++;
      SFX.wrong();
      btn.classList.add("wrong");
      // 아이 모드: 마지막 글자 규칙을 짚어 주고 잠깐 멈춤 → 시도를 다 쓰면 정답 공개 후 다음 칸
      if (kidFocusOn()) {
        if (this.wrongCount >= CONFIG.kidFocus.maxTries) { this.revealSkip(); return; }
        const picked = activeWords().find(x => x.id === wid);
        const need = lastLetter(this.current);
        if (picked) coachPause($("#chain-box"),
          coachMsgKo(picked, "<b>" + esc(need) + "</b> 로 시작하지 않아요!"), this.current.en);
      }
      // 힌트 공개 — 아이 모드는 마지막 시도가 남았을 때, 할머니 모드는 기존대로 2회 오답에서
      if (this.wrongCount >= (kidFocusOn() ? CONFIG.kidFocus.maxTries - 1 : 2) && hintsOn()) {
        // 아이 모드 힌트: 남은 보기들의 영어 단어 공개 (첫 글자 강조) — 부모 모드는 힌트 없음
        document.querySelectorAll("#chain-box .choice:not(.wrong)").forEach(el => {
          if (el.querySelector(".en-hint")) return;
          const w = activeWords().find(x => x.id === Number(el.dataset.wid));
          if (w) el.insertAdjacentHTML("beforeend",
            '<span class="en-hint"><u>' + esc(w.en[0]) + "</u>" + esc(w.en.slice(1)) + "</span>");
        });
      }
      return;
    }
    Session.lock = true;
    btn.classList.add("right");
    if (this.wrongCount === 0) {
      SAVE.stats.totalAnswered++;
      noteWordResult(this.answerWord.id, true);
      awardFirstTry(e.clientX, e.clientY);
    } else {
      SFX.correct();
    }
    this.advance();
  },

  // 시도를 다 썼다 → 정답 칸을 보여주고 기차는 계속 (코인 없음, 그 단어는 퀴즈에서 다시 만난다)
  revealSkip() {
    Session.lock = true;
    this.skipped = true;
    const box = $("#chain-box");
    const old = box && box.querySelector(".coach-line");
    if (old) old.remove();
    const right = box && box.querySelector('.choice[data-wid="' + this.answerWord.id + '"]');
    if (right) right.classList.add("right");
    queueRetry(this.answerWord.id);
    SFX.tap();
    toast("이 단어는 이따 다시 만나자! 🔁", 1800);
    this.advance();
  },

  // 정답 단어로 기차를 이어가고 다음 문제로
  advance() {
    const w = this.answerWord;
    TTS.speak(w.en);
    this.current = w;
    this.used.add(w.id);
    this.renderTrain();
    // 정답의 영어 단어를 크게 보여주기 (한글 보기 → 영어 확인 학습)
    later(() => {
      const banner = document.createElement("div");
      banner.className = "answer-banner";
      banner.innerHTML = '<div class="be">' + emojiHtml(w) + '</div><div class="bn">' + esc(w.en) + '</div><div class="bk">' + esc(w.ko) + "</div>";
      document.body.appendChild(banner);
      later(() => {
        banner.remove();
        const proceed = () => {
          if (Session.round >= Session.total) Result.show();
          else this.question();
        };
        if (!this.skipped && Spelling.roll(w)) Spelling.show(w, proceed);
        else proceed();
      }, 1300);
    }, 400);
  },

  renderTrain() {
    const track = $("#train-track");
    if (!track) return;
    const cars = ['<span class="train-car">🚂</span>'];
    let i = 0;
    this.used.forEach(id => {
      const w = activeWords().find(x => x.id === id);
      cars.push('<span class="train-car" style="animation-delay:' + Math.min(i * 0.03, 0.3) + 's"><span class="te">' + emojiHtml(w) + "</span>" + esc(w.en) + "</span>");
      i++;
    });
    track.innerHTML = cars.join("");
    track.scrollLeft = track.scrollWidth;
  },
};

Screens.chain = (el) => {
  el.innerHTML =

/* ================================================================
   [S15] 게임 모드 3 — 카드 짝맞추기
================================================================ */
const Memory = {
  deck: [], firstPick: null, boardLock: false, failFlips: 0, matchedPairs: 0, pairs: 6, isEasy: true,

  start(cat, opt) {
    this.isEasy = opt !== "hard";
    this.pairs = this.isEasy ? 6 : 8;
    Session.reset("memory", this.pairs);
    SAVE.stats.gamesPlayed.memory++; saveNow();
    lastGame = { restart: () => Memory.start(cat, opt) };

    const pool = cat ? activeWords().filter(w => w.cat === cat) : activeWords();
    const words = pickN(pool, this.pairs);
    this.deck = shuffle(words.flatMap(w => [
      { word: w, type: "en" }, { word: w, type: "ko" },
    ]));
    this.firstPick = null; this.boardLock = false;
    this.failFlips = 0; this.matchedPairs = 0;
    showScreen("memory");
  },

  cardHtml(c, i) {
    const face = c.type === "en"
      ? '<div class="face front t-en"><div class="fw" style="font-size:clamp(13px,4vw,18px)">' + esc(c.word.en) + "</div></div>"
      : '<div class="face front t-ko"><div class="fe">' + emojiHtml(c.word) + '</div><div class="fw">' + esc(c.word.ko) + "</div></div>";
    return '<div class="mcard" data-i="' + i + '"><div class="inner"><div class="face back">❓</div>' + face + "</div></div>";
  },

  render(el) {
    el.innerHTML =
      gameHeadHtml() +
      '<p class="prompt-hint" style="text-align:center;margin-bottom:10px">🔵 영어 카드와 🟢 그림 카드의 짝을 찾아요!</p>' +
      '<div class="memory-grid" id="memory-grid">' +
      this.deck.map((c, i) => this.cardHtml(c, i)).join("") +
      "</div>";

    const grid = $("#memory-grid");
    grid.addEventListener("click", (e) => {
      const cardEl = e.target.closest(".mcard");
      if (cardEl) this.pick(cardEl);
    });

    if (this.isEasy) {
      // 쉬움: 2초 미리보기
      this.boardLock = true;
      later(() => {
        grid.querySelectorAll(".mcard").forEach(c => c.classList.add("flip"));
        SFX.flip();
      }, 500);
      later(() => {
        grid.querySelectorAll(".mcard").forEach(c => c.classList.remove("flip"));
        this.boardLock = false;
      }, 2600);
    }
  },

  pick(cardEl) {
    if (this.boardLock) return;
    if (cardEl.classList.contains("flip") || cardEl.classList.contains("matched")) return;
    SFX.flip();
    cardEl.classList.add("flip");
    const card = this.deck[Number(cardEl.dataset.i)];

    if (!this.firstPick) {
      this.firstPick = { el: cardEl, card };
      return;
    }
    const a = this.firstPick; this.firstPick = null;
    const match = a.card.word.id === card.word.id && a.card.type !== card.type;
    if (match) {
      a.el.classList.add("matched");
      cardEl.classList.add("matched");
      this.matchedPairs++;
      Session.round = this.matchedPairs;
      setProgress();
      SAVE.stats.totalAnswered++;
      const r = cardEl.getBoundingClientRect();
      awardFirstTry(r.left + r.width / 2, r.top);
      TTS.speak(card.word.en);
      if (this.matchedPairs >= this.pairs) later(() => this.finish(), 900);
    } else {
      this.boardLock = true;
      this.failFlips++;
      breakCombo();
      later(() => SFX.wrong(), 350);
      later(() => {
        a.el.classList.remove("flip");
        cardEl.classList.remove("flip");
        this.boardLock = false;
      }, 950);
    }
  },

  finish() {
    let extra = "";
    if (this.failFlips <= CONFIG.memoryPerfectSlack) {
      addCoins(CONFIG.perfectBonus);
      SFX.combo();
      extra = "<br>🏅 <b>퍼펙트!</b> 보너스 코인 +" + CONFIG.perfectBonus;
      fxConfetti(["🏅","✨","🎉"]);
    }
    Result.show(extra);
  },
};

Screens.memory = (el) => Memory.render(el);

/* ================================================================
   [S15.2] 로켓단 조우 — 그림자 포켓몬 구출 배틀 (3라운드 퀴즈)
   모험 출발 시 15% 확률(7판 동안 안 나오면 확정) · 볼 소모 없이 포켓몬 구출
================================================================ */
const Rocket = {
  mon: null, round: 0, mistakes: 0, qtype: "word",
  word: null, phrase: null, tokens: [], arrIdx: 0, hadWrong: false, busy: false,

  // 표정 변화 — 도트 그림 모드에서는 이름표 이모지로, 이미지가 없으면 큰 이모지로
  setFace(emoji, shake) {
    const face = $("#rk-face");
    if (face) face.textContent = emoji;
    const tag = $("#rk-tag");
    if (tag) tag.textContent = emoji + " 로켓단";
    const crew = $("#rk-crew");
    if (crew && shake) {
      crew.classList.remove("hit");
      void crew.offsetWidth;
      crew.classList.add("hit");
      later(() => crew.classList.remove("hit"), 600);
    }
  },

  // 이번 모험에서 로켓단이 나올지 판정 (확률 + pity)
  shouldAppear() {
    const since = SAVE.rocketSince || 0;
    if (since >= CONFIG.rocket.pity) return true;
    return Math.random() < CONFIG.rocket.chance;
  },

  // 훔쳐온 포켓몬 후보: 해금 지역의 **도감에 없는** 포켓몬만 (레어~유니크 우선)
  stolenPool() {
    const own = id => SAVE.pokedex[id] && SAVE.pokedex[id].count >= 1;
    const rare = rarityPoolInRange("unique").concat(rarityPoolInRange("rare")).filter(id => !own(id));
    if (rare.length) return rare;
    const common = rarityPoolInRange("common").filter(id => !own(id));
    if (common.length) return common;
    return []; // 이 지역을 다 모았으면 로켓단은 나오지 않음
  },

  start() {
    const pool = this.stolenPool();
    if (!pool.length) { Adventure.encounterWild(); return; } // 다 모은 지역이면 야생 조우로
    const id = pool[Math.floor(Math.random() * pool.length)];
    this.mon = { id, name: POKEMON_KO[id - 1], rarity: rarityOf(id) };
    this.round = 0;
    this.mistakes = 0;
    this.busy = true;
    SAVE.rocketSince = 0;
    saveNow();
    [gifUrl(id), spriteUrl(id)].forEach(u => { const pre = new Image(); pre.src = u; });
    showScreen("rocket");
  },

  render(el) {
    const m = this.mon;
    const pid = Adventure.partnerId();
    el.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-act="go-home">🏠</button>' +
        '<span class="chip">🪙 ' + SAVE.coins + "</span>" +
        '<span class="spacer"></span>' +
        '<span class="chip">🚨 로켓단 출현!</span>' +
      "</div>" +
      '<div class="adv-scene rk-scene" id="rk-scene">' +
        '<div class="rk-heli" id="rk-heli">🚁</div>' +
        '<div class="battle-platform platform-enemy"></div>' +
        '<div class="battle-platform platform-ally"></div>' +
        '<div class="rk-hpwrap hidden" id="rk-hp-wrap">' +
          '<div class="np-name">😈 로켓단</div>' +
          '<div class="hpwrap"><span class="hplabel">HP</span><div class="hpbar"><i id="rk-hp"></i></div></div>' +
        "</div>" +
        '<div class="rk-boss hidden" id="rk-boss">' +
          '<div class="rk-crew" id="rk-crew">' +
            '<img src="img/rocket-jessie.png" alt="" onerror="rocketImgFail(this)">' +
            '<img src="img/rocket-james.png" alt="" onerror="rocketImgFail(this)">' +
            '<img class="pet" src="img/rocket-meowth.png" alt="" onerror="rocketImgFail(this)">' +
          "</div>" +
          '<div class="face hidden" id="rk-face">😈</div>' +
          '<div class="tag" id="rk-tag">😈 로켓단</div></div>' +
        '<div class="adv-enemy rk-shadow hidden" id="rk-mon">' +
          '<img data-mid="' + m.id + '" src="' + gifUrl(m.id) + '" alt="" onerror="advImgFail(this)">' +
        "</div>" +
        (pid
          ? '<div class="adv-ally hidden" id="adv-ally">' +
            '<img data-mid="' + pid + '" src="' + gifBackUrl(pid) + '" alt="" onerror="allyImgFail(this)">' +
            '<div class="ally-label">' + esc(POKEMON_KO[pid - 1]) + "</div></div>"
          : "") +
        '<div class="battle-dialog" id="battle-dialog"></div>' +
      "</div>" +
      '<div class="rk-round" id="rk-round"></div>' +
      '<div id="rk-box"></div>' +
      '<div style="text-align:center;margin-top:12px">' +
        '<button class="btn ghost" data-act="rocket-giveup" style="font-size:15px;padding:10px 18px">😢 그만하기 (잃는 것은 없어요)</button>' +
      "</div>";

    // 등장 연출: 헬기 → 경고 섬광 → 그림자 포켓몬 공개
    SFX.tone(180, 0.5, "sawtooth", 0, 0.16);
    SFX.tone(140, 0.5, "sawtooth", 0.5, 0.16);
    const alarm = document.createElement("div");
    alarm.id = "rk-alarm";
    document.body.appendChild(alarm);
    later(() => alarm.remove(), 2300);
    Adventure.legendImpactBase ? null : null;
    typeText($("#battle-dialog"), "두두두두… 헬기 소리가 들린다!");
    later(() => {
      $("#rk-boss").classList.remove("hidden");
      $("#rk-hp-wrap").classList.remove("hidden");
      const hp = $("#rk-hp");
      if (hp) hp.style.width = "100%";
      typeText($("#battle-dialog"), "귀염둥이 악당, 포켓몬의 감초~!");
      SFX.wrong();
    }, 1200);
    later(() => {
      typeText($("#battle-dialog"), "우리는 로켓단이다옹~! 😈");
      SFX.tone(520, 0.12, "triangle", 0, 0.12);
      SFX.tone(660, 0.16, "triangle", 0.12, 0.12);
    }, 3000);
    later(() => {
      $("#rk-mon").classList.remove("hidden");
      const ally = $("#adv-ally");
      if (ally) ally.classList.remove("hidden");
      typeText($("#battle-dialog"), "가둬둔 " + josa(m.name, "을를") + " 보여준다… 구해 줘!");
      SFX.bgmStart();
    }, 4700);
    later(() => this.nextRound(), 6200);
  },

  nextRound() {
    this.round++;
    if (this.round > CONFIG.rocket.rounds) { this.win(); return; }
    $("#rk-round").innerHTML = "라운드 <b>" + this.round + "</b> / " + CONFIG.rocket.rounds +
      " — 문제를 맞히면 파트너가 공격해요!";
    this.hadWrong = false;
    this.busy = false;
    const listenOk = TTS.ok && SAVE.settings.tts;
    // 라운드별 문제 유형: 단어 → 듣기 → 문장 만들기
    if (this.round === 1) this.qtype = "word";
    else if (this.round === 2) this.qtype = listenOk ? "listen" : "word";
    else this.qtype = "sentence";
    if (this.qtype === "sentence") this.renderSentence();
    else this.renderWord();
  },

  renderWord() {
    // 현재 모드 단어 세트에서 출제 (아이=초1, 부모=TOEFL/IELTS, 할머니=여행)
    const pool = activeWords();
    const weak = pool.filter(w => isWeakWord(w.id));
    // 기본은 전체 단어, 일부만 복습 단어 (CONFIG.reviewChance)
    const src = (weak.length && Math.random() < CONFIG.reviewChance) ? weak : pool;
    this.word = src[Math.floor(Math.random() * src.length)] || pool[0];
    const w = this.word;
    const others = pickN(pool.filter(x => x.id !== w.id), 2);
    const choices = shuffle([w, ...others]);
    const listen = this.qtype === "listen";
    $("#rk-box").innerHTML =
      '<div class="prompt-card">' +
        (listen
          ? '<button class="speak-btn" id="rk-speak">🔊</button>' +
            '<div class="prompt-hint" style="margin-top:8px">잘 듣고 뜻을 골라요! (🔊 다시 듣기)</div>'
          : '<div class="prompt-emoji" style="font-size:52px">' + emojiHtml(w) + "</div>" +
            '<div class="prompt-ko">' + esc(w.ko) + "</div>" +
            '<div class="prompt-hint">영어로 뭘까요?</div>') +
      "</div>" +
      '<div class="choices list">' + choices.map(c =>
        '<button class="choice rk-choice" data-rk="' + c.id + '">' +
        (listen
          ? '<span class="ko" style="font-size:17px">' + esc(c.ko) + "</span>"
          : '<span class="en">' + (hintsOn() ? '<b class="fl">' + esc(c.en[0]) + "</b>" + esc(c.en.slice(1)) : esc(c.en)) + "</span>") +
        "</button>"
      ).join("") + "</div>";
    if (listen) {
      $("#rk-speak").addEventListener("click", () => { SFX.tap(); TTS.speak(w.en); });
      later(() => TTS.speak(w.en), 350);
    }
    armChoices($("#rk-box").querySelector(".choices"));
    document.querySelectorAll("#rk-box .rk-choice").forEach(b =>
      b.addEventListener("click", e => this.answerWord(e, b)));
  },

  renderSentence() {
    // 짧은 실전 문장 만들기 (도망 퀴즈와 같은 문장 은행 재활용)
    const p = ESCAPE_PHRASES[Math.floor(Math.random() * ESCAPE_PHRASES.length)];
    this.phrase = { en: p[0], ko: p[1] };
    this.tokens = p[0].split(" ");
    this.arrIdx = 0;
    $("#rk-box").innerHTML =
      '<div class="prompt-card">' +
        '<div class="tv-sit">🚨 마지막 라운드</div>' +
        '<div class="tv-ko">' + esc(this.phrase.ko) + "</div>" +
        '<button class="speak-btn small" id="rk-speak" style="position:static;margin:6px auto 0;display:block">🔊</button>' +
        '<div class="prompt-hint" style="margin-top:6px">단어를 순서대로 눌러 문장을 완성해요!</div>' +
      "</div>" +
      '<div class="spell-slots sent-slots">' + this.tokens.map(() => '<div class="spell-slot word-slot"></div>').join("") + "</div>" +
      '<div class="spell-tiles">' + shuffle(this.tokens.slice()).map(t =>
        '<button class="spell-tile word-tile rk-tile" data-tok="' + esc(t) + '">' + esc(t) + "</button>").join("") + "</div>";
    $("#rk-speak").addEventListener("click", () => { SFX.tap(); TTS.speak(this.phrase.en); });
    later(() => TTS.speak(this.phrase.en), 400);
    document.querySelectorAll("#rk-box .rk-tile").forEach(b =>
      b.addEventListener("click", e => this.tapTile(e, b)));
  },

  // coach: 아이 모드에서 오답 직후 잠깐 멈추고 알려줄 내용 { msg, replay }
  miss(coach) {
    if (!this.hadWrong) {
      this.hadWrong = true;
      this.mistakes++;
      SAVE.stats.totalAnswered++;
      if (this.word) noteWordResult(this.word.id, false);
      saveNow();
    }
    SFX.wrong();
    this.setFace("😏");
    later(() => this.setFace("😈"), 900);
    typeText($("#battle-dialog"), "😏 로켓단: 그렇게 쉽진 않다고!");
    if (kidFocusOn() && coach) {
      this.busy = true; // 난사 방지 — 코치가 알려주는 동안 잠깐 멈춤
      coachPause($("#rk-box"), coach.msg, coach.replay, () => { this.busy = false; });
    }
  },

  answerWord(e, btn) {
    if (this.busy) return;
    if (Number(btn.dataset.rk) !== this.word.id) {
      const picked = activeWords().find(x => x.id === Number(btn.dataset.rk));
      this.miss(picked && (this.qtype === "listen"
        ? { msg: coachMsgKo(picked, "🔊 를 눌러 다시 들어 볼까?"), replay: this.word.en }
        : { msg: coachMsg(picked, "우리가 찾는 건 <b>" + esc(this.word.ko) + "</b>!"), replay: picked.en }));
      btn.classList.add("wrong");
      return;
    }
    btn.classList.add("right");
    if (!this.hadWrong) {
      SAVE.stats.totalAnswered++;
      noteWordResult(this.word.id, true);
      saveNow();
    }
    TTS.speak(this.word.en);
    this.hitRocket(e);
  },

  tapTile(e, btn) {
    if (this.busy || btn.classList.contains("used")) return;
    if (btn.dataset.tok !== this.tokens[this.arrIdx]) {
      this.miss({ msg: "아직 순서가 달라요! 문장을 잘 듣고 순서를 맞춰 봐요", replay: this.phrase.en });
      btn.classList.add("wrong");
      later(() => btn.classList.remove("wrong"), 420);
      return;
    }
    SFX.click();
    btn.classList.add("used");
    const slot = document.querySelectorAll("#rk-box .word-slot")[this.arrIdx];
    if (slot) { slot.textContent = btn.dataset.tok; slot.classList.add("filled"); }
    this.arrIdx++;
    if (this.arrIdx >= this.tokens.length) {
      TTS.speak(this.phrase.en);
      this.hitRocket(e);
    }
  },

  // 정답 → 파트너가 기술로 공격 → 로켓단 HP 감소
  hitRocket(e) {
    this.busy = true;
    const pid = Adventure.partnerId();
    const left = CONFIG.rocket.rounds - this.round;
    const hpPct = Math.round(left / CONFIG.rocket.rounds * 100);
    const after = () => {
      const hp = $("#rk-hp");
      if (hp) hp.style.width = hpPct + "%";
      this.setFace(left > 0 ? "😰" : "😱", true); // 피격 흔들림
      typeText($("#battle-dialog"), left > 0 ? "😰 로켓단: 윽! 제법이구나…" : "😱 로켓단: 이럴 수가!");
      later(() => this.nextRound(), 1500);
    };
    SFX.combo();
    if (pid) {

/* ================================================================
   [S15.3] 도망 문장 퀴즈 — 짧고 자주 쓰는 문장(3~5단어)을 만들어야 도망 성공
   뜻 + 소리를 주고 단어 타일을 순서대로 누르는 방식 (틀려도 계속 시도)
================================================================ */
const ESCAPE_PHRASES = [
  ["I can do it", "나는 할 수 있어"], ["I want it", "나는 그것을 원해"], ["Let's go home", "집에 가자"],
  ["I like you", "나는 너를 좋아해"], ["Thank you very much", "정말 고마워"], ["See you later", "나중에 또 봐"],
  ["I am so happy", "나는 정말 행복해"], ["Let's play together", "함께 놀자"], ["I love my family", "나는 가족을 사랑해"],
  ["It is very fun", "정말 재미있어"], ["I will try again", "다시 도전할 거야"], ["You are my friend", "너는 내 친구야"],
  ["I need some water", "물이 좀 필요해"], ["Let's go outside", "밖에 나가자"], ["I am very hungry", "나는 배가 아주 고파"],
  ["Good luck to you", "행운을 빌어"], ["I am ready now", "이제 준비됐어"], ["Please help me", "저를 도와주세요"],
  ["Let's do our best", "우리 최선을 다하자"], ["I feel much better", "기분이 훨씬 좋아"],
  ["Where are you going", "너는 어디 가는 중이야"], ["I found it", "내가 찾았어"], ["Don't give up", "포기하지 마"],
  ["Nice to meet you", "만나서 반가워"], ["I am coming back", "나는 다시 올 거야"],
  // ---- 추가 25문장 ----
  ["Let's try it", "한번 해 보자"], ["I am so excited", "나는 정말 신나"],
  ["Can you help me", "나를 도와줄 수 있어"], ["I did it", "내가 해냈어"],
  ["Let's be friends", "우리 친구가 되자"], ["It is my turn", "내 차례야"],
  ["I am almost done", "거의 다 했어"], ["Wait for me", "나를 기다려 줘"],
  ["Let's go together", "같이 가자"], ["I am proud of you", "네가 자랑스러워"],
  ["That sounds good", "그거 좋은 것 같아"], ["I want to learn", "나는 배우고 싶어"],
  ["Have a nice day", "좋은 하루 보내"], ["I am on my way", "나 지금 가는 중이야"],
  ["Please wait a moment", "잠깐만 기다려 주세요"], ["I need more time", "시간이 더 필요해"],
  ["Let's take a break", "잠깐 쉬자"], ["Are you okay", "너 괜찮아"],
  ["I feel great today", "오늘 기분이 아주 좋아"], ["Let's start now", "지금 시작하자"],
  ["It is not easy", "그건 쉽지 않아"], ["I will help you", "내가 도와줄게"],
  ["Show me the way", "길을 알려 줘"], ["I am back home", "나 집에 돌아왔어"],
  ["Let's eat together", "같이 먹자"],
];

const EscapeQuiz = {
  tokens: [], idx: 0, phrase: null, onPass: null, tries: 0,

  open(onPass) {
    const p = ESCAPE_PHRASES[Math.floor(Math.random() * ESCAPE_PHRASES.length)];
    this.phrase = { en: p[0], ko: p[1] };
    this.tokens = p[0].split(" ");
    this.idx = 0;
    this.tries = 0;
    this.onPass = onPass;
    SFX.tap();
    this.render();
    later(() => TTS.speak(this.phrase.en), 400);
  },

  render() {
    showModal(
      '<div class="esc-ko">' + esc(this.phrase.ko) + "</div>" +
      '<button class="speak-btn small esc-speak" data-act="escape-listen" style="position:static;margin:8px auto 2px;display:block">🔊</button>' +
      '<div class="m-text" style="margin:4px 0 10px">소리를 듣고 단어를 순서대로 눌러요</div>' +
      '<div class="spell-slots sent-slots" id="esc-slots">' +
        this.tokens.map((t, i) => '<div class="spell-slot word-slot' + (i < this.idx ? " filled" : "") + '">' +
          (i < this.idx ? esc(this.tokens[i]) : "") + "</div>").join("") +
      "</div>" +
      '<div class="spell-tiles" id="esc-tiles">' + shuffle(this.tokens.map((t, i) => ({ t, i })))
        .map(o => '<button class="spell-tile word-tile" data-esc="' + o.i + '" data-tok="' + esc(o.t) + '">' + esc(o.t) + "</button>").join("") +
      "</div>" +
      '<div class="m-btns" style="margin-top:14px"><button class="btn ghost" data-act="escape-cancel">그냥 계속 던지기</button></div>'
    );
    // 이미 맞춘 글자에 해당하는 타일은 사용 처리
    const used = this.tokens.slice(0, this.idx);
    document.querySelectorAll("#esc-tiles .word-tile").forEach(b => {
      const k = used.indexOf(b.dataset.tok);
      if (k >= 0 && Number(b.dataset.esc) < this.idx) b.classList.add("used");
    });
  },

  tap(btn) {
    if (btn.classList.contains("used")) return;
    const need = this.tokens[this.idx];
    if (btn.dataset.tok !== need) {
      this.tries++;
      SFX.wrong();
      btn.classList.add("wrong");
      setTimeout(() => btn.classList.remove("wrong"), 420);
      if (this.tries % 3 === 0) TTS.speak(this.phrase.en); // 3번 틀리면 다시 들려주기
      return;
    }
    SFX.click();
    btn.classList.add("used");
    const slot = document.querySelectorAll("#esc-slots .word-slot")[this.idx];
    if (slot) { slot.textContent = need; slot.classList.add("filled"); }
    this.idx++;
    if (this.idx >= this.tokens.length) this.pass();
  },

  pass() {
    SFX.catchOk();
    TTS.speak(this.phrase.en);
    fxConfetti(["💨", "✨", "🏃"], 8);
    const done = this.onPass;
    this.onPass = null;
    later(() => {
      closeModal();
      if (done) done();
    }, 1100);
  },
};

document.addEventListener("click", e => {
  const tile = e.target.closest("#esc-tiles .word-tile");
  if (tile) { EscapeQuiz.tap(tile); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "escape-listen") { SFX.tap(); TTS.speak(EscapeQuiz.phrase.en); }
  else if (b.dataset.act === "escape-cancel") { SFX.tap(); EscapeQuiz.onPass = null; closeModal(); }
});

/* ================================================================
   [S15.4] 여행 회화 모드 (할머니 모드 전용) — 듣기·상황·문장 배열 3유형
================================================================ */
const Travel = {
  list: [], phrase: null, qtype: "listen", hadWrong: false, arrIdx: 0,

  pool() { return PHRASES_TRAVEL.filter(p => p.lv === lvOf(SAVE.grannyLevel, 1)); },

  start() {
    const pool = this.pool();
    Session.reset("travel", Math.min(8, pool.length));
    SAVE.stats.gamesPlayed.travel = (SAVE.stats.gamesPlayed.travel || 0) + 1;
    saveNow();
    lastGame = { restart: () => Travel.start() };
    // 전에 틀린 문장 최대 2개를 반드시 포함 (복습)
    const weak = pickN(pool.filter(p => isWeakWord(p.id)), 2);
    const rest = shuffle(pool.filter(p => !weak.includes(p)));
    this.list = shuffle(weak.concat(rest)).slice(0, Session.total);
    showScreen("travel");
  },

  question() {
    this.phrase = this.list[Session.round];
    if (!this.phrase) { Result.show(); return; } // 방어: 목록이 비었으면 결과로
    this.hadWrong = false;
    Session.round++;
    setProgress();
    const listenOk = TTS.ok && SAVE.settings.tts;
    const types = listenOk ? ["listen", "situation", "arrange"] : ["situation", "arrange"];
    this.qtype = types[Math.floor(Math.random() * types.length)];
    if (this.qtype === "arrange") this.renderArrange();
    else this.renderChoice();
  },

  distractors(n) {
    const pool = this.pool().filter(p => p.id !== this.phrase.id);
    return pickN(pool, n);
  },

  renderChoice() {
    const p = this.phrase;
    const listen = this.qtype === "listen";
    const choices = shuffle([p, ...this.distractors(2)]);
    $("#travel-box").innerHTML =
      '<div class="prompt-card">' +
        (listen
          ? '<button class="speak-btn" id="tv-speak">🔊</button>' +
            '<div class="prompt-hint" style="margin-top:10px">잘 듣고 무슨 뜻인지 골라요! (🔊 다시 듣기)</div>'
          : '<div class="tv-sit">' + esc(p.sit) + "</div>" +
            '<div class="tv-ko">' + esc(p.ko) + "</div>" +
            '<div class="prompt-hint">이 말을 영어로 하면?</div>') +
      "</div>" +
      '<div class="choices list">' + choices.map(c =>
        '<button class="choice tv-choice" data-pid="' + c.id + '">' +
        (listen
          ? '<span class="ko" style="font-size:17px">' + esc(c.ko) + "</span>"
          : '<span class="tv-en">' + esc(c.en) + "</span>") +
        "</button>"
      ).join("") + "</div>";
    Session.lock = false;
    if (listen) {
      const sp = $("#tv-speak");
      sp.addEventListener("click", () => { SFX.tap(); TTS.speak(p.en); });
      later(() => TTS.speak(p.en), 350);
    }
    document.querySelectorAll("#travel-box .tv-choice").forEach(b =>
      b.addEventListener("click", e => this.answer(e, b)));
  },

  renderArrange() {
    const p = this.phrase;
    this.arrIdx = 0;
    this.tokens = p.en.replace(/[.,?!]/g, "").split(" ").filter(Boolean);
    $("#travel-box").innerHTML =
      '<div class="prompt-card">' +
        '<div class="tv-sit">' + esc(p.sit) + "</div>" +
        '<div class="tv-ko">' + esc(p.ko) + "</div>" +
        '<div class="prompt-hint">단어를 순서대로 눌러 영어 문장을 만들어요!</div>' +
      "</div>" +
      '<div class="spell-slots sent-slots">' + this.tokens.map(() => '<div class="spell-slot word-slot"></div>').join("") + "</div>" +
      '<div class="spell-tiles">' + shuffle(this.tokens.slice()).map(t =>
        '<button class="spell-tile word-tile" data-tok="' + esc(t) + '">' + esc(t) + "</button>"
      ).join("") + "</div>";
    Session.lock = false;
    document.querySelectorAll("#travel-box .word-tile").forEach(b =>
      b.addEventListener("click", e => this.arrTap(e, b)));
  },

  arrTap(e, btn) {
    if (Session.lock || btn.classList.contains("used")) return;
    if (btn.dataset.tok !== this.tokens[this.arrIdx]) {
      this.miss();
      SFX.wrong();
      btn.classList.add("wrong");
      later(() => btn.classList.remove("wrong"), 420);
      return;
    }
    SFX.click();
    btn.classList.add("used");
    const slot = document.querySelectorAll("#travel-box .word-slot")[this.arrIdx];
    if (slot) { slot.textContent = btn.dataset.tok; slot.classList.add("filled"); }
    this.arrIdx++;
    if (this.arrIdx >= this.tokens.length) this.succeed(e);
  },

  miss() {
    if (this.hadWrong) return;
    this.hadWrong = true;
    SAVE.stats.totalAnswered++;
    noteWordResult(this.phrase.id, false); // 문장 id로 복습 기록 (4001~ 대역)
    breakCombo();
  },

  answer(e, btn) {
    if (Session.lock) return;
    if (Number(btn.dataset.pid) !== this.phrase.id) {
      this.miss();
      SFX.wrong();
      btn.classList.add("wrong");
      return;
    }
    btn.classList.add("right");
    this.succeed(e);
  },

  succeed(e) {
    Session.lock = true;
    if (!this.hadWrong) {
      SAVE.stats.totalAnswered++;
      noteWordResult(this.phrase.id, true);
      awardFirstTry(e ? e.clientX : undefined, e ? e.clientY : undefined);
    } else {
      SFX.correct();
    }
    const p = this.phrase;
    TTS.speak(p.en);
    later(() => {
      const banner = document.createElement("div");
      banner.className = "answer-banner";
      banner.innerHTML = '<div class="bn" style="font-size:21px">' + esc(p.en) + '</div>' +
        '<div class="bk" style="font-size:15px">' + esc(p.ko) + "</div>" +
        '<div class="bk" style="margin-top:4px">' + esc(p.sit) + "</div>";
      document.body.appendChild(banner);
      later(() => {
        banner.remove();
        if (Session.round >= Session.total) Result.show();
        else this.question();
      }, 2100);
    }, 450);
  },
};

/* ================================================================
   [S15.5] 퍼즐 모드 — 전기 회로 잇기 (같은 색 단자 연결 + 모든 칸 채우기)
   보상: 클리어 +5코인, 1분 미만 +2 추가, 30초 미만 +5 추가
================================================================ */
const PZ_PAL = ["#3d8bfd", "#ff8c42", "#ff5a8d", "#2ec46f", "#9b5de5", "#e8b100", "#26c6da", "#8d6e63"];

const Puzzle = {
  W: 0, H: 0, N: 0, cellColor: null, endpointOf: null,
  colorPaths: [], colorDone: [], numColors: 0, solution: [],
  cellEls: [], stage: 1, drawing: false, active: -1,
  startT: 0, solved: false,

  params(s) {
    return {
      size: Math.min(8, 5 + Math.floor((s - 1) / 2)),
      colors: Math.min(PZ_PAL.length, 4 + Math.floor(s / 2)),
    };
  },
  neighbors(cell) {
    const r = (cell / this.W) | 0, c = cell % this.W, out = [];
    if (r > 0) out.push(cell - this.W);
    if (r < this.H - 1) out.push(cell + this.W);
    if (c > 0) out.push(cell - 1);
    if (c < this.W - 1) out.push(cell + 1);
    return out;
  },

  // 항상 정답이 존재: 해밀턴 경로를 무작위화(backbite) 후 색깔별로 잘라 배치
  gen(size, colors) {
    this.W = this.H = size;
    this.N = this.W * this.H;
    const N = this.N, W = this.W;
    let path = [];
    for (let r = 0; r < this.H; r++) {
      if (r % 2 === 0) for (let c = 0; c < W; c++) path.push(r * W + c);
      else for (let c = W - 1; c >= 0; c--) path.push(r * W + c);
    }
    const posIdx = new Int32Array(N);
    for (let i = 0; i < N; i++) posIdx[path[i]] = i;
    for (let it = 0; it < N * 22; it++) {
      if (Math.random() < 0.5) { path.reverse(); for (let i = 0; i < N; i++) posIdx[path[i]] = i; }
      const u = path[N - 1], nb = this.neighbors(u);
      const w = nb[(Math.random() * nb.length) | 0];
      if (w === path[N - 2]) continue;
      const i = posIdx[w];
      let lo = i + 1, hi = N - 1;
      while (lo < hi) { const t = path[lo]; path[lo] = path[hi]; path[hi] = t; lo++; hi--; }
      for (let k = i + 1; k < N; k++) posIdx[path[k]] = k;
    }
    this.numColors = Math.min(colors, PZ_PAL.length, Math.floor(N / 2));
    const base = Math.floor(N / this.numColors), rem = N % this.numColors, sizes = [];
    for (let i = 0; i < this.numColors; i++) sizes.push(base + (i < rem ? 1 : 0));
    for (let s = 0; s < this.numColors * 3; s++) {
      const i = (Math.random() * this.numColors) | 0, j = (Math.random() * this.numColors) | 0;
      if (i !== j && sizes[i] > 2) { sizes[i]--; sizes[j]++; }
    }
    this.cellColor = new Int32Array(N).fill(-1);
    this.endpointOf = new Int32Array(N).fill(-1);
    this.colorPaths = []; this.colorDone = []; this.solution = [];
    let idx = 0;
    for (let ci = 0; ci < this.numColors; ci++) {
      const len = sizes[ci];
      this.endpointOf[path[idx]] = ci;
      this.endpointOf[path[idx + len - 1]] = ci;
      this.solution.push(path.slice(idx, idx + len)); // 검증·힌트용 정답 보관
      this.colorPaths.push([]); this.colorDone.push(false);
      idx += len;
    }
    this.startT = 0;
    this.solved = false;
    this.buildBoard();
    this.render();
    this.updateHud();
  },

  buildBoard() {
    const board = $("#pz-board");
    board.style.gridTemplateColumns = "repeat(" + this.W + ",1fr)";
    board.style.gridTemplateRows = "repeat(" + this.H + ",1fr)";
    board.innerHTML = "";
    this.cellEls = [];
    for (let i = 0; i < this.N; i++) {
      const d = document.createElement("div");
      d.className = "pz-cell";
      board.appendChild(d);
      this.cellEls.push(d);
    }
  },

  recomputeDone() {
    for (let k = 0; k < this.numColors; k++) {
      const p = this.colorPaths[k];
      this.colorDone[k] = p.length >= 2 && this.endpointOf[p[0]] === k &&
        this.endpointOf[p[p.length - 1]] === k && p[0] !== p[p.length - 1];
    }
  },
  render() {
    this.recomputeDone();
    const conn = Array.from({ length: this.N }, () => "");
    for (let k = 0; k < this.numColors; k++) {
      const p = this.colorPaths[k];
      for (let i = 0; i < p.length - 1; i++) {
        const a = p[i], b = p[i + 1], diff = b - a;
        if (diff === 1) { conn[a] += "r"; conn[b] += "l"; }
        else if (diff === -1) { conn[a] += "l"; conn[b] += "r"; }
        else if (diff === this.W) { conn[a] += "d"; conn[b] += "u"; }
        else if (diff === -this.W) { conn[a] += "u"; conn[b] += "d"; }
      }
    }
    for (let i = 0; i < this.N; i++) {
      const el = this.cellEls[i], col = this.cellColor[i];
      let html = "";
      if (col >= 0) {
        const hex = PZ_PAL[col], done = this.colorDone[col], c = conn[i];
        if (c.includes("u")) html += '<span class="pz-arm u" style="background:' + hex + '"></span>';
        if (c.includes("d")) html += '<span class="pz-arm d" style="background:' + hex + '"></span>';
        if (c.includes("l")) html += '<span class="pz-arm l" style="background:' + hex + '"></span>';
        if (c.includes("r")) html += '<span class="pz-arm r" style="background:' + hex + '"></span>';
        html += '<span class="pz-core' + (done ? " done" : "") + '" style="background:' + hex + (done ? ";box-shadow:0 0 10px " + hex : "") + '"></span>';
      }
      const ep = this.endpointOf[i];
      if (ep >= 0) {
        html += '<span class="pz-term' + (this.colorDone[ep] ? " done" : "") + '" style="background:' + PZ_PAL[ep] + '"></span>';
      }
      el.innerHTML = html;
    }
  },
  updateHud() {
    this.recomputeDone();
    let done = 0;
    for (let k = 0; k < this.numColors; k++) if (this.colorDone[k]) done++;
    const conn = $("#pz-conn");
    if (conn) conn.textContent = done + " / " + this.numColors;
    const bar = $("#pz-bar");
    if (bar) bar.style.width = Math.round(done / this.numColors * 100) + "%";
  },
  tick() {
    const t = $("#pz-time");
    if (!t) return;
    if (!this.startT || this.solved) return;
    const s = Math.floor((Date.now() - this.startT) / 1000);
    t.textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  },

  adjacent(a, b) {
    const ra = (a / this.W) | 0, ca = a % this.W, rb = (b / this.W) | 0, cb = b % this.W;
    return (ra === rb && Math.abs(ca - cb) === 1) || (ca === cb && Math.abs(ra - rb) === 1);
  },
  clearColor(k) { for (const idx of this.colorPaths[k]) this.cellColor[idx] = -1; this.colorPaths[k] = []; },
  cutColor(m, atCell) {
    const p = this.colorPaths[m], j = p.indexOf(atCell);
    if (j < 0) return;
    for (let x = j; x < p.length; x++) if (this.cellColor[p[x]] === m) this.cellColor[p[x]] = -1;
    this.colorPaths[m] = p.slice(0, j);
  },
  startColor(k, epCell) { this.clearColor(k); this.colorPaths[k] = [epCell]; this.cellColor[epCell] = k; },
  grabPath(k, cell) {
    const p = this.colorPaths[k], j = p.indexOf(cell);
    if (j < 0) return;
    for (let x = j + 1; x < p.length; x++) this.cellColor[p[x]] = -1;
    this.colorPaths[k] = p.slice(0, j + 1);
  },
  step(target) {
    const k = this.active, p = this.colorPaths[k], head = p[p.length - 1];
    if (target === head || !this.adjacent(target, head)) return;
    if (p.length >= 2 && target === p[p.length - 2]) { this.cellColor[p.pop()] = -1; this.render(); this.updateHud(); return; }
    const inIdx = p.indexOf(target);
    if (inIdx >= 0) { for (let x = p.length - 1; x > inIdx; x--) this.cellColor[p[x]] = -1; this.colorPaths[k] = p.slice(0, inIdx + 1); this.render(); return; }
    const tEp = this.endpointOf[target];
    if (tEp >= 0 && tEp !== k) return;
    const tc = this.cellColor[target];
    if (tc >= 0 && tc !== k) this.cutColor(tc, target);
    this.cellColor[target] = k;
    p.push(target);
    this.render(); this.updateHud(); this.checkWin();
  },
  cellAt(e) {
    const board = $("#pz-board");
    const rect = board.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (x < 0 || y < 0 || x > rect.width || y > rect.height) return null;
    const c = Math.min(this.W - 1, Math.max(0, Math.floor(x / (rect.width / this.W))));
    const r = Math.min(this.H - 1, Math.max(0, Math.floor(y / (rect.height / this.H))));
    return r * this.W + c;
  },
  bind(board) {
    board.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
    board.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (this.solved) return;
      const cell = this.cellAt(e);
      if (cell == null) return;
      board.setPointerCapture(e.pointerId);
      const ep = this.endpointOf[cell], col = this.cellColor[cell];
      if (ep >= 0) { this.active = ep; this.startColor(ep, cell); this.drawing = true; }
      else if (col >= 0) { this.active = col; this.grabPath(col, cell); this.drawing = true; }
      else return;
      if (!this.startT) this.startT = Date.now(); // 첫 터치부터 시간 측정
      SFX.flip();
      this.render(); this.updateHud();
    });
    board.addEventListener("pointermove", e => {
      if (!this.drawing) return;
      e.preventDefault();
      const cell = this.cellAt(e);
      if (cell != null) this.step(cell);
    }, { passive: false });
    board.addEventListener("pointerup", () => { this.drawing = false; this.active = -1; });
  },

  checkWin() {
    this.recomputeDone();
    for (let k = 0; k < this.numColors; k++) if (!this.colorDone[k]) return;
    for (let i = 0; i < this.N; i++) if (this.cellColor[i] < 0) return;
    this.win();
  },
  win() {
    if (this.solved) return;
    this.solved = true;
    const secs = Math.max(1, Math.round((Date.now() - this.startT) / 1000));
    let coins = CONFIG.puzzle.base;
    let bonusLine = "";
    if (secs < 15) { coins += CONFIG.puzzle.under15; bonusLine = "⚡ 15초 미만! 스피드 보너스 <b>+" + CONFIG.puzzle.under15 + "</b>"; }
    else if (secs < 30) { coins += CONFIG.puzzle.under30; bonusLine = "⏱ 30초 미만! 스피드 보너스 <b>+" + CONFIG.puzzle.under30 + "</b>"; }
    addCoins(coins, window.innerWidth / 2, window.innerHeight * 0.35);
    SAVE.stats.gamesPlayed.puzzle = (SAVE.stats.gamesPlayed.puzzle || 0) + 1;
    saveNow();
    SFX.catchOk();
    fxConfetti(["⚡", "✨", "🎉", "🧩"], 14);
    const timeTxt = Math.floor(secs / 60) + "분 " + (secs % 60) + "초";
    later(() => showModal(
      '<div class="m-emoji">🧩⚡</div>' +
      '<div class="m-title">회로 완성!</div>' +
      '<div class="m-text">걸린 시간: <b>' + timeTxt + "</b><br>" +
        "기본 보상 <b>+" + CONFIG.puzzle.base + "</b>" + (bonusLine ? "<br>" + bonusLine : "") + "</div>" +
      '<div class="coin-earn">🪙 +' + coins + "</div>" +
      '<div class="m-btns" style="flex-direction:column;margin-top:14px">' +
        '<button class="btn green" data-act="puzzle-next">🧩 다음 판 (조금 더 어려워요!)</button>' +
        '<button class="btn ghost" data-act="modal-home">🏠 홈으로</button>' +
      "</div>"
    ), 600);
  },
};

Screens.puzzle = (el) => {
  el.innerHTML =
    topbarHtml({ home: true }) +
    '<div class="pz-head">' +
      '<span class="chip">🧩 ' + Puzzle.stage + "판</span>" +
      '<span class="chip" id="pz-time">⏱ 0:00</span>' +
      '<span class="chip">🔌 <span id="pz-conn">0 / 0</span></span>' +
      '<span class="spacer"></span>' +
      '<div class="progress" style="flex:1;max-width:120px"><i id="pz-bar"></i></div>' +
    "</div>" +
    '<div class="pz-board" id="pz-board"></div>' +
    '<div class="pz-controls">' +
      '<button class="btn ghost" style="flex:1" id="pz-clear">🧹 지우기</button>' +
      '<button class="btn" style="flex:1" id="pz-new">🔄 새 판</button>' +
    "</div>" +
    '<div class="pz-hint">같은 색 단자를 손가락으로 이어요! 빈칸 없이 모두 채우면 완성 ⚡</div>';
  const p = Puzzle.params(Puzzle.stage);
  Puzzle.gen(p.size, p.colors);
  Puzzle.bind($("#pz-board"));
  $("#pz-clear").addEventListener("click", () => {
    SFX.tap();
    for (let k = 0; k < Puzzle.numColors; k++) Puzzle.clearColor(k);
    Puzzle.render(); Puzzle.updateHud();
  });
  $("#pz-new").addEventListener("click", () => {
    SFX.tap();
    const np = Puzzle.params(Puzzle.stage);

  screenTimers.push(setInterval(() => Puzzle.tick(), 300));
};

/* ================================================================
   [S15.5] 포켓몬 쇼다운 — 밀어서 순서 맞추기 (슬라이딩 논리 퍼즐)
   2×3 무대에 포켓몬 5마리 + 빈자리 1칸. 빈자리 옆 포켓몬을 탭하면 밀려 들어간다.
   순서 카드와 똑같이 맞추면 우승! 최소 이동 수로 풀면 보너스 코인.
================================================================ */
const SHOWDOWN_IDS = [25, 132, 143, 133, 54]; // 피카츄 · 메타몽 · 잠만보 · 이브이 · 고라파덕
const SD_EMOJI = { 25: "⚡", 132: "🟣", 143: "😴", 133: "🐾", 54: "🦆" };
const SD_COLS = 3, SD_ROWS = 2, SD_N = SD_COLS * SD_ROWS;

// 스프라이트 폴백: 움직이는 GIF → 공식 일러스트 → 이모지
function sdImgFail(img) {
  if (!img.dataset.step) { img.dataset.step = "art"; img.src = spriteUrl(img.dataset.mid); return; }
  img.outerHTML = SD_EMOJI[img.dataset.mid] || "❓";
}

// 스테이지 1~50을 5구간으로 — 구간마다 목표 최소 이동 수와 코인이 다르다
const SD_BANDS = [
  { to: 10, label: "쉬움",        emoji: "🌱", coin: 3,  lo: 2,  hi: 5  },
  { to: 20, label: "조금 쉬움",   emoji: "🍀", coin: 5,  lo: 6,  hi: 9  },
  { to: 30, label: "중간",        emoji: "⭐", coin: 7,  lo: 10, hi: 13 },
  { to: 40, label: "어려움",      emoji: "🔥", coin: 10, lo: 14, hi: 17 },
  { to: 50, label: "매우 어려움", emoji: "💎", coin: 15, lo: 18, hi: 21 },
];

const Showdown = {
  stage: 1,
  board: [], target: [], moves: 0, minMoves: 0, hintsLeft: 0, solved: false, busy: false,

  bandOf(stage) { return SD_BANDS.find(b => stage <= b.to) || SD_BANDS[SD_BANDS.length - 1]; },
  bandFrom(band) { const i = SD_BANDS.indexOf(band); return i <= 0 ? 1 : SD_BANDS[i - 1].to + 1; },
  // 스테이지 → 목표 최소 이동 수 (구간 안에서 고르게 올라감 · 2×3 퍼즐의 최대는 21수)
  movesFor(stage) {
    const band = this.bandOf(stage), from = this.bandFrom(band);
    const span = Math.max(1, band.to - from);
    return Math.round(band.lo + (Math.min(band.to, stage) - from) / span * (band.hi - band.lo));
  },
  // 진행도: SAVE.showdownStage 는 1~51 (51 = 50스테이지 전부 클리어)
  raw() { return Math.max(1, Math.min(CONFIG.showdown.stages + 1, SAVE.showdownStage || 1)); },
  nextStage() { return Math.min(CONFIG.showdown.stages, this.raw()); }, // 지금 도전할 스테이지
  clearedCount() { return this.raw() - 1; },
  isCleared(stage) { return stage < this.raw(); },
  isOpen(stage) { return stage <= this.nextStage(); },       // 잠기지 않은 스테이지
  allCleared() { return this.raw() > CONFIG.showdown.stages; },

  key(b) { return b.map(x => x === null ? "_" : x).join(","); },
  blankOf(b) { return b.indexOf(null); },
  // 빈자리와 맞닿은 칸들 (상하좌우)
  neighbors(i) {
    const r = Math.floor(i / SD_COLS), c = i % SD_COLS, out = [];
    if (r > 0) out.push(i - SD_COLS);
    if (r < SD_ROWS - 1) out.push(i + SD_COLS);
    if (c > 0) out.push(i - 1);
    if (c < SD_COLS - 1) out.push(i + 1);
    return out;
  },
  slide(b, from) { // from 칸의 포켓몬을 빈자리로 (복사본 반환, 불가면 null)
    const blank = this.blankOf(b);
    if (!this.neighbors(blank).includes(from)) return null;
    const n = b.slice();
    n[blank] = n[from]; n[from] = null;
    return n;
  },

  // 목표까지 최소 몇 수인지 (상태 720개뿐이라 BFS로 정확히 계산) → 첫 최적 수도 알려준다
  solve(from, goal) {
    const gk = this.key(goal);
    if (this.key(from) === gk) return { dist: 0, first: -1 };
    const seen = { [this.key(from)]: true };
    let frontier = [{ b: from, first: -1 }], dist = 0;
    while (frontier.length && dist < 40) {
      dist++;
      const next = [];
      for (const cur of frontier) {
        for (const from2 of this.neighbors(this.blankOf(cur.b))) {
          const nb = this.slide(cur.b, from2);
          const k = this.key(nb);
          if (seen[k]) continue;
          seen[k] = true;
          const first = cur.first < 0 ? from2 : cur.first;
          if (k === gk) return { dist, first };
          next.push({ b: nb, first });
        }
      }
      frontier = next;
    }
    return { dist: -1, first: -1 };
  },

  gen(stage) {
    const want = this.movesFor(stage);
    const target = shuffle(SHOWDOWN_IDS.concat([null]));
    // 목표에서 BFS로 배치 720개의 최소 이동 수를 모두 구한 뒤, 이 판 난이도에 맞는 배치를 뽑는다
    // (거꾸로 섞어 만든 배치라 항상 풀 수 있고, 최소 수도 정확히 안다)
    const dist = { [this.key(target)]: 0 }, byDist = {};
    let frontier = [target], d = 0;
    while (frontier.length) {
      d++;
      const next = [];
      for (const cur of frontier) {
        for (const from of this.neighbors(this.blankOf(cur))) {
          const nb = this.slide(cur, from);
          const k = this.key(nb);
          if (dist[k] !== undefined) continue;
          dist[k] = d;
          (byDist[d] || (byDist[d] = [])).push(nb);
          next.push(nb);
        }
      }
      frontier = next;
    }
    // 이 스테이지의 목표 수와 정확히 같은 배치 중에서 뽑기 (없으면 가장 가까운 수로)
    let pool = byDist[want];
    for (let w = 1; !pool && w <= 21; w++) pool = byDist[want - w] || byDist[want + w];
    const pick = pool[Math.floor(Math.random() * pool.length)];
    this.stage = stage;
    this.board = pick.slice();
    this.target = target;
    this.minMoves = dist[this.key(pick)];
    this.moves = 0; this.solved = false; this.busy = false;
    this.hintsLeft = CONFIG.showdown.hintsPerTry;
    SHOWDOWN_IDS.forEach(id => { const pre = new Image(); pre.src = gifUrl(id); });
  },

  tileHtml(id) {
    return '<button class="sd-tile" data-sd="' + id + '" aria-label="' + esc(POKEMON_KO[id - 1]) + '">' +
      '<span><img data-mid="' + id + '" src="' + gifUrl(id) + '" alt="" onerror="sdImgFail(this)"></span></button>';
  },
  miniHtml(arr) {
    return '<div class="sd-mini">' + arr.map((id, i) =>
      '<div class="mc' + (id === null ? " blank" : "") + '"><span class="rk">' + (i + 1) + "</span>" +
      (id === null ? "" : '<img data-mid="' + id + '" src="' + gifUrl(id) + '" alt="" onerror="sdImgFail(this)">') +
      "</div>").join("") + "</div>";
  },

  place() { // 타일을 현재 칸 위치로 이동 (CSS transition이 슬라이드 연출)
    this.board.forEach((id, i) => {
      if (id === null) return;
      const el = document.querySelector('.sd-tile[data-sd="' + id + '"]');
      if (!el) return;
      el.style.transform = "translate(" + (i % SD_COLS) * 100 + "%," + Math.floor(i / SD_COLS) * 100 + "%)";
    });
    this.markMovable();
  },
  markMovable() {
    const movable = this.neighbors(this.blankOf(this.board));
    document.querySelectorAll(".sd-tile").forEach(el => {
      const at = this.board.indexOf(Number(el.dataset.sd));
      el.classList.toggle("movable", !this.solved && movable.includes(at));
      el.classList.remove("hintme");
    });
  },
  updateHud() {
    const m = $("#sd-moves"), b = $("#sd-board");
    if (m) m.textContent = "👣 " + this.moves + "수";
    if (b) b.classList.toggle("done", this.solved);
  },

  tap(id) {
    if (this.solved || this.busy) return;
    const at = this.board.indexOf(id);
    const next = this.slide(this.board, at);
    if (!next) { SFX.wrong(); return; } // 빈자리와 안 붙어 있으면 못 움직임
    this.board = next;
    this.moves++;
    SFX.click();
    this.place();
    this.updateHud();
    if (this.key(this.board) === this.key(this.target)) this.win();
  },

  hint() {
    if (this.solved || this.busy) return;
    if (this.hintsLeft <= 0) { toast("💡 힌트는 스테이지마다 " + CONFIG.showdown.hintsPerTry + "번만 쓸 수 있어요!", 2000); return; }
    const sol = this.solve(this.board, this.target);
    if (sol.first < 0) return;
    this.hintsLeft--;
    const id = this.board[sol.first];
    const el = document.querySelector('.sd-tile[data-sd="' + id + '"]');
    if (el) { el.classList.add("hintme"); later(() => el.classList.remove("hintme"), 2400); }
    toast("💡 " + josa(POKEMON_KO[id - 1], "을를") + " 빈자리로 밀어 봐요!", 2200);
    const btn = $("#sd-hint");
    if (btn && this.hintsLeft <= 0) { btn.disabled = true; btn.textContent = "💡 힌트 다 썼어요"; }
  },

  win() {
    if (this.solved) return;
    this.solved = true;
    this.busy = true;
    this.updateHud();
    this.markMovable();
    const band = this.bandOf(this.stage);
    const first = this.stage === this.nextStage() && !this.isCleared(this.stage); // 이 스테이지 최초 클리어?
    const last = first && this.stage >= CONFIG.showdown.stages;
    let rewardLine;
    if (first) {
      SAVE.showdownStage = Math.min(CONFIG.showdown.stages + 1, this.stage + 1); // 다음 스테이지 해금
      addCoins(band.coin, window.innerWidth / 2, window.innerHeight * 0.4);
      rewardLine = band.emoji + " " + band.label + " 스테이지 클리어 보상 <b>+" + band.coin + "</b>";
    } else {
      rewardLine = "🔁 이미 깬 스테이지라 코인은 없어요 (연습은 언제든 자유!)";
    }

const KO_JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const KO_FLAT = "ㅗㅛㅜㅠㅡ";           // 가로모음 (초성이 위, 모음이 아래)
const KO_MIX = "ㅘㅙㅚㅝㅞㅟㅢ";        // 섞임모음 (모음이 상자 전체를 감싼다)
// 음절 짜임새별 자리 [x0,y0,x1,y1]
const KO_BOX = {
  V:  { cho: [4,8,54,92],  jung: [54,4,96,96] },
  Vb: { cho: [4,4,52,58],  jung: [52,2,96,60], jong: [14,60,86,97] },
  H:  { cho: [20,6,80,50], jung: [4,50,96,94] },
  Hb: { cho: [24,2,76,34], jung: [4,34,96,66], jong: [24,64,76,97] },

  Cb: { cho: [6,2,48,38],  jung: [2,0,98,72], jong: [20,68,80,97] },
};
function fitStrokes(strokes, b) {
  const [x0, y0, x1, y1] = b;
  return strokes.map(st => st.map(p => [
    +(x0 + p[0] / 100 * (x1 - x0)).toFixed(1),
    +(y0 + p[1] / 100 * (y1 - y0)).toFixed(1),
  ]));
}
function jamoStrokes(j, b) {
  const pair = JAMO_PAIR[j];
  if (pair) { // 나란히 두 개
    const w = (b[2] - b[0]), gap = w * 0.05, mid = b[0] + w / 2;
    return fitStrokes(JAMO[pair[0]] || [], [b[0], b[1], mid - gap, b[3]])
      .concat(fitStrokes(JAMO[pair[1]] || [], [mid + gap, b[1], b[2], b[3]]));
  }
  return fitStrokes(JAMO[j] || [], b);
}
// 한글 한 글자 → 획 목록 (초성 → 중성 → 종성 순서)
function hangulStrokes(ch) {
  const code = ch.charCodeAt(0) - 0xAC00;
  if (code < 0 || code > 11171) return GLYPHS[ch] || [];
  const cho = KO_CHO[Math.floor(code / 588)];
  const jung = KO_JUNG[Math.floor((code % 588) / 28)];
  const jong = KO_JONG[code % 28];
  const type = KO_MIX.indexOf(jung) >= 0 ? "C" : KO_FLAT.indexOf(jung) >= 0 ? "H" : "V";
  const box = KO_BOX[type + (jong ? "b" : "")];
  let out = jamoStrokes(cho, box.cho).concat(jamoStrokes(jung, box.jung));
  if (jong) out = out.concat(jamoStrokes(jong, box.jong));
  // 음절 전체를 네모 칸(8~92) 안쪽으로 밀어넣기 — 획 끝의 둥근 마감까지 칸을 넘지 않게
  return fitStrokes(out, [13, 13, 87, 87]);
}

// 꺾이지 않게 부드러운 곡선으로 (Catmull-Rom → 베지어)
function smoothD(pts) {
  if (pts.length < 3) return "M" + pts.map(p => p[0] + " " + p[1]).join(" L ");
  let d = "M" + pts[0][0] + " " + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += " C" + c1[0].toFixed(1) + " " + c1[1].toFixed(1) + "," +
         c2[0].toFixed(1) + " " + c2[1].toFixed(1) + "," + p2[0] + " " + p2[1];
  }
  return d;
}
// 획을 일정 간격 체크포인트로 (판정용)
function samplePts(pts, step) {
  const out = [pts[0].slice()];
  let carry = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 0.001) continue;
    let t = (step - carry) / len;
    while (t <= 1) {
      out.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t]);
      t += step / len;
    }
    carry = (carry + len) % step;
  }
  const last = pts[pts.length - 1];
  if (Math.hypot(out[out.length - 1][0] - last[0], out[out.length - 1][1] - last[1]) > 0.5) out.push(last.slice());
  return out;
}

const Trace = {
  stage: 1, list: [], item: null, letters: [], li: 0, char: "",
  raw: [], strokes: [], si: 0, ci: 0, drawing: false, missed: false, ink: [], done: false,
  stall: 0, lastP: null, dirSet: false,

  // 2단계용 단어: 아이 단어에서 3~4글자 + 모두 획 데이터가 있는 것
  words() {
    return WORD_SETS.kid.words.filter(w => /^[a-z]{3,4}$/.test(w.en) && w.en.split("").every(c => GLYPHS[c]));
  },

  // 3단계용 한글 단어 (1~3글자)
  koWords() { return KO_WORDS.filter(w => w[0].length <= 3); },

  start(stage) {
    this.stage = stage === 2 ? 2 : stage === 3 ? 3 : 1;
    const n = this.stage === 1 ? CONFIG.trace.rounds1 : CONFIG.trace.rounds2;
    Session.reset("trace", n);
    SAVE.stats.gamesPlayed.trace = (SAVE.stats.gamesPlayed.trace || 0) + 1;
    saveNow();
    lastGame = { restart: () => Trace.start(this.stage) };
    this.pend = 0;
    if (this.stage === 1) {
      const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const pool = shuffle(upper.concat(upper.map(c => c.toLowerCase())));
      this.list = pool.slice(0, n);
    } else if (this.stage === 3) {
      this.list = shuffle(this.koWords()).slice(0, n).map(w => ({ en: w[0], ko: "", emoji: w[1], ko2: w[0] }));
    } else {
      this.list = shuffle(this.words()).slice(0, n);
    }
    showScreen("tracePlay");
  },

  question() {
    this.item = this.list[Session.round];
    if (!this.item) { Result.show(); return; } // 낼 문제가 없으면 바로 결과로 (안전장치)
    Session.round++;
    setProgress();
    this.missed = false;
    this.li = 0;
    this.letters = this.stage === 1 ? [String(this.item)] : this.item.en.split("");
    this.renderAll();
  },

  loadChar() {
    this.char = this.letters[this.li];
    this.raw = this.stage === 3 ? hangulStrokes(this.char) : (GLYPHS[this.char] || GLYPHS.l);
    this.strokes = this.raw.map(pts => samplePts(pts, 4.5));
    this.si = 0; this.ci = 0; this.ink = []; this.drawing = false; this.done = false;
    this.stall = 0; this.lastP = null; this.dirSet = false;
  },

  // 단어 시작 팝업: 그림 + 단어 + 뜻을 크게 보여주고, 터치하면 따라쓰기 시작

  // 대문자를 그대로 넘기면 "capital Q"처럼 읽는 음성이 있어 소문자로 보낸다 (글자 이름은 같음)
  say() {

  // 공책 줄 — 알파벳은 4선, 한글은 네모 칸
  rulesHtml() {
    if (this.stage === 3) {
      return '<rect class="tr-rule box" x="8" y="8" width="84" height="84" rx="6"/>' +
        '<line class="tr-rule mid" x1="50" y1="8" x2="50" y2="92"/>' +

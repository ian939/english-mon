<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>잉글리시몬 — 영어 단어 모험</title>
<!--
  잉글리시몬: 초등 1학년 영어 단어 학습 게임 (단일 HTML 파일)
  - 개인·가정 교육용. 포켓몬 이미지는 PokeAPI 스프라이트(온라인)를 사용하며 배포/상업적 이용 금지.
  - file:// 로 더블클릭 실행 가능. 저장은 localStorage (폴더를 옮기면 저장이 초기화될 수 있음).
-->
<style>
:root {
  --bg1: #aee3ff;
  --bg2: #d8f3ff;
  --card: #ffffff;
  --ink: #2d3a4a;
  --ink-soft: #6b7a8c;
  --accent: #ff5a5f;
  --accent2: #ffb703;
  --good: #2ec46f;
  --bad: #ff5a5f;
  --blue: #3d8bfd;
  --purple: #9b5de5;
  --shadow: 0 6px 0 rgba(45,58,74,.12), 0 10px 24px rgba(45,58,74,.10);
  --radius: 22px;
  --font: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, #eafaf1 100%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow-x: hidden;
}
img { -webkit-user-drag: none; }

#app {
  max-width: 620px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 12px 14px 28px;
  display: flex;
  flex-direction: column;
}
.screen { animation: screenIn .28s ease-out both; flex: 1; display: flex; flex-direction: column; }
@keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ===== 상단 바 ===== */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.topbar .spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--card); border-radius: 999px; padding: 7px 13px;
  font-weight: 800; font-size: 16px; box-shadow: var(--shadow);
  white-space: nowrap;
}
.chip small { font-weight: 700; color: var(--ink-soft); font-size: 12px; }
.mode-chip { border: none; cursor: pointer; font-family: var(--font); background: linear-gradient(135deg, #e3f0ff, #f3e8ff); transition: transform .1s; }
.mode-chip:active { transform: scale(.93); }
/* 부모 코스/레벨 선택 바 */
.course-bar {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  margin: -4px 0 10px; flex-wrap: wrap;
}
.course-btn {
  border: none; cursor: pointer; font-family: var(--font);
  background: var(--card); box-shadow: var(--shadow); border-radius: 999px;
  padding: 8px 16px; font-weight: 900; font-size: 14px; color: var(--ink-soft);
  transition: transform .1s;
}
.course-btn:active { transform: scale(.93); }
.course-btn.on { background: var(--purple); color: #fff; }
.course-btn.lv { padding: 8px 12px; font-size: 13px; }
.course-btn.lv.on { background: var(--blue); }
.lv-divider { width: 2px; height: 20px; background: #d5dfe8; border-radius: 2px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none;
  background: var(--card); box-shadow: var(--shadow);
  font-size: 20px; cursor: pointer; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .1s;
}
.icon-btn:active { transform: scale(.9); }
.icon-btn.off { opacity: .45; filter: grayscale(1); }

/* ===== 공용 버튼 ===== */
.btn {
  font-family: var(--font);
  border: none; cursor: pointer;
  border-radius: var(--radius);
  font-weight: 800; color: #fff;
  background: var(--blue);
  box-shadow: 0 5px 0 rgba(0,0,0,.18);
  transition: transform .08s, box-shadow .08s, filter .15s;
  padding: 14px 20px; font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
.btn:disabled { filter: grayscale(.7) opacity(.55); pointer-events: none; }
.btn.green { background: var(--good); }
.btn.red { background: var(--accent); }
.btn.yellow { background: var(--accent2); color: #6b4a00; }
.btn.purple { background: var(--purple); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.btn.big { font-size: 22px; padding: 18px 24px; border-radius: 26px; }
.btn.wide { width: 100%; }

/* ===== 홈 화면 ===== */
.home-title {
  text-align: center; margin: 10px 0 2px;
  font-size: clamp(34px, 9vw, 46px); font-weight: 900; letter-spacing: -1px;
  color: #1f3550;
  text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(31,53,80,.18);
}
.home-title .mon { color: var(--accent); }
.home-sub { text-align: center; color: var(--ink-soft); font-weight: 700; margin-bottom: 14px; font-size: 15px; }
.home-hero { text-align: center; font-size: clamp(56px, 16vw, 84px); margin: 4px 0 10px; }
@keyframes heroBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
.home-menu { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
.mode-btn {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: var(--card); border: none; cursor: pointer;
  border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow);
  transition: transform .1s;
}
.mode-btn:active { transform: scale(.97); }
.mode-btn .mi { font-size: 34px; width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.mode-btn .mt { font-size: 19px; font-weight: 900; }
.mode-btn .md { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }
.mode-btn .arrow { margin-left: auto; font-size: 20px; color: #c3ced9; }
.mode-btn.adventure { background: linear-gradient(135deg, #fff6e5, #ffe9c7); }
.mode-btn.locked { filter: grayscale(.9); opacity: .55; }
.mode-btn.locked .arrow { font-size: 16px; color: #8fa1b3; }
.mode-btn.pulse { animation: pulseGlow 1.6s ease-in-out infinite; }
@keyframes pulseGlow {
  0%,100% { box-shadow: var(--shadow); }
  50% { box-shadow: 0 6px 0 rgba(255,90,95,.25), 0 0 0 6px rgba(255,183,3,.25); }
}
.home-foot { text-align: center; color: #9fb3c8; font-size: 11px; margin-top: 18px; font-weight: 600; }

/* ===== 카테고리 선택 ===== */
.page-title { font-size: 22px; font-weight: 900; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; }
.seg { display: flex; background: var(--card); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); margin-bottom: 14px; }
.seg button {
  flex: 1; border: none; background: transparent; cursor: pointer;
  border-radius: 999px; padding: 10px 6px; font-family: var(--font);
  font-weight: 800; font-size: 13.5px; color: var(--ink-soft);
  transition: background .15s, color .15s;
}
.seg button.on { background: var(--blue); color: #fff; }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat-card {
  background: var(--card); border: none; cursor: pointer;
  border-radius: 18px; padding: 12px 6px 10px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .1s;
}
.cat-card:active { transform: scale(.94); }
.cat-card .ce { font-size: 30px; }
.cat-card .cn { font-weight: 800; font-size: 13.5px; }
.cat-card .cc { font-size: 11px; color: var(--ink-soft); font-weight: 700; }
.cat-card.all { background: linear-gradient(135deg, #e0f0ff, #d3f8e8); grid-column: 1 / -1; flex-direction: row; justify-content: center; padding: 14px; }
.cat-card.all .ce { font-size: 26px; }
.cat-card.all .cn { font-size: 16px; }

/* ===== 게임 공통 ===== */
.game-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.progress { flex: 1; height: 14px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(45,58,74,.12); }
.progress > i { display: block; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #2ec46f, #7be495); transition: width .3s ease; }
.combo-chip { font-weight: 900; font-size: 15px; color: #ff7b00; min-width: 60px; text-align: right; }
.combo-chip.hot { animation: comboPop .3s ease; }
@keyframes comboPop { 50% { transform: scale(1.35); } }

.prompt-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px 16px; text-align: center; margin-bottom: 14px; position: relative;
}
.prompt-emoji { font-size: clamp(64px, 18vw, 96px); line-height: 1.15; }
.prompt-emoji .colorball { display: inline-block; width: .95em; height: .95em; border-radius: 50%; vertical-align: -0.08em; border: 4px solid rgba(255,255,255,.9); box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.prompt-ko { font-size: 26px; font-weight: 900; margin-top: 4px; }
.prompt-en { font-size: clamp(34px, 9vw, 44px); font-weight: 900; letter-spacing: 1px; color: #1f3550; }
.prompt-hint { font-size: 14px; color: var(--ink-soft); font-weight: 700; margin-top: 6px; }
.speak-btn {
  border: none; cursor: pointer; border-radius: 50%;
  width: 84px; height: 84px; font-size: 40px;
  background: linear-gradient(135deg, #3d8bfd, #6fb1ff); color: #fff;
  box-shadow: 0 6px 0 rgba(23,74,153,.35);
  transition: transform .1s;
}
.speak-btn:active { transform: scale(.92); }
.speak-btn.small { width: 48px; height: 48px; font-size: 22px; position: absolute; right: 10px; top: 10px; box-shadow: 0 4px 0 rgba(23,74,153,.3); }
.speak-btn.nudge { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices.list { grid-template-columns: 1fr; }
.choice {
  border: none; cursor: pointer; border-radius: 20px;
  background: var(--card); box-shadow: var(--shadow);
  padding: 14px 10px; min-height: 74px;
  font-family: var(--font); font-weight: 900; color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .1s, background .15s;
  position: relative; overflow: hidden;
}
.choice:active { transform: scale(.96); }
.choice .en { font-size: 21px; letter-spacing: .5px; }
.choice .en u { text-decoration: underline 3px var(--accent2); }
.choice .em { font-size: 30px; line-height: 1.1; }
.choice .ko { font-size: 15px; }
.choice .em .colorball { display: inline-block; width: .9em; height: .9em; border-radius: 50%; vertical-align: -0.06em; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
.choice .en-hint { font-size: 13px; color: var(--ink-soft); font-weight: 800; letter-spacing: .5px; }
.choice .en-hint u { text-decoration: underline 3px var(--accent2); font-size: 15px; color: #ff7b00; }
.choice.wrong { animation: shake .4s ease; background: #ffe3e3; opacity: .55; pointer-events: none; }
.choice.right { background: #d9f7e7; animation: rightPop .45s ease; }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-6px) } 80% { transform: translateX(4px) } }
@keyframes rightPop { 0% { transform: scale(1) } 40% { transform: scale(1.08) } 100% { transform: scale(1) } }

.choice .en .fl { color: var(--blue); }

/* ===== 아이 모드 집중 학습 — 보기 준비 시간 + 오답 코치 ===== */
/* 문제가 나온 직후·오답 직후엔 잠깐 못 누름 (읽고 생각할 시간) */
.choices.arming .choice, .spell-tiles.arming .spell-tile { opacity: .48; pointer-events: none; }
.choices .choice, .spell-tiles .spell-tile { transition: opacity .18s ease, transform .1s, background .15s; }
.coach-line {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 8px;
  background: #fff8e1; border: 2px solid #ffe08a; border-radius: 16px;
  padding: 9px 12px 11px; margin: 0 0 10px;
  font-size: 15px; font-weight: 800; color: #7a5b00; line-height: 1.45;
  animation: coachIn .2s ease;
}
.coach-line .cf { font-size: 22px; flex: none; }
.coach-line b { color: var(--ink); }
.coach-line .ct { flex: 1; }
/* 코치 줄의 다시 듣기 버튼 — 멈춤 중에도 몇 번이든 들을 수 있어요 */
.coach-line .coach-speak {
  flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
  background: #ffb703; color: #fff; font-size: 20px; line-height: 1;
  box-shadow: 0 3px 8px rgba(255,150,0,.35);
}
.coach-line .coach-speak:active { transform: scale(.92); }
body.granny .coach-line .coach-speak { width: 48px; height: 48px; font-size: 24px; }
.coach-line .cbar { position: absolute; left: 0; bottom: 0; height: 4px; background: #ffb703; animation: coachTick linear forwards; }
@keyframes coachIn { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@keyframes coachTick { from { width: 100% } to { width: 0 } }
body.granny .coach-line { font-size: 18px; }

/* ===== 스펠링 타일 팝업 ===== */
#spell-wrap {
  position: fixed; inset: 0; background: rgba(31,53,80,.55); z-index: 85;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fadeIn .2s ease;
}
.spell-card {
  background: var(--card); border-radius: 26px; padding: 16px 14px 18px;
  width: 100%; max-width: 420px; text-align: center;
  border: 3px solid #ffd166;
  box-shadow: 0 20px 50px rgba(31,53,80,.35), 0 0 0 5px rgba(255,209,102,.25);
  animation: modalIn .25s cubic-bezier(.2,1.4,.4,1) both;
}
.spell-banner {
  background: linear-gradient(90deg, #ffd166, #ffb703, #ffd166);
  color: #6b4a00; font-weight: 900; font-size: 17px;
  border-radius: 999px; padding: 8px 14px; margin-bottom: 6px;
  animation: pulseGlow 1.6s ease-in-out infinite;
}
.spell-sub { font-size: 13.5px; font-weight: 800; color: #b07b00; margin-bottom: 8px; }
.spell-slots { display: flex; gap: 7px; justify-content: center; margin: 16px 0 18px; flex-wrap: wrap; }
.spell-slot {
  width: 46px; height: 54px; border-bottom: 4px solid #c3ced9; border-radius: 6px 6px 0 0;
  background: #f4f8fc; font-size: 32px; font-weight: 900; color: #1f3550;
  display: flex; align-items: center; justify-content: center;
}
.spell-slot.filled { border-bottom-color: var(--good); background: #eafff3; animation: rightPop .35s ease; }
.spell-slot.prefilled { color: #9fb3c8; background: #eef2f6; border-bottom-color: #dfe6ec; }
.spell-slots.compact .spell-slot { width: 34px; height: 44px; font-size: 22px; }

/* 문장 문제 */
.sent-en { font-size: 23px; font-weight: 900; color: #1f3550; margin-top: 8px; line-height: 1.4; }
.sent-en u { text-decoration: underline 3px var(--accent2); color: var(--blue); }
.sent-ko { font-size: 14.5px; font-weight: 700; color: var(--ink-soft); margin-top: 7px; }
.sent-slots { flex-wrap: wrap; gap: 6px; }
.spell-slot.word-slot { width: auto; min-width: 44px; padding: 0 10px; font-size: 17px; white-space: nowrap; }
.spell-tile.word-tile {
  width: auto; min-width: 52px; padding: 0 16px; height: 52px;
  font-size: 19px; white-space: nowrap;
}
.spell-tiles { display: flex; gap: 9px; justify-content: center; flex-wrap: wrap; }
.spell-tile {
  width: 54px; height: 58px; border: none; cursor: pointer; border-radius: 16px;
  background: var(--card); box-shadow: var(--shadow);
  font-family: var(--font); font-size: 28px; font-weight: 900; color: var(--ink);
  transition: transform .1s;
}
.spell-tile:active { transform: scale(.9); }
.spell-tile.used { opacity: .15; pointer-events: none; }
.spell-tile.wrong { animation: shake .4s ease; background: #ffe3e3; }
.spell-tile.hint { animation: nudge 1s ease-in-out infinite; background: #d9e9ff; color: var(--blue); }

.answer-banner {
  position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%) scale(.6);
  background: var(--card); border-radius: 26px; box-shadow: 0 16px 40px rgba(31,53,80,.3);
  padding: 20px 34px; text-align: center; z-index: 60; opacity: 0;
  animation: bannerIn .5s ease forwards; pointer-events: none;
}
.answer-banner .be { font-size: 54px; }
.answer-banner .bn { font-size: 26px; font-weight: 900; color: #1f3550; letter-spacing: .5px; }
.answer-banner .bk { font-size: 16px; font-weight: 800; color: var(--ink-soft); }
@keyframes bannerIn { to { opacity: 1; transform: translate(-50%,-50%) scale(1); } }

/* ===== 끝말잇기 ===== */
.chain-last { color: #ff7b00; text-decoration: underline 4px #ffd166; }
.train-track { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: none; }
.train-track::-webkit-scrollbar { display: none; }
.train-car {
  flex: 0 0 auto; background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
  padding: 7px 11px; font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 5px;
  animation: carIn .35s ease both;
}
.train-car .te { font-size: 17px; }
@keyframes carIn { from { transform: translateX(24px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

/* ===== 짝맞추기 ===== */
.memory-grid { display: grid; gap: 8px; grid-template-columns: repeat(4, 1fr); flex: 0 0 auto; }
.mcard { perspective: 600px; aspect-ratio: 3 / 3.4; }
.mcard .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .35s; }
.mcard.flip .inner { transform: rotateY(180deg); }
.mcard .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 4px 0 rgba(45,58,74,.12);
}
.mcard .back { background: linear-gradient(135deg, #6fb1ff, #3d8bfd); color: #fff; font-size: 24px; }
.mcard .front { background: var(--card); transform: rotateY(180deg); padding: 4px; }
.mcard .front.t-en { border: 3px solid #6fb1ff; }
.mcard .front.t-ko { border: 3px solid #58d6a0; }
.mcard .front .fe { font-size: clamp(20px, 6.5vw, 32px); line-height: 1.05; }
.mcard .front .fe .colorball { display: inline-block; width: .9em; height: .9em; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
.mcard .front .fw { font-weight: 900; font-size: clamp(11px, 3.4vw, 15px); text-align: center; word-break: break-all; line-height: 1.1; }
.mcard.matched { pointer-events: none; }
.mcard.matched .inner { animation: matchGlow .6s ease; }
.mcard.matched .front { background: #eafff3; }
@keyframes matchGlow { 0% { transform: rotateY(180deg) scale(1) } 50% { transform: rotateY(180deg) scale(1.12) } 100% { transform: rotateY(180deg) scale(1) } }

/* ===== 결과 화면 ===== */
.result-wrap { text-align: center; padding-top: 12px; }
.result-stars { font-size: clamp(48px, 14vw, 64px); letter-spacing: 6px; margin: 8px 0; }
.result-stars .dim { opacity: .22; filter: grayscale(1); }
.star-pop { display: inline-block; animation: starPop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes starPop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.result-title { font-size: 26px; font-weight: 900; }
.result-sub { color: var(--ink-soft); font-weight: 700; margin: 4px 0 14px; }
.coin-earn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 999px; padding: 12px 22px;
  font-size: 22px; font-weight: 900; box-shadow: var(--shadow); margin-bottom: 16px;
}
.result-btns { display: flex; flex-direction: column; gap: 10px; max-width: 340px; margin: 0 auto; }

/* ===== 상점 ===== */
.shop-list { display: flex; flex-direction: column; gap: 10px; }
.shop-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 14px;
}
.shop-item .se { font-size: 38px; flex: 0 0 auto; }
.shop-item .sn { font-weight: 900; font-size: 17px; }
.shop-item .sd { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin-top: 2px; }
.shop-item .own { font-size: 12px; font-weight: 800; color: var(--blue); margin-top: 2px; }
.shop-item .buy { margin-left: auto; flex: 0 0 auto; padding: 10px 14px; font-size: 15px; border-radius: 16px; }
.shop-item.cant .buy { filter: grayscale(.8) opacity(.5); pointer-events: none; }

/* ===== 모험 / 포획 ===== */
.adv-scene {
  position: relative; border-radius: 26px; overflow: hidden;
  min-height: 340px; box-shadow: var(--shadow);
  margin-bottom: 12px;
}
/* 타입별 배틀 배경 (하늘 58% / 땅 42%) */
.bg-meadow   { background: linear-gradient(180deg, #8fd3ff 0%, #c9f0d8 58%, #7ccf8e 58%, #5fbf77 100%); }
.bg-forest   { background: linear-gradient(180deg, #79c9a9 0%, #b4ecc9 58%, #4e9d5f 58%, #3d7f4c 100%); }
.bg-sea      { background: linear-gradient(180deg, #79c9f5 0%, #b8e8ff 58%, #3a8fd9 58%, #2a6fb0 100%); }
.bg-ice      { background: linear-gradient(180deg, #a8ddf5 0%, #eef9ff 58%, #9fd3ee 58%, #7db8dd 100%); }
.bg-fire     { background: linear-gradient(180deg, #55282d 0%, #b85a2e 58%, #7a2f1d 58%, #571f12 100%); }
.bg-electric { background: linear-gradient(180deg, #454568 0%, #8a86b8 58%, #c9b64a 58%, #a3923a 100%); }
.bg-psychic  { background: linear-gradient(180deg, #6a4a9e 0%, #c9a0f0 58%, #7a5ab8 58%, #5a3f96 100%); }
.bg-night    { background: linear-gradient(180deg, #23244d 0%, #55558f 58%, #3a3a6a 58%, #28285a 100%); }
.bg-rock     { background: linear-gradient(180deg, #b9c4d0 0%, #e8ddc4 58%, #a08668 58%, #82684e 100%); }
.bg-swamp    { background: linear-gradient(180deg, #5f6d8a 0%, #93a86f 58%, #4a5e3d 58%, #384a2f 100%); }
.bg-dragon   { background: linear-gradient(180deg, #26365e 0%, #4a5e9e 58%, #32406e 58%, #232d50 100%); }

.battle-platform { position: absolute; border-radius: 50%; background: rgba(0,0,0,.16); }
.platform-enemy { right: 5%; top: 47%; width: 40%; height: 34px; }
.platform-ally { left: 3%; bottom: 58px; width: 44%; height: 38px; }

.grass-patch { position: absolute; right: 17%; top: 34%; font-size: 46px; z-index: 2; transform-origin: 50% 90%; animation: grassShake .35s ease-in-out infinite; }
@keyframes grassShake { 0%,100% { transform: rotate(-7deg) scale(1); } 50% { transform: rotate(9deg) scale(1.1); } }

.adv-enemy { position: absolute; right: 6%; top: 13%; width: 40%; text-align: center; z-index: 2; animation: idleBob 2.2s ease-in-out infinite; }
@keyframes idleBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.adv-enemy img {
  height: clamp(96px, 27vw, 148px); width: auto; max-width: 100%; object-fit: contain;
  image-rendering: pixelated;
  filter: drop-shadow(0 8px 8px rgba(0,0,0,.3));
  animation: monIn .45s cubic-bezier(.2,1.4,.4,1) both;
}
.adv-enemy img.art { image-rendering: auto; }
@keyframes monIn { from { transform: scale(0) translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
.adv-enemy .fallback {
  width: clamp(90px, 24vw, 120px); height: clamp(90px, 24vw, 120px); border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #ff6b6b 49%, #fff 51%);
  display: flex; align-items: center; justify-content: center; font-size: 44px; margin: 0 auto;
  box-shadow: 0 8px 16px rgba(0,0,0,.2);
}
.sucked { animation: suckIn .35s ease-in forwards !important; }
@keyframes suckIn { to { transform: scale(0) translateY(-16px); filter: brightness(4); opacity: .15; } }
.reappear { animation: monIn .35s ease-out both !important; }
.fleeing { animation: fleeRun .6s ease-in forwards !important; }
@keyframes fleeRun { to { transform: translateX(150px); opacity: 0; } }

.adv-ally { position: absolute; left: 7%; bottom: 62px; z-index: 2; text-align: center; }
.adv-ally img {
  height: clamp(78px, 21vw, 116px); width: auto; image-rendering: pixelated;
  filter: drop-shadow(0 6px 6px rgba(0,0,0,.3));
  animation: allyIn .4s ease-out both;
}
.adv-ally img.art { image-rendering: auto; }
@keyframes allyIn { from { transform: translateX(-30px); opacity: 0 } to { transform: none; opacity: 1 } }
.ally-label { font-size: 11px; font-weight: 900; background: rgba(255,255,255,.88); border-radius: 999px; padding: 2px 9px; display: inline-block; margin-top: 2px; }

.nameplate {
  position: absolute; left: 10px; top: 10px; z-index: 3;
  background: rgba(255,255,255,.94); border-radius: 14px; padding: 8px 12px 9px;
  box-shadow: 0 3px 10px rgba(0,0,0,.18); min-width: 47%;
  animation: plateIn .35s ease-out both;
}
@keyframes plateIn { from { transform: translateX(-24px); opacity: 0 } to { transform: none; opacity: 1 } }
.nameplate .np-name { font-weight: 900; font-size: 15px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.nameplate .type-chip { font-size: 10px; padding: 2px 8px; margin: 2px 2px 0 0; }
.hpwrap { display: flex; align-items: center; gap: 5px; margin-top: 5px; }
.hpwrap .hplabel { font-size: 9px; font-weight: 900; color: #e8a200; letter-spacing: 1px; }
.hpbar { flex: 1; height: 8px; background: #e2e8ee; border-radius: 99px; overflow: hidden; }
.hpbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #2ec46f, #7be495); border-radius: 99px; transition: width .5s; }

.battle-dialog {
  position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 4;
  background: rgba(255,255,255,.96); border: 2.5px solid rgba(45,58,74,.25);
  border-radius: 14px; padding: 11px 14px; font-weight: 800; font-size: 15px;
  min-height: 46px; color: var(--ink);
}
.battle-ball { position: absolute; font-size: 34px; z-index: 5; transition: transform .65s cubic-bezier(.4,-.3,.65,1); }

.ally-attack { animation: allyLunge .45s ease-out; }
@keyframes allyLunge { 30% { transform: translate(28px, -16px); } 100% { transform: none; } }
.fx-projectile {
  position: absolute; font-size: 30px; z-index: 6;
  transition: transform .45s ease-in;
  filter: drop-shadow(0 0 6px rgba(255,255,255,.8));
}
.enemy-hit { animation: hitShake .5s ease !important; }
@keyframes hitShake {
  0%,100% { transform: translate(0); filter: none; }
  15% { transform: translate(-9px,2px); filter: brightness(2.2); }
  35% { transform: translate(8px,-2px); }
  55% { transform: translate(-6px,1px); filter: brightness(1.6); }
  75% { transform: translate(5px,0); }
}
.hit-burst { position: absolute; left: 32%; top: 22%; font-size: 46px; z-index: 6; animation: burstPop .55s ease-out forwards; }
@keyframes burstPop { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }

.battle-quiz .bq-title { text-align: center; font-size: 13.5px; font-weight: 800; color: var(--ink-soft); margin-bottom: 8px; }
.battle-quiz .bq-prompt {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: var(--card); border-radius: 16px; box-shadow: var(--shadow);
  padding: 10px 14px; margin-bottom: 10px;
}
.battle-quiz .bq-prompt .bqe { font-size: 34px; }
.battle-quiz .bq-prompt .bqe .colorball { display: inline-block; width: .9em; height: .9em; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,.18); }
.battle-quiz .bq-prompt .bqk { font-size: 19px; font-weight: 900; }
.battle-quiz .choices { grid-template-columns: 1fr; gap: 8px; }
.battle-quiz .choice { min-height: 52px; flex-direction: row; gap: 10px; padding: 9px 12px; }
.pct-up { color: var(--good); font-weight: 900; }

/* 전설 등장 임팩트 — 화면 흔들림 + 섬광 */
@keyframes screenShake {
  0%, 100% { transform: translate(0, 0); }
  8% { transform: translate(-9px, 4px) rotate(-.5deg); }
  18% { transform: translate(8px, -5px) rotate(.5deg); }
  28% { transform: translate(-7px, -3px); }
  38% { transform: translate(6px, 5px) rotate(.4deg); }
  50% { transform: translate(-5px, 2px); }
  62% { transform: translate(4px, -3px); }
  74% { transform: translate(-3px, 1px); }
  86% { transform: translate(2px, -1px); }
}
body.shake #app { animation: screenShake .85s cubic-bezier(.36,.07,.19,.97) both; }
#legend-flash {
  position: fixed; inset: 0; z-index: 88; pointer-events: none;
  background: radial-gradient(circle at 50% 42%, rgba(255,255,255,.95), rgba(255,214,102,.5) 45%, transparent 72%);
  animation: legendFlash .85s ease-out forwards;
}
@keyframes legendFlash {
  0% { opacity: 0; }
  12% { opacity: 1; }
  100% { opacity: 0; }
}
.legend-cry { position: fixed; left: 0; right: 0; top: 32%; z-index: 89; text-align: center; pointer-events: none;
  font-size: clamp(26px, 8vw, 38px); font-weight: 900; color: #fff;
  text-shadow: 0 0 18px rgba(255,180,0,.95), 0 3px 10px rgba(0,0,0,.5);
  animation: legendCry 1.6s ease-out forwards; }
@keyframes legendCry {
  0% { opacity: 0; transform: scale(.5); }
  25% { opacity: 1; transform: scale(1.1); }
  70% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}

.star-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.star-overlay span { position: absolute; font-size: 13px; animation: twinkle 1.8s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
.rarity-badge { display: inline-block; font-size: 13px; font-weight: 900; padding: 3px 10px; border-radius: 999px; margin-left: 5px; vertical-align: 2px; }
.rb-common { background: #e6edf4; color: #5b6b7c; }
.rb-rare { background: #d9e9ff; color: #1f66d0; }
.rb-unique { background: #fff1c9; color: #a06a00; }
.rb-legendary { background: linear-gradient(90deg, #ffe29a, #ffb6e2, #b8c4ff); color: #6a2ea0; }

.type-chip {
  display: inline-block; color: #fff; font-size: 12.5px; font-weight: 900;
  padding: 3px 11px; border-radius: 999px; margin: 2px 3px;
  text-shadow: 0 1px 2px rgba(0,0,0,.18);
}
.type-chip.dark { color: #4a3b00; text-shadow: none; }
.m-types { margin: 2px 0 8px; }
.dex-story {
  text-align: left; background: #f4f8fc; border-radius: 14px; padding: 12px 14px;
  font-size: 14px; color: var(--ink); font-weight: 600; line-height: 1.55; margin-bottom: 14px;
}
.dex-story b { color: #1f66d0; }

.throw-left {
  text-align: center; font-size: 13px; font-weight: 800; color: var(--ink-soft);
  margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 4px;
}
.ball-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ball-btn {
  border: none; cursor: pointer; border-radius: 20px;
  background: var(--card); box-shadow: var(--shadow); padding: 10px 8px;
  font-family: var(--font); display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: transform .1s;
}
.ball-btn:active { transform: scale(.94); }
.ball-btn .bi { font-size: 30px; }
.ball-btn .bn { font-weight: 900; font-size: 14px; }
.ball-btn .bc { font-size: 11.5px; color: var(--ink-soft); font-weight: 800; }
.ball-btn .bp { font-size: 15px; font-weight: 900; }
.ball-btn.none { filter: grayscale(.85) opacity(.5); pointer-events: none; }
.pct-good { color: var(--good); } .pct-mid { color: #e8a200; } .pct-bad { color: var(--accent); }

.wobbling { display: inline-block; animation: wobble .8s ease-in-out infinite; font-size: 54px; transform-origin: 50% 85%; }
@keyframes wobble { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-24deg) } 75% { transform: rotate(24deg) } }
.catch-flash { animation: flashPop .5s ease both; font-size: 54px; }
@keyframes flashPop { 0% { filter: brightness(3); transform: scale(.6); } 100% { filter: none; transform: scale(1); } }

/* ===== 도감 ===== */
.dex-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.dex-count { font-size: 22px; font-weight: 900; }
.dex-sub { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
.gen-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-size: 17px; font-weight: 900; color: var(--ink);
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow);
  padding: 10px 14px; margin: 14px 0 8px;
}
.gen-head.done { background: linear-gradient(135deg, #eaffef, #e7f2ff); }
.gen-head .gen-count { font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.gen-head.done .gen-count { color: var(--good); }
.gen-locked {
  text-align: center; font-size: 13.5px; font-weight: 800; color: var(--ink-soft);
  background: rgba(255,255,255,.6); border-radius: 14px; padding: 14px 12px; margin: 16px 0 6px;
  line-height: 1.5;
}
.region-badge {
  display: inline-block; font-size: 15px; font-weight: 900; color: #6a2ea0;
  background: linear-gradient(90deg, #ffe29a, #ffb6e2, #b8c4ff); background-size: 200% 100%;
  border-radius: 999px; padding: 7px 16px; margin: 6px 0 10px;
  animation: prismShift 3s linear infinite;
}
.dex-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (min-width: 480px) { .dex-grid { grid-template-columns: repeat(5, 1fr); } }
@media (min-width: 600px) { .dex-grid { grid-template-columns: repeat(6, 1fr); } }
.dex-cell {
  background: var(--card); border-radius: 14px; box-shadow: 0 3px 0 rgba(45,58,74,.1);
  padding: 6px 3px 5px; text-align: center; cursor: pointer; border: none; font-family: var(--font);
  transition: transform .1s;
}
.dex-cell:active { transform: scale(.93); }
.dex-cell img { width: 100%; aspect-ratio: 1; object-fit: contain; }
.dex-cell.unseen img { filter: brightness(0) opacity(.75); }
.dex-cell .dn { font-size: 10.5px; font-weight: 800; color: var(--ink); line-height: 1.15; }
.dex-cell.unseen .dn { color: #b6c2cf; }
.dex-cell .dno { font-size: 9px; color: #b6c2cf; font-weight: 700; }
.dex-cell .dcount { position: absolute; }
.dex-cell { position: relative; }
.dex-cell .dupe {
  position: absolute; top: 3px; right: 4px; background: var(--accent2); color: #6b4a00;
  font-size: 9.5px; font-weight: 900; border-radius: 999px; padding: 1px 5px;
}
.dex-cell .qmark { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; color: #c3ced9; }

/* 진화 라인 완성 → 프리즘 카드 (반짝반짝) */
.dex-cell.prism {
  background: linear-gradient(135deg, #ffe9f2, #e9f3ff, #eaffe9, #fff7dd, #f3e9ff, #ffe9f2);
  background-size: 400% 400%;
  animation: prismShift 3.5s linear infinite;
  border: 2px solid rgba(255,255,255,.95);
  box-shadow: 0 3px 12px rgba(155,93,229,.35);
  overflow: hidden;
}
@keyframes prismShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.dex-cell.prism::after {
  content: ""; position: absolute; top: -60%; left: -70%; width: 55%; height: 220%;
  background: linear-gradient(75deg, transparent 40%, rgba(255,255,255,.9) 50%, transparent 60%);
  animation: holoSweep 2.4s ease-in-out infinite;
  pointer-events: none;
}
@keyframes holoSweep { 0% { left: -70%; } 55%, 100% { left: 140%; } }
.dex-cell.prism::before {
  content: "✨"; position: absolute; top: 2px; left: 3px; font-size: 11px; z-index: 2;
  animation: twinkle 1.8s ease-in-out infinite;
}
.dex-cell.prism .dn { color: #7a3ff2; }
.evo-line {
  font-size: 13px; font-weight: 800; color: var(--ink-soft);
  background: #f4f8fc; border-radius: 12px; padding: 8px 10px; margin: 2px 0 8px;
}
.evo-line .prism-tag {
  background: linear-gradient(90deg, #ffb6e2, #b8c4ff, #a8f0c8);
  color: #6a2ea0; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 900;
}

/* ===== 모달/토스트/이펙트 ===== */
#modal-wrap {
  position: fixed; inset: 0; background: rgba(31,53,80,.45); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 20px;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0 } }
.modal {
  background: var(--card); border-radius: 24px; padding: 24px 20px; max-width: 360px; width: 100%;
  text-align: center; box-shadow: 0 20px 50px rgba(31,53,80,.35);
  animation: modalIn .25s cubic-bezier(.2,1.4,.4,1) both; max-height: 84vh; overflow-y: auto;
}
@keyframes modalIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
.modal .m-emoji { font-size: 52px; }
.modal img.m-img { width: 160px; height: 160px; object-fit: contain; }
.modal .m-title { font-size: 21px; font-weight: 900; margin: 6px 0 4px; }
.modal .m-text { font-size: 14.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 16px; line-height: 1.45; }
.modal .m-btns { display: flex; gap: 8px; }
.modal .m-btns .btn { flex: 1; font-size: 16px; padding: 12px 8px; }

#toast {
  position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(80px);
  background: #1f3550; color: #fff; font-weight: 800; font-size: 15px;
  padding: 12px 22px; border-radius: 999px; z-index: 95; opacity: 0;
  transition: transform .3s ease, opacity .3s ease; pointer-events: none;
  max-width: 90vw; text-align: center;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

#fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 80; overflow: hidden; }
.fx-float {
  position: absolute; font-size: 24px; font-weight: 900;
  animation: floatUp 1.1s ease-out forwards;
}
@keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1 } 100% { opacity: 0; transform: translateY(-90px) scale(1.15); } }
.fx-confetti { position: absolute; font-size: 20px; animation: confettiFall 1.4s ease-in forwards; }
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(-10px) rotate(0); }
  100% { opacity: 0; transform: translateY(46vh) rotate(360deg); }
}

.ball-icon { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
.ball-icon img { image-rendering: pixelated; }
.ally-hp { width: 66px; height: 6px; background: rgba(255,255,255,.65); border-radius: 99px; margin: 3px auto 0; overflow: hidden; }
.ally-hp > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #2ec46f, #7be495); border-radius: 99px; transition: width .4s; }
.ally-hp > i.low { background: linear-gradient(90deg, #ff8c42, #ffb703); }

/* ===== 로켓단 조우 ===== */
.rk-scene { background: linear-gradient(180deg, #241a3d 0%, #4a3168 58%, #3a2550 58%, #241a3d 100%) !important; }
.rk-heli {
  position: absolute; right: 6%; top: -70px;
  font-size: 46px; z-index: 4; animation: heliDown 1.1s cubic-bezier(.3,1.2,.5,1) forwards;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,.45));
}
@keyframes heliDown {
  0% { top: -70px; opacity: 0; }
  55% { opacity: 1; }
  100% { top: 6px; opacity: 1; }
}
.rk-heli.leaving { animation: heliUp 1.1s ease-in forwards; }
@keyframes heliUp { to { top: -90px; opacity: 0; transform: rotate(12deg); } }
/* 로켓단은 오른쪽(상대 진영) 아래 — 좌하단 파트너와 겹치지 않게 */
.rk-boss {
  position: absolute; right: 4%; bottom: 58px; z-index: 3; text-align: center;
  animation: monIn .45s cubic-bezier(.2,1.4,.4,1) both;
}
.rk-boss .face { font-size: clamp(52px, 15vw, 74px); line-height: 1; animation: idleBob 2s ease-in-out infinite; }
/* 로켓단 3인방 도트 그림 (이미지가 없으면 이모지로 자동 대체) */
.rk-crew { display: flex; align-items: flex-end; gap: 2px; animation: idleBob 2.4s ease-in-out infinite; }
.rk-crew img {
  height: clamp(62px, 17vw, 88px); width: auto; image-rendering: pixelated;
  filter: drop-shadow(0 6px 7px rgba(0,0,0,.45));
}
.rk-crew img.pet { height: clamp(44px, 12vw, 60px); }
.rk-crew.hit { animation: hitShake .5s ease; }
.rk-crew.fleeing { animation: fleeRun .7s ease-in forwards; }
.rk-boss .tag {
  display: inline-block; margin-top: 4px; font-size: 12.5px; font-weight: 900; color: #fff;
  background: linear-gradient(90deg, #d7263d, #8b1e3f); border-radius: 999px; padding: 3px 11px;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.rk-shadow img, .rk-shadow .fallback {
  filter: brightness(.45) saturate(.35) drop-shadow(0 0 16px #9b5de5) !important;
  transition: filter 1.1s ease;
}
.rk-shadow.purified img, .rk-shadow.purified .fallback {
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.3)) !important;
}
#rk-alarm {
  position: fixed; inset: 0; z-index: 87; pointer-events: none;

/* ===== 퍼즐 모드 (전기 회로 잇기) ===== */

/* 스테이지 고르기 (1~50) */

.sd-stage-btn {

.sd-stage-btn.locked .n { color: #9fb0c0; }

/* ===== ✍️ 알파벳 쓰기 (획 순서대로 따라 쓰기) ===== */
.tr-prompt {
  background: var(--card); border-radius: 20px; box-shadow: var(--shadow);
  padding: 12px 14px; margin-bottom: 12px; text-align: center;
}

.tr-prompt .tr-emoji { font-size: 44px; line-height: 1.1; }
.tr-prompt .speak-btn.small { position: static; margin: 6px auto 0; display: block; }
/* 단어 모드는 한 줄로 압축 (획판이 화면 밖으로 밀리지 않게) */

.tr-prompt.compact .tr-emoji { font-size: 30px; }

/* 단어 진행 표시 (2·3단계) */
.tr-word { display: flex; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tr-word span {
  min-width: 34px; padding: 3px 6px; border-radius: 10px; background: #eef3f9;
  font-size: 24px; font-weight: 900; color: #b9c6d4; line-height: 1.2;
}
/* 단어 시작 팝업 — 무슨 단어를 쓰는지 크게 보여주고, 터치하면 시작 */
.tr-intro {
  position: fixed; inset: 0; z-index: 95; cursor: pointer;

}

}

/* 왼쪽: 쓰는 순서 시범(반복 재생) · 오른쪽: 따라 쓰는 칸 */

}

}

}

/* 공책 줄 — 글자가 어디에 앉는지 보이게 (윗줄 · 중간 점선 · 밑줄 · 아랫줄) */
.tr-rule { stroke: #e3ebf3; stroke-width: 1; fill: none; }

.tr-done-badge {

}

/* 가족 톡 / 가족 연결 */
.chat-badge {

}

<script>
"use strict";

/* ================================================================
   [S2.5] 가족 동기화 설정
   Firebase 실시간 데이터베이스 URL을 넣으면 가족 코드 공유·가족 톡이 켜집니다.
   예: "https://englishmon-xxxxx-default-rtdb.asia-southeast1.firebasedatabase.app"
   (비워두면 가족 기능은 안내 화면만 표시)
================================================================ */
var CLOUD_DB_URL = "https://elglishmon-default-rtdb.asia-southeast1.firebasedatabase.app";

/* ================================================================
   [S3] CONFIG — 모든 밸런스 수치
================================================================ */
const CONFIG = {
  quizRounds: 10,
  chainRounds: 8,
  coinPerCorrect: 1,     // 첫 시도 정답 1개 = 코인 1
  comboEvery: 5,         // 5콤보마다
  comboBonus: 2,         //   보너스 코인 +2
  perfectBonus: 3,       // 짝맞추기 퍼펙트 보너스 코인
  memoryPerfectSlack: 3, // 퍼펙트 판정: 실패 뒤집기 <= 쌍수+3 - 쌍수 = 3회 여유
  spellChance: 0.2,      // 정답 후 스펠링 보너스 찬스 발동 확률
  spellBonus: 2,         // 스펠링을 한 번도 안 틀리고 완성하면 보너스 코인

const genOf = id => {
  const g = GENERATIONS.find(g => id >= g.from && id <= g.to);
  return g ? g.gen : 1;
};
const unlockedGen = () => Math.min(GENERATIONS.length, Math.max(1, SAVE.dexGen || 1));
const genInfo = g => GENERATIONS[g - 1];
// 해금된 세대까지의 도감 마지막 번호
const dexMax = () => genInfo(unlockedGen()).to;
// 특정 세대를 다 모았는지
function genComplete(g) {
  const info = genInfo(g);
  if (!info) return false;
  for (let id = info.from; id <= info.to; id++) {
    if (!SAVE.pokedex[id] || SAVE.pokedex[id].count < 1) return false;
  }
  return true;
}
// 해금된 지역 안에서 잡은 마리 수 (도감 진행 표시는 항상 이 기준)
function dexCaught() {
  const max = dexMax();
  let n = 0;
  Object.keys(SAVE.pokedex).forEach(k => {
    const id = Number(k);
    if (id <= max && SAVE.pokedex[k].count >= 1) n++;
  });
  return n;
}
function genCaught(g) {
  const info = genInfo(g);
  let n = 0;
  for (let id = info.from; id <= info.to; id++) if (SAVE.pokedex[id] && SAVE.pokedex[id].count >= 1) n++;
  return n;
}
// 해금 범위 안의 희귀도 풀 (조우 추첨용)
function rarityPoolInRange(r) {
  const max = dexMax();
  return RARITY_POOL[r].filter(id => id <= max);
}

(function mergeEvoLines() {
  const fams = [];
  EVO_LINES.forEach(line => {
    const hits = fams.filter(f => line.some(id => f.has(id)));
    if (!hits.length) { fams.push(new Set(line)); return; }
    const target = hits[0];
    line.forEach(id => target.add(id));
    hits.slice(1).forEach(h => {
      h.forEach(id => target.add(id));
      fams.splice(fams.indexOf(h), 1);
    });
  });
  EVO_LINES.length = 0;
  fams.forEach(f => EVO_LINES.push([...f].sort((a, b) => a - b)));
})();
const EVO_LINE_OF = {};
EVO_LINES.forEach(line => line.forEach(id => { EVO_LINE_OF[id] = line; }));
function evoLineComplete(id) {
  const line = EVO_LINE_OF[id];
  return !!line && line.every(x => SAVE.pokedex[x] && SAVE.pokedex[x].count >= 1);
}

}
function gifUrl(id) { return SPRITE_BASE + "/versions/generation-v/black-white/animated/" + id + ".gif"; }
function gifBackUrl(id) { return SPRITE_BASE + "/versions/generation-v/black-white/animated/back/" + id + ".gif"; }
function backPngUrl(id) { return SPRITE_BASE + "/back/" + id + ".png"; }

// 배틀 스프라이트 폴백 체인: 움직이는 GIF → 공식 일러스트 → 몬스터볼 카드
function advImgFail(img) {
  if (!img.dataset.step) {
    img.dataset.step = "art";
    img.classList.add("art");
    img.src = spriteUrl(img.dataset.mid);
    return;
  }
  Adventure.imgOk = false;
  const holder = img.parentElement;
  img.remove();
  if (holder && !holder.querySelector(".fallback")) {
    holder.insertAdjacentHTML("afterbegin", '<div class="fallback">❔</div>');
  }
}
// 로켓단 도트 그림 로드 실패 → 그 그림만 제거하고, 전부 실패하면 이모지로 대체
function rocketImgFail(img) {
  const crew = img.parentElement;
  img.remove();
  if (crew && !crew.querySelector("img")) {
    crew.classList.add("hidden");
    const face = $("#rk-face");
    if (face) face.classList.remove("hidden");
  }
}

// 파트너(뒷모습): 움직이는 GIF → 도트 뒷모습 → 공식 일러스트 → 숨김
function allyImgFail(img) {
  const step = img.dataset.step || "gif";
  if (step === "gif") { img.dataset.step = "png"; img.src = backPngUrl(img.dataset.mid); return; }
  if (step === "png") { img.dataset.step = "art"; img.classList.add("art"); img.src = spriteUrl(img.dataset.mid); return; }
  img.remove();
}

  83:["노말·비행","베어가르기","언제나 파를 들고 다녀요. 파는 무기이자 소중한 보물! 절대 안 뺏겨요."],
  84:["노말·비행","쪼기","머리가 두 개라 생각도 두 배! 둘이 사이좋게 번갈아 망을 봐요."],
  85:["노말·비행","트라이어택","머리가 세 개가 됐어요! 기쁨, 슬픔, 화남을 담당한대요."],
  86:["물","박치기","차가운 바다를 좋아하는 물개. 얼음 위에서 미끄럼 타는 걸 좋아해요!"],
  87:["물·얼음","오로라빔","낮에는 바닷속에서 자고 밤에 사냥해요. 하얀 몸이 눈처럼 예뻐요."],
  88:["독","오물공격","질퍽질퍽 더러운 곳을 좋아해요. 지나간 자리는 풀이 안 자라요, 이런!"],
  89:["독","오물폭탄","온몸이 진흙처럼 흐물흐물. 냄새가 지독하지만 미워할 수 없어요."],
  90:["물","껍질에숨기","혀를 내밀고 있는 조개. 껍질은 다이아몬드보다 단단하대요!"],
  91:["물·얼음","고드름침","밤송이 같은 껍질로 무장! 위험하면 껍질을 꽉 닫고 꼼짝 안 해요."],
  92:["고스트·독","핥기","몸의 95%가 가스! 스르륵 벽을 통과해요. 밤에 나타나 사람을 놀래켜요."],
  93:["고스트·독","밤그림자","어둠 속에서 히죽 웃어요. 핥으면 몸이 부들부들 떨린대요!"],
  94:["고스트·독","섀도볼","그림자에 숨는 장난꾸러기 유령. 사실 외로움을 많이 타서 친구를 원한대요."],
  95:["바위·땅","조이기","바위 뱀! 몸 길이가 8m가 넘어요. 땅속을 시속 80km로 파고들어요."],
  96:["에스퍼","최면술","꿈을 먹고 살아요. 코로 킁킁~ 재밌는 꿈 냄새를 찾아다녀요."],
  97:["에스퍼","최면술","시계추를 흔들흔들~ 보고 있으면 스르르 잠이 와요. 꿈을 먹어요."],
  98:["물","게거품","집게로 싹둑싹둑! 모래사장에 구멍을 파고 살아요. 집게 힘이 대단해요."],
  99:["물","가위자르기","커다란 집게는 힘이 1만 마력! 그런데 무거워서 금방 피곤해한대요."],
  100:["전기","전기쇼크","몬스터볼이랑 똑같이 생겼죠? 깜짝 놀라면 지지직 전기를 뿜어요!"],
  101:["전기","스파크","전기를 너무 많이 먹으면 펑! 하고 터져요. 그래도 금방 헤헤 웃는 장난꾸러기."],
  102:["풀·에스퍼","몸통박치기","여섯 개의 알이 텔레파시로 대화해요. 항상 여섯이 함께 다녀요!"],
  103:["풀·에스퍼","달걀폭탄","야자수 포켓몬! 머리 세 개가 각자 생각해요. 기분 좋은 날엔 노래를 불러요."],
  104:["땅","뼈다귀부메랑","언제나 뼈 투구를 쓰고 있어요. 뼈다귀를 부메랑처럼 던져요!"],
  105:["땅","뼈다귀부메랑","뼈다귀 다루기의 달인! 단단해진 마음으로 씩씩하게 싸워요."],
  106:["격투","메가톤킥","발차기의 달인! 다리가 용수철처럼 늘어나요. 매일 킥 연습을 해요."],
  107:["격투","메가톤펀치","펀치의 달인! 주먹이 안 보일 만큼 빨라요. 슉슉!"],
  108:["노말","핥기","혀 길이가 2m! 혀로 뭐든 핥아서 확인해요. 끈적끈적~"],
  109:["독","독가스","몸속 가스가 빵빵. 더운 날엔 가스가 늘어나 뚱뚱해져요."],
  110:["독","독가스","쌍둥이 가스 포켓몬. 서로 가스를 주고받으며 둥둥 떠다녀요."],
  111:["땅·바위","뿔찌르기","단단한 바위 피부! 달리기 시작하면 방향을 잘 못 바꿔요. 우당탕!"],
  112:["땅·바위","뿔드릴","드릴 뿔로 바위도 뚫어요! 갑옷 같은 피부는 대포도 튕겨낸대요."],
  113:["노말","알낳기","매일 영양 만점 알을 낳아요. 알을 나눠주는 마음씨 착한 포켓몬!"],
  114:["풀","덩굴채찍","온몸이 덩굴로 덮여 있어요. 덩굴 속 진짜 모습은 아무도 못 봤대요!"],
  115:["노말","메가톤펀치","주머니에 아기를 키워요. 아기를 건드리면 엄청 화내요! 엄마는 강해요."],
  116:["물","거품","소용돌이 속에서 놀아요. 위험하면 먹물을 찍 뿜고 도망가요."],
  117:["물","물대포","가시가 뾰족뾰족! 바닷속 동굴에 살아요. 물을 쏘는 명사수예요."],
  118:["물","뿔찌르기","금붕어의 왕! 뿔로 바위를 콕콕 뚫어요. 가을이 되면 색이 더 예뻐져요."],
  119:["물","뿔찌르기","물살을 거슬러 폭포를 오르는 힘센 수영왕이에요!"],
  120:["물","스피드스타","밤이 되면 가운데 보석이 반짝반짝 빛나요. 별을 향해 빛을 보낸대요."],
  121:["물·에스퍼","스피드스타","보석이 일곱 색으로 빛나요. 밤바다에서 별과 이야기한대요."],
  122:["에스퍼·페어리","배리어","손짓으로 보이지 않는 벽을 만들어요. 판토마임의 달인!"],
  123:["벌레·비행","베어가르기","양팔이 낫처럼 날카로워요! 풀숲을 슉슉 가르며 바람처럼 움직여요."],
  124:["얼음·에스퍼","냉동빔","리듬에 맞춰 춤추듯 걸어요. 사람 말 비슷한 소리로 노래해요."],
  125:["전기","번개펀치","폭풍이 오면 신나요! 번개를 먹으러 높은 곳에 올라가요. 찌릿찌릿!"],
  126:["불꽃","불꽃펀치","몸이 불덩어리! 화산 근처에 살아요. 너무 뜨거워서 가까이 가면 안 돼요."],
  127:["벌레","바이스그립","커다란 뿔 집게로 꽉! 잡으면 절대 안 놓아요. 힘자랑 대장!"],
  128:["노말","돌진","꼬리 세 개를 채찍처럼 휘두르며 돌진! 달리기 시작하면 멈추지 못해요."],
  129:["물","튀어오르기","펄떡펄떡 뛰는 것밖에 못 해요. 하지만 포기하지 않으면... 대변신이 기다려요!"],
  130:["물·비행","파괴광선","잉어킹이 진화한 무시무시한 용! 화나면 무섭지만 트레이너에겐 든든해요."],
  131:["물·얼음","냉동빔","사람을 등에 태우고 바다를 건너요. 마음씨 곱고 노래를 잘해요~"],
  132:["노말","변신","뭐든지 똑같이 변신! 흐물흐물~ 가끔 변신에 실패하면 얼굴이 좀 이상해져요."],
  133:["노말","전광석화","여러 모습으로 진화할 수 있는 신기한 포켓몬! 어떤 모습이 될지 두근두근."],
  134:["물","물대포","물처럼 몸이 투명해질 수 있어요. 물가에서 조용히 사는 인어 같은 포켓몬."],
  135:["전기","번개","털이 바늘처럼 곤두서요! 기분이 예민하지만 트레이너에겐 다정해요."],
  136:["불꽃","화염방사","몸속 불꽃 주머니의 온도는 1,700도! 복슬복슬 털이 열을 지켜줘요."],
  137:["노말","트라이어택","컴퓨터 속에서 태어난 최초의 인공 포켓몬! 전자공간을 헤엄쳐 다녀요."],
  138:["바위·물","물대포","아주 먼 옛날의 화석에서 되살아났어요. 10개의 다리로 헤엄쳐요."],
  139:["바위·물","물대포","고대 바다의 사냥꾼. 커다란 껍질 속에 몸을 숨겨요."],
  140:["바위·물","할퀴기","3억 년 전의 화석 포켓몬! 단단한 등딱지로 몸을 지켜요."],
  141:["바위·물","베어가르기","옛날 바다의 검객! 양팔의 낫으로 헤엄치며 사냥했대요."],
  142:["바위·비행","원시의힘","화석에서 부활한 하늘의 왕! 톱니 같은 이빨로 크게 울부짖어요."],
  143:["노말","누르기 · 잠자기","먹고 자는 게 일! 하루에 400kg을 먹고 쿨쿨~ 배 위에서 아이들이 놀아도 계속 자요."],
  144:["얼음·비행","눈보라","전설의 얼음새! 날개를 펄럭이면 눈이 내려요. 얼음산 깊은 곳에 산대요."],
  145:["전기·비행","번개","전설의 번개새! 천둥구름 속에 살아요. 날개짓마다 번개가 우르릉 쾅쾅!"],
  146:["불꽃·비행","불대문자","전설의 불꽃새! 날개가 활활 타올라요. 다친 몸도 용암에 담그면 나아요."],
  147:["드래곤","몸통박치기","허물을 벗으며 자라는 아기 용. 폭포 아래에 숨어 산대요."],
  148:["드래곤","용의분노","신비한 기운을 두른 용. 몸에서 신기한 빛이 나요."],
  149:["드래곤·비행","파괴광선","바다의 화신이라 불려요. 무서워 보여도 마음씨 착해서 조난된 사람을 구해줘요!"],
  150:["에스퍼","사이코키네시스","인간이 만든 가장 강한 포켓몬. 차가워 보이지만 마음속엔 외로움이 있대요."],
  151:["에스퍼","변신","모든 포켓몬의 조상이라 불리는 환상의 포켓몬! 장난치며 노는 걸 좋아해요."],
  152:["풀","잎날가르기","머리의 잎사귀에서 달콤한 향기가 나요. 햇볕 쬐는 걸 좋아하는 순둥이!"],
  153:["풀","잎날가르기","목의 새싹 목걸이에서 기운 나는 향기가 폴폴~ 맡으면 힘이 솟아요."],
  154:["풀","솔라빔","꽃 향기가 싸울 마음을 가라앉혀요. 메가니움 곁에 있으면 마음이 편안해져요~"],
  155:["불꽃","불꽃세례","등에서 불꽃이 뿜어져 나와요! 깜짝 놀라면 등이 활활 타올라요."],
  156:["불꽃","불꽃세례","공격하기 전에 등의 불길이 거세져요. 뜨거운 바람으로 상대를 밀어내요."],
  157:["불꽃","화염방사","머리 뒤 불꽃이 폭발처럼 타올라요! 닿으면 뭐든 태울 만큼 뜨거워요."],
  158:["물","물대포","큰 입으로 덥석! 장난으로 무는 버릇이 있는데 이빨이 아파요, 아야!"],
  159:["물","물기","이빨이 48개! 물었다 하면 절대 안 놓아요. 그래도 표정은 귀여워요."],
  160:["물","하이드로펌프","커다란 입은 뭐든 물어 부숴요! 물속의 왕, 하지만 트레이너 말은 잘 들어요."],
  161:["노말","몸통박치기","꼬리로 서서 멀리 망을 봐요. 위험하면 찍찍! 소리로 친구들에게 알려요."],
  162:["노말","몸통박치기","가늘고 긴 몸으로 좁은 굴을 쏙쏙! 엄마 배 위에서 아기가 잠들어요."],
  163:["노말·비행","쪼기","언제나 한 발로 서 있어요. 머리를 시계추처럼 까딱까딱, 시간을 잰대요!"],
  164:["노말·비행","최면술","밤의 박사님! 어둠 속에서도 다 보여요. 고개가 빙글 돌아가요."],
  165:["벌레·비행","몸통박치기","겁이 많아서 친구들과 꼭 붙어 다녀요. 추우면 모두 모여 몸을 데워요."],
  166:["벌레·비행","은빛바람","별빛을 먹고 산대요! 밤하늘 아래서 네 팔을 휘두르며 날아요."],
  167:["벌레·독","독침","거미줄로 함정을 만들고 참을성 있게 기다려요. 함정의 달인!"],
  168:["벌레·독","거미집","입과 엉덩이 양쪽에서 실을 뽑아요. 거미줄 끝은 언제나 둥지로 이어져요."],
  169:["독·비행","물기","날개 네 장으로 소리 없이 날아요. 트레이너와 친해져야만 진화한대요!"],
  170:["물·전기","스파크","더듬이 불빛으로 깊은 바다를 밝혀요. 반짝반짝, 바다의 등대!"],
  171:["물·전기","스파크","깊은 바다의 별이라 불려요. 불빛으로 물고기들을 불러 모아요."],
  172:["전기","전기쇼크","아기 피카츄! 전기를 잘 못 다뤄서 자기도 찌릿 하고 놀라요. 귀여워!"],
  173:["페어리","손가락흔들기","별똥별이 많은 밤에 나타나요. 아기 삐삐는 달빛 아래서 놀아요."],
  174:["노말·페어리","노래하기","몸이 말랑말랑 고무공 같아요! 데굴데굴 굴러다니며 놀아요."],
  175:["페어리","손가락흔들기","껍질 속에 행복이 가득! 마음씨 착한 사람에게 행복을 나눠준대요."],
  176:["페어리·비행","손가락흔들기","행복 포켓몬! 마음 착한 사람을 만나면 반짝이는 가루를 뿌려준대요."],
  177:["에스퍼·비행","쪼기","폴짝폴짝 뛰어다니는 작은 새. 한쪽 눈으로 항상 뒤를 살펴요."],
  178:["에스퍼·비행","사이코키네시스","하루 종일 가만히 서서 내일을 내다본대요. 신비한 점쟁이 새!"],
  179:["전기","전기쇼크","복슬복슬 양털에 전기가 모여요. 만지면 찌릿! 머리카락이 쭈뼛 서요."],
  180:["전기","전기쇼크","털에 전기가 모이면 몸이 반짝여요. 정전기 대장!"],
  181:["전기","번개","꼬리 불빛이 등대처럼 빛나요! 옛날엔 진짜 등대로 썼대요."],
  182:["풀","꽃잎댄스","비가 갠 뒤 햇살 아래서 춤을 춰요. 춤추는 모습이 꽃처럼 예뻐요."],
  183:["물·페어리","거품","동그란 꼬리가 튜브처럼 물에 동동 떠요! 물놀이 최고 친구."],
  184:["물·페어리","물대포","기다란 귀는 물속 소리도 다 들려요. 강가에서 노는 걸 좋아해요."],
  185:["바위","흉내내기","나무인 척하는 바위! 비를 싫어해서 비가 오면 도망가요. 들켰다!"],
  186:["물","물대포","볼록한 목으로 개굴개굴~ 노래하면 발챙이들이 모여들어요. 개구리 대장!"],
  187:["풀·비행","몸통박치기","바람에 둥실둥실 날아다녀요. 바람이 세게 불면 꼭 붙잡아 주세요!"],
  188:["풀·비행","잠가루","머리에 꽃이 피면 봄이 온 거예요! 꽃 상태로 날씨를 알 수 있어요."],
  189:["풀·비행","잠가루","민들레 솜털처럼 바람을 타고 세계 여행을 해요. 어디까지 갈까요?"],
  190:["노말","할퀴기","꼬리로 나뭇가지를 잡고 신나게 그네를 타요. 꼬리가 손보다 편하대요!"],
  191:["풀","흡수","작은 씨앗 포켓몬. 아침 이슬을 마시며 조용히 진화를 기다려요."],
  192:["풀","솔라빔","해님을 향해 얼굴을 돌려요. 해바라기처럼 밝게 웃는 포켓몬!"],
  193:["벌레·비행","소닉붐","잠자리 포켓몬. 제자리에서 붕~ 떠서 사방을 살펴요. 눈이 아주 좋아요."],
  194:["물·땅","물대포","물속에서 멍~하니 살아요. 태평하고 느긋한 성격이에요. 우파~"],
  195:["물·땅","물대포","느긋함의 왕! 머리를 부딪혀도 신경 안 써요. 강바닥에서 뒹굴뒹굴."],
  196:["에스퍼","사이코키네시스","아침 해를 좋아하는 이브이의 진화형. 트레이너 마음을 읽을 수 있대요!"],
  197:["악","물기","달빛을 받으면 고리 무늬가 빛나요. 밤의 수호자, 멋쟁이 검은 고양이!"],
  198:["악·비행","날개치기","반짝이는 물건을 몰래 가져가는 장난꾸러기 까마귀. 서랍 조심!"],
  199:["물·에스퍼","사이코키네시스","머리를 문 셀러 덕분에 천재가 됐어요! 세상의 비밀을 연구한대요."],
  200:["고스트","놀래키기","괴상한 소리로 사람을 깜짝! 놀란 얼굴 보는 걸 좋아하는 장난꾸러기 유령."],
  201:["에스퍼","숨겨진힘","알파벳 모양의 신비한 포켓몬! 벽화 속 글자처럼 생겼어요. 무슨 뜻일까요?"],
  202:["에스퍼","카운터","공격은 안 하고 꾹 참았다가 두 배로 돌려줘요! 꼬리에 비밀이 있대요."],
  203:["노말·에스퍼","염동력","꼬리에도 얼굴이 있어요! 꼬리 머리는 잠을 안 자고 망을 봐요."],
  204:["벌레","단단해지기","나무 열매인 척 매달려 있어요. 건드리면 뚝 떨어져요. 콩!"],
  205:["벌레·강철","미사일바늘","강철 껍질 속에서 절대 안 나와요. 껍질 속 모습은 아무도 몰라요!"],
  206:["노말","구멍파기","꼬리로 땅을 파며 뒤로 도망가요. 만나기 힘든 귀한 포켓몬이래요!"],
  207:["땅·비행","할퀴기","바람을 타고 스윽 활공해요. 소리 없이 다가와 앗! 하고 놀래켜요."],
  208:["강철·땅","아이언테일","롱스톤이 진화한 강철 뱀! 다이아몬드보다 단단한 몸으로 땅속 깊이 살아요."],
  209:["페어리","물기","무서운 얼굴이지만 사실 겁쟁이에 애교쟁이! 놀라면 먼저 도망가요."],
  210:["페어리","물기","턱 힘이 엄청나요! 그래도 마음은 여려서 먼저 공격하지 않아요."],
  211:["물·독","독침","몸을 풍선처럼 부풀려 가시를 발사! 뾰족뾰족 바다의 밤송이."],
  212:["벌레·강철","메탈크로우","강철 집게가 번쩍! 집게의 눈알 무늬로 상대를 겁줘요."],
  213:["벌레·바위","껍질에숨기","바위 틈에 숨어 살아요. 껍질 속에 모아둔 열매가 달콤한 주스가 된대요!"],
  214:["벌레·격투","메가혼","커다란 뿔로 상대를 번쩍 들어 던져요! 달콤한 꿀을 아주 좋아해요."],
  215:["악·얼음","할퀴기","날카로운 발톱의 개구쟁이. 밤에 살금살금 몰래 다니는 걸 좋아해요."],
  216:["노말","핥기","손바닥에 꿀이 배어 있어서 항상 쪽쪽 핥아요. 꿀을 제일 좋아해요!"],
  217:["노말","할퀴기","숲의 힘장사! 나무를 흔들어 열매를 떨어뜨려 먹어요."],
  218:["불꽃","불꽃세례","몸이 흐르는 용암으로 되어 있어요. 식으면 굳어서 못 움직여요!"],
  219:["불꽃·바위","화염방사","등껍질이 굳은 용암이에요. 몸 온도가 1만 도라니, 세상에!"],
  220:["얼음·땅","몸통박치기","코를 땅에 대고 킁킁~ 맛있는 버섯을 찾아다녀요. 온천도 찾아준대요!"],
  221:["얼음·땅","박치기","긴 털 때문에 앞이 안 보여도 씩씩해요! 코로 얼음 밑 먹이를 찾아요."],
  222:["물·바위","거품","따뜻하고 깨끗한 바다에 살아요. 머리의 산호 가지가 반짝반짝 자라요."],
  223:["물","물대포","물총 명사수! 움직이는 먹이도 백발백중으로 맞혀요. 슝!"],
  224:["물","물대포","빨판으로 붙잡고 대포처럼 먹물과 물을 쏴요! 바다의 대포."],
  225:["얼음·비행","프레젠트","꼬리 주머니에 먹이를 담아 나눠줘요. 길 잃은 사람도 구해준 산타 새!"],
  226:["물·비행","거품광선","파도 위를 우아하게 날아올라요! 등에 총어를 태우고 다니는 바다의 글라이더."],
  227:["강철·비행","강철날개","온몸이 갑옷 깃털! 떨어진 깃털은 옛날에 칼로 썼을 만큼 날카로워요."],
  228:["악·불꽃","물기","울음소리가 아주 으스스해요. 무리 지어 살며 가족을 아껴요."],
  229:["악·불꽃","화염방사","뿔과 불꽃이 무서워 보여도 트레이너에겐 충성! 밤의 파수꾼이에요."],
  230:["물·드래곤","용의숨결","바닷속 깊은 동굴에서 잠자요. 하품만 해도 소용돌이가 생긴대요!"],
  231:["땅","몸통박치기","아기 코끼리 포켓몬. 코를 휘두르며 노는 걸 좋아해요. 힘은 어른 100명!"],
  232:["땅","구르기","몸을 바퀴처럼 말아 데굴데굴 돌진! 산도 뚫는 타이어 코끼리."],
  233:["노말","트라이어택","폴리곤이 업그레이드! 더 똑똑해졌지만 가끔 이상한 행동을 해요. 삐빅?"],
  234:["노말","박치기","신비한 뿔 덕분에 곁에 있으면 신기한 광경이 보인대요. 신기루 사슴!"],
  235:["노말","스케치","꼬리 붓으로 여기저기 그림을 그려요. 자기만의 기호를 남기는 꼬마 화가!"],
  236:["격투","태권당수","연습벌레 꼬마 파이터! 어떤 모습으로 자랄지는 노력에 달렸대요."],
  237:["격투","트리플킥","머리로 서서 빙글빙글 돌며 발차기! 춤추는 것 같은 격투왕."],
  238:["얼음·에스퍼","얼다바람","입술로 뭐든 확인해요. 쪽! 예쁜 것을 아주 좋아하는 아기 포켓몬."],
  239:["전기","전기쇼크","팔을 빙글빙글 돌려 전기를 만들어요. 천둥번개 치는 날 신나서 뛰어놀아요!"],
  240:["불꽃","불꽃세례","숨 쉴 때마다 코와 입에서 불씨가 뿅뿅! 몸 온도는 600도나 돼요."],
  241:["노말","구르기","매일 맛있는 우유를 만들어요. 밀탱크 우유를 마시면 기운이 쑥쑥!"],
  242:["노말","알낳기","먹으면 행복해지는 알을 낳아요. 다친 포켓몬을 돌보는 천사 간호사!"],
  243:["전기","번개","번개를 두른 전설의 호랑이! 울음소리와 함께 천둥이 쾅! 바람처럼 달려요."],
  244:["불꽃","화염방사","화산의 마음을 가진 전설의 사자! 엔테이가 짖으면 화산이 눈을 뜬대요."],
  245:["물","하이드로펌프","북풍과 함께 달리는 전설의 물의 수호신. 더러운 물을 맑게 해줘요."],
  246:["바위·땅","물기","땅속에서 흙을 먹으며 자라요. 산 하나를 다 먹으면 진화한대요!"],
  247:["바위·땅","박치기","단단한 껍질 속에서 힘을 모아요. 몸속 가스로 둥둥 떠다니기도 해요."],
  248:["바위·악","깨물어부수기","산을 무너뜨릴 만큼 강한 갑옷 공룡! 싸움을 좋아하지만 트레이너 말은 들어요."],
  249:["에스퍼·비행","에어로블라스트","바다 밑에서 잠자는 전설의 수호신. 날개짓 한 번에 폭풍이 분대요!"],
  250:["불꽃·비행","성스러운불꽃","일곱 빛깔 날개의 전설의 새! 무지개 끝에 산대요. 만나면 행복해진대요."],
  251:["에스퍼·풀","미래예지","시간을 넘나드는 숲의 수호신! 세레비가 나타난 숲은 나무들이 반짝반짝 건강해져요."],
  252:["풀","잎날가르기","꼬리의 잎으로 벽도 타고 올라가요. 침착하고 용감한 숲의 아기 도마뱀!"],
  253:["풀","잎날가르기","엄청나게 빠른 숲의 달리기 선수! 나뭇가지 사이를 슝슝 뛰어다녀요."],
  254:["풀","리프블레이드","팔의 잎사귀가 칼처럼 날카로워요! 정글의 왕이라 불리는 멋쟁이."],
  255:["불꽃","불꽃세례","몸속에 불꽃이 활활! 안으면 따끈따끈한 병아리 포켓몬이에요."],
  256:["불꽃·격투","더블킥","강한 발차기를 연습하는 닭 포켓몬. 불꽃을 뿜으며 킥킥킥!"],
  257:["불꽃·격투","블레이즈킥","손목에서 불꽃이 활활! 점프 한 번에 빌딩을 넘는 격투 챔피언."],
  258:["물","물대포","머리의 지느러미로 물의 흐름을 읽어요. 진흙탕에서 노는 걸 좋아해요!"],
  259:["물·땅","진흙뿌리기","진흙 속에서 힘이 두 배! 늪에서 수영하는 게 제일 편하대요."],
  260:["물·땅","하이드로펌프","꼬리 한 방에 큰 바위도 부숴요! 비가 오면 더 강해지는 늪의 왕."],
  261:["악","물기","무리 지어 다니는 들개 포켓몬. 혼자서는 사실 조금 겁쟁이래요."],
  262:["악","깨물어부수기","빠른 다리와 날카로운 이빨! 무리의 대장 말을 잘 따라요."],
  263:["노말","몸통박치기","지그재그로 뛰어다니며 여기저기 기웃기웃! 호기심 대장 너구리."],
  264:["노말","몸통박치기","곧게 달리는 게 특기! 지그재그 버릇은 여전해서 가끔 벽에 쿵!"],
  265:["벌레","실뿜기","발끝의 빨판으로 나무에 착! 잎사귀를 갉아먹으며 자라요."],
  266:["벌레","단단해지기","실로 몸을 감싸고 가만히… 뷰티플라이가 될 날을 기다려요."],
  267:["벌레·비행","은빛바람","화려한 날개의 나비! 기다란 입으로 꽃꿀을 쪽쪽 마셔요."],
  268:["벌레","단단해지기","보라색 고치 속에서 꾹 참는 중. 독케일이 될 준비를 해요."],
  269:["벌레·독","독가루","밤에 활동하는 나방. 날개의 가루에 독이 있으니 조심!"],
  270:["물·풀","흡수","연잎을 타고 물 위를 둥둥~ 비 오는 날이 제일 신나요!"],
  271:["물·풀","물대포","연잎 모자를 쓴 장난꾸러기. 경쾌한 소리를 내며 춤을 춰요."],
  272:["물·풀","꽃잎댄스","리듬을 타면 멈출 수 없어! 흥이 넘치는 정글의 춤꾼."],
  273:["풀","몸통박치기","도토리를 꼭 닮은 씨앗 포켓몬. 나뭇가지에 매달려 흔들흔들."],
  274:["풀·악","잎날가르기","머리 위 잎사귀로 바람을 타요. 장난치는 걸 아주 좋아해요!"],
  275:["풀·악","은빛바람","부채 같은 잎으로 강풍을 일으켜요! 숲을 지키는 바람의 파수꾼."],
  276:["노말·비행","날개치기","작지만 용감한 제비! 자기보다 큰 상대에게도 씩씩하게 맞서요."],
  277:["노말·비행","고속이동","하늘을 우아하게 가르며 날아요. 빛나는 깃털이 자랑이에요."],
  278:["물·비행","날개치기","바닷바람을 타고 미끄러지듯 날아요. 물고기를 노리는 갈매기!"],
  279:["물·비행","물대포","커다란 부리 주머니에 물고기도, 짐도 담아 날라요. 배달부 새!"],
  280:["에스퍼·페어리","염동력","사람의 마음을 느끼는 신비한 포켓몬. 밝은 마음에 다가와요."],
  281:["에스퍼·페어리","사이코키네시스","춤추듯 우아하게 움직여요. 트레이너의 기분을 금방 알아채요."],
  282:["에스퍼·페어리","문포스","트레이너를 지키기 위해서라면 어떤 힘이라도! 마음씨 고운 수호자."],
  283:["벌레·물","거품","물 위를 스케이트처럼 미끄러져요! 연못의 스피드 스케이터."],
  284:["벌레·비행","은빛바람","비구술이 진화한 화려한 나방. 비 오는 날에도 씩씩하게 날아요."],
  285:["풀","버섯포자","머리의 버섯에서 포자를 폴폴~ 축축한 숲속에 숨어 살아요."],
  286:["풀·격투","마하펀치","눈에 안 보일 만큼 빠른 펀치! 버섯 주먹의 격투가예요."],
  287:["노말","하품","하루 20시간을 뒹굴뒹굴~ 세상에서 제일 느긋한 게으름뱅이."],
  288:["노말","할퀴기","게을로가 진화하면 갑자기 부지런쟁이! 한시도 가만있지 못해요."],
  289:["노말","누르기","평소엔 뒹굴뒹굴, 하지만 한 번 움직이면 세상에서 제일 힘세요!"],
  290:["벌레·땅","구멍파기","땅속에서 조용히 자라는 매미 애벌레. 나무 뿌리의 즙을 마셔요."],
  291:["벌레·비행","고속이동","너무 빨라서 눈에 안 보여요! 붕붕 나는 초스피드 매미."],
  292:["벌레·고스트","밤그림자","벗어놓은 껍질에 영혼이 깃든 신비한 포켓몬. 가만히 떠 있어요."],
  293:["노말","울음소리","소곤소곤 작은 소리도, 화나면 우렁찬 울음으로! 목소리 포켓몬."],
  294:["노말","박치기","울음소리가 트럭 경적보다 커요! 귀를 막고 들어야 해요."],
  295:["노말","폭음파","울음소리로 지진처럼 땅을 흔들어요! 호연 최고의 스피커."],
  296:["격투","태권당수","넘어져도 넘어져도 다시 일어나요! 연습을 멈추지 않는 씨름꾼."],
  297:["격투","팔치기","손바닥 밀치기 한 방에 트럭도 밀어내요! 마을의 씨름 챔피언."],
  298:["노말·페어리","물장구","꼬리 공이 통통! 물 위에 동동 떠서 노는 아기 마릴."],
  299:["바위","박치기","코가 자석이라 항상 북쪽을 가리켜요. 살아있는 나침반!"],
  300:["노말","고양이돈받기","동그란 꼬리로 재롱을 부려요. 귀여움으로 상대를 무장해제!"],
  301:["노말","매혹","우아하게 걷는 고양이. 기분파라서 예측 불가지만 미워할 수 없어요."],
  302:["악·고스트","놀래키기","어두운 동굴에서 보석을 갉아먹어요. 반짝이는 눈으로 히죽!"],
  303:["강철·페어리","깨물어부수기","머리 뒤의 큰 입은 강철 턱! 얌전해 보여도 덥석 물어요."],
  304:["강철·바위","아이언헤드","강철 갑옷을 입은 아기. 철을 먹으며 무럭무럭 자라요."],
  305:["강철·바위","아이언테일","단단한 강철 몸으로 바위에 몸을 부딪혀 단련해요!"],
  306:["강철·바위","아이언테일","산 하나를 통째로 지키는 강철의 왕! 몸이 철벽 그 자체예요."],
  307:["격투·에스퍼","명상","조용히 명상하며 마음의 힘을 키워요. 매일 수련하는 꼬마 요가 수행자."],
  308:["격투·에스퍼","사이코키네시스","명상으로 모은 힘을 한 번에 팡! 요가의 달인이에요."],
  309:["전기","스파크","털에 전기를 모아 찌릿찌릿! 밤에 눈이 반짝이는 전기 강아지."],
  310:["전기","번개","갈기에서 번개를 뿜어요! 천둥구름을 몰고 달리는 전기 늑대."],
  311:["전기","스파크","플러스 볼의 응원단장! 친구를 응원할 때 전기가 반짝반짝."],
  312:["전기","스파크","마이너스 볼의 응원단원! 플러시와 함께 있으면 힘이 두 배."],
  313:["벌레","신호빔","꼬리 불빛으로 별자리처럼 반짝여요. 밤하늘의 사랑꾼 반딧불이."],
  314:["벌레","매혹","달콤한 향기로 볼비트를 불러요. 밤의 불빛 아이돌!"],
  315:["풀·독","매지컬리프","예쁜 장미에는 가시가 있는 법! 향기로 마음을 사르르 녹여요."],
  316:["독","오물공격","뭐든지 통째로 꿀꺽! 위장이 튼튼해서 배탈이 안 난대요."],
  317:["독","오물폭탄","위가 몸의 대부분! 뭐든 삼키고 소화시키는 대식가예요."],
  318:["물·악","물기","무리 지어 헤엄치는 바다의 개구쟁이. 이빨이 아주 날카로워요!"],
  319:["물·악","깨물어부수기","시속 120km로 헤엄치는 바다의 어뢰! 하지만 겁이 많은 편이에요."],
  320:["물","물대포","고래 아기! 물놀이를 좋아해서 사람 곁에서 첨벙첨벙 놀아요."],
  321:["물","하이드로펌프","세상에서 제일 큰 포켓몬! 등 위에서 소풍도 할 수 있을 정도예요."],
  322:["불꽃·땅","불꽃세례","등에서 마그마가 부글부글. 느긋하게 걷는 화산 낙타!"],
  323:["불꽃·땅","분화","등의 혹에서 용암이 펑! 화나면 화산처럼 폭발해요."],
  324:["불꽃","화염방사","등껍질 구멍에서 연기가 모락모락. 숯을 만드는 거북 아저씨."],
  325:["에스퍼","사이코빔","꼬리 스프링으로 통통 튀어요! 멈추면 심장이 멎는대서 항상 점프 중."],
  326:["에스퍼","사이코키네시스","검은 진주로 신기한 힘을 써요. 통통 튀는 춤이 특기!"],
  327:["노말","몸통박치기","한 마리 한 마리 무늬가 다 달라요! 비틀비틀 걷는 게 매력 포인트."],
  328:["땅","구멍파기","모래에 깔때기 함정을 파고 기다려요. 개미지옥의 명수!"],
  329:["땅·드래곤","소닉붐","날개를 부딪혀 초음파를 울려요. 사막의 잠자리 유충."],
  330:["땅·드래곤","용의숨결","사막의 정령이라 불려요! 모래폭풍 속에서 노래하듯 날아요."],
  331:["풀","독침","사막에서 밤에 움직이는 선인장. 가시로 몸을 지켜요!"],
  332:["풀·악","니들암","밤의 사막을 걸어 다니는 허수아비 선인장. 가시 펀치가 특기!"],
  333:["노말·비행","노래하기","구름 같은 솜털 날개! 포근포근 노래하는 파랑새."],
  334:["드래곤·비행","용의숨결","뭉게구름 사이를 우아하게 날아요. 아름다운 허밍의 드래곤!"],
  335:["노말","베어가르기","세비퍼와 영원한 라이벌! 날카로운 발톱으로 싸우는 족제비."],
  336:["독","독엄니","쟝고와 영원한 라이벌! 칼날 꼬리에 독이 발려 있어요."],
  337:["바위·에스퍼","사이코키네시스","보름달 밤에 힘이 세지는 달의 운석. 조용히 떠다녀요."],
  338:["바위·에스퍼","사이코키네시스","한낮에 힘이 세지는 태양의 운석. 루나톤과 단짝이에요."],
  339:["물·땅","진흙뿌리기","강바닥 진흙 속에 살아요. 미끌미끌해서 잡기 힘들어요!"],
  340:["물·땅","지진","수염으로 지진을 미리 알아채요! 강바닥의 점쟁이 메기."],
  341:["물","거품","강의 가재. 집게로 무엇이든 싹둑! 더러운 물에서도 씩씩해요."],
  342:["물·악","가위자르기","싸움을 좋아하는 가재 대장! 집게를 자랑하며 뽐내요."],
  343:["땅·에스퍼","염동력","빙글빙글 돌면서 이동하는 진흙 인형. 고대 유적에서 발견됐어요."],
  344:["땅·에스퍼","대지의힘","고대인이 만든 진흙 인형이 살아났어요! 두 팔로 빔을 쏴요."],
  345:["바위·풀","흡수","고대 바다의 백합 화석에서 부활! 촉수로 하늘하늘 춤춰요."],
  346:["바위·풀","원시의힘","바다 밑 바위에 붙어 살아요. 꽃잎 같은 촉수로 먹이를 잡아요."],
  347:["바위·벌레","할퀴기","고대 화석에서 부활한 새우! 튼튼한 발톱으로 재빠르게 헤엄쳐요."],
  348:["바위·벌레","가위자르기","1억 년 전 바다의 사냥꾼! 커다란 낫 발톱이 무기예요."],
  349:["물","튀어오르기","너덜너덜해 보여도 참고 기다리면… 세상에서 제일 아름답게 변신해요!"],
  350:["물","하이드로펌프","세상에서 가장 아름다운 포켓몬! 마음을 가라앉히는 신비한 힘이 있어요."],
  351:["노말","날씨부르기","날씨 따라 모습이 변해요! 해님·비·눈, 오늘은 어떤 모습일까?"],
  352:["노말","할퀴기","몸 색깔을 바꿔 숨는 카멜레온. 지그재그 무늬만은 못 숨겨요!"],
  353:["고스트","놀래키기","인형에 영혼이 깃들었어요. 사실은 친구가 되고 싶은 외로움쟁이."],
  354:["고스트","섀도볼","지퍼 입의 저주 인형… 이지만 트레이너에겐 충성스러워요!"],
  355:["고스트","밤그림자","외눈 해골 유령. 밤에 아이들이 우는 소리를 들으러 온대요… 으스스!"],
  356:["고스트","섀도펀치","몸속이 블랙홀 같아서 뭐든 빨아들여요. 미라 붕대를 감고 있어요."],
  357:["풀·비행","잎날가르기","턱에 열리는 달콤한 열매를 나눠줘요! 아이들의 인기쟁이 바나나 공룡."],
  358:["에스퍼","사이코웨이브","바람이 불면 딸랑딸랑~ 맑은 소리를 내는 풍경 포켓몬."],
  359:["악","베어가르기","재앙을 미리 알려주러 오는 포켓몬. 오해받지만 사실은 착한 영웅!"],
  360:["에스퍼","카운터","언제나 싱글벙글 웃는 아기. 즐거울수록 힘이 난대요!"],
  361:["얼음","눈싸라기","머리에 고드름 모자! 추운 곳에서 옹기종기 모여 살아요."],
  362:["얼음","눈보라","공기 중의 수분을 얼려 무기로 써요. 단단한 얼음 얼굴!"],
  363:["얼음·물","파도타기","데굴데굴 굴러다니는 물개 아기. 박수 치는 재주가 있어요!"],
  364:["얼음·물","오로라빔","코로 공을 돌리는 묘기의 달인! 얼음 위의 서커스 스타."],
  365:["얼음·물","눈보라","커다란 엄니로 빙산도 부숴요! 얼음 바다의 든든한 대장."],
  366:["물","껍질에숨기","진주를 품은 조개. 진주에 신비한 힘이 담겨 있대요!"],
  367:["물","물기","깊은 바다의 뱀 물고기. 어둠 속에서 빛으로 먹이를 유인해요."],
  368:["물","사이코키네시스","분홍빛 우아한 심해어. 깊은 바다를 하늘하늘 헤엄쳐요."],
  369:["물·바위","원시의힘","1억 년 전 모습 그대로! 살아있는 화석이라 불리는 물고기."],
  370:["물","하트스탬프","하트 모양 몸으로 사랑을 전해요! 연인들의 수호 포켓몬."],
  371:["드래곤","박치기","단단한 머리로 여기저기 쿵쿵! 하늘을 나는 꿈을 꾸는 아기 용."],
  372:["드래곤","단단해지기","단단한 껍질 속에서 날개가 자라는 중. 조금만 기다려!"],
  373:["드래곤·비행","용의춤","드디어 날개를 얻은 용! 기뻐서 하늘을 빙글빙글 날아다녀요."],
  374:["강철·에스퍼","염동력","자기력으로 떠다니는 강철 아기. 눈빛이 진지해요!"],
  375:["강철·에스퍼","사이코키네시스","메탕 둘이 합체했어요! 두 개의 두뇌로 생각도 두 배."],
  376:["강철·에스퍼","사이코키네시스","네 개의 두뇌를 가진 강철 슈퍼컴퓨터! 어떤 문제도 척척 풀어요."],
  377:["바위","스톤샤워","고대부터 잠들어 있던 바위의 전설 거인. 몸의 점무늬가 비밀 신호래요."],
  378:["얼음","눈보라","남극 얼음으로 만들어진 전설 거인. 몸이 절대 녹지 않아요!"],
  379:["강철","아이언헤드","땅속 깊은 곳에서 단련된 전설의 강철 거인. 몸이 어떤 금속보다 단단해요."],
  380:["드래곤·에스퍼","미스트볼","마음 착한 전설의 드래곤. 사람으로 변신할 수 있대요!"],
  381:["드래곤·에스퍼","러스터퍼지","라티아스의 오빠! 제트기보다 빠르게 하늘을 날아요."],

function emptyEco() {
  const z = () => ({ poke: 0, super: 0, hyper: 0, master: 0 });
  return { earned: 0, spent: 0, bought: z(), used: z() };
}

/* ---- 데이터 정화 (재발 방지 핵심) ----
   Firebase는 숫자 키 객체를 배열로 바꿔버림 → null 칸이 "유령 도감 항목"이 되는 사고가 있었음.
   ① 배열이 오면 객체로 복원하고 ② 유효한 항목(count≥1 등)만 남긴다. */
function unpackMap(m, prefix) {
  const out = {};
  if (Array.isArray(m)) {
    m.forEach((v, i) => { if (v) out[i] = v; });
  } else if (m && typeof m === "object") {
    Object.keys(m).forEach(k => {
      if (!m[k]) return;
      out[prefix && k.charAt(0) === prefix && /\d/.test(k.charAt(1)) ? k.slice(1) : k] = m[k];
    });
  }
  return out;
}
function prefixMap(m, prefix) {
  const out = {};
  Object.keys(m || {}).forEach(k => { out[prefix + k] = m[k]; });
  return out;
}
function sanitizePokedex(px) {
  const out = {};
  Object.entries(unpackMap(px, "p")).forEach(([k, e]) => {
    const id = Number(k);
    if (e && typeof e === "object" && (e.count || 0) >= 1 && id >= 1 && id <= TOTAL_POKEMON) {
      out[id] = { count: e.count, first: (typeof e.first === "number" && e.first > 0) ? e.first : Date.now() };
    }
  });
  return out;
}
function sanitizeWordStats(ws) {
  const out = {};
  Object.entries(unpackMap(ws, "w")).forEach(([k, e]) => {
    if (e && typeof e === "object" && ((e.w || 0) > 0 || (e.c || 0) > 0)) {
      out[k] = { w: e.w || 0, c: e.c || 0 };
    }
  });
  return out;
}
function sanitizePartnerHp(ph) {
  const out = {};
  Object.entries(unpackMap(ph, "h")).forEach(([k, e]) => {
    if (e && typeof e === "object" && typeof e.hp === "number" && typeof e.t === "number") {
      out[k] = { hp: e.hp, t: e.t };
    }
  });
  return out;
}

      wordStats: {},   // { wordId: { w: 틀린횟수, c: 맞힌횟수 } } — 복습 출제용
      retryWords: [],  // 못 맞히고 넘어간 단어 id — 다음 퀴즈 앞부분에 다시 출제 (기기별, 동기화 안 함)
      showdownStage: 1, // 포켓몬 쇼다운에서 지금 도전할 스테이지 (1~50) — 깬 스테이지는 다시 코인이 안 나옴
      welcomed: false,

  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); }
    catch (e) { this.memoryOnly = true; }

    try {
      const data = JSON.parse(raw);
      // 필드 누락 대비: 기본값 위에 덮어쓰기
      const d = this.defaults();
      // 유령 도감 복구 감지 (사용자 안내용)
      const rawDexN = Object.keys(unpackMap(data.pokedex || {}, "p")).length;
      const cleanDexN = Object.keys(sanitizePokedex(data.pokedex || {})).length;
      if (rawDexN > cleanDexN) this.repairedGhosts = rawDexN - cleanDexN;
      return Object.assign(d, data, {
        balls: Object.assign(d.balls, data.balls || {}),
        stats: Object.assign(d.stats, data.stats || {}),

        showdownStage: Math.max(1, Math.min(51, Math.floor(Number(data.showdownStage) || 1))),
        chat: Array.isArray(data.chat) ? data.chat : [],

        eco: data.eco || (() => {
          const e = emptyEco();
          e.earned = data.coins || 0;
          Object.assign(e.bought, data.balls || {});
          return { [DEVICE_ID]: e };
        })(),
      });
    } catch (e) {
      try { localStorage.setItem(this.KEY + "_backup", raw); } catch (e2) {}
      return this.defaults();
    }
  },

  save(data) {
    if (this.memoryOnly) return;
    try { localStorage.setItem(this.KEY, JSON.stringify(data)); }
    catch (e) {
      this.memoryOnly = true;
      if (!this.warned) { this.warned = true; toast("저장이 안 되는 환경이에요. 이번 판 기록은 창을 닫으면 사라져요 🥲"); }
    }
  },
};

/* ================================================================
   [S7] SFX (Web Audio 합성음) + TTS (speechSynthesis)
================================================================ */
const SFX = {
  ctx: null,
  ensure() {
    if (!SAVE.settings.sfx) return false;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try { this.ctx = new AC(); } catch (e) { return false; }
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return true;
  },
  tone(freq, dur = 0.12, type = "sine", delay = 0, peak = 0.22) {
    if (!this.ensure()) return;
    const t0 = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  },
  tap()     { this.tone(600, 0.06, "triangle", 0, 0.12); },
  flip()    { this.tone(700, 0.05, "triangle", 0, 0.15); },
  correct() { this.tone(523, 0.12, "sine", 0); this.tone(659, 0.12, "sine", 0.09); this.tone(784, 0.2, "sine", 0.18); },
  combo()   { this.correct(); this.tone(1568, 0.18, "sine", 0.28, 0.15); },
  wrong()   { this.tone(160, 0.18, "sawtooth", 0, 0.12); },
  coin()    { this.tone(988, 0.08, "square", 0, 0.1); this.tone(1319, 0.16, "square", 0.07, 0.1); },
  buy()     { this.tone(660, 0.1, "triangle", 0); this.tone(880, 0.18, "triangle", 0.1); },
  throwBall(){ this.tone(300, 0.25, "sine", 0, 0.15); this.tone(500, 0.15, "sine", 0.2, 0.12); },
  attack()  { this.tone(480, 0.09, "sawtooth", 0, 0.14); this.tone(720, 0.12, "sawtooth", 0.07, 0.14); },
  hit()     { this.tone(150, 0.18, "square", 0, 0.22); this.tone(90, 0.24, "sine", 0.05, 0.2); },
  shake()   { this.tone(120, 0.15, "sine", 0, 0.25); },
  click()   { this.tone(1100, 0.06, "square", 0, 0.12); },
  catchOk() { [523,659,784,1047].forEach((f,i)=>this.tone(f, 0.16, "sine", i*0.1)); },
  fanfare(r){
    const base = [523,659,784,1047];
    base.forEach((f,i)=>this.tone(f, 0.18, "triangle", i*0.11));
    if (r === "unique" || r === "legendary") [784,988,1319].forEach((f,i)=>this.tone(f, 0.22, "triangle", 0.5+i*0.12));
    if (r === "legendary") [1047,1319,1568,2093].forEach((f,i)=>this.tone(f, 0.3, "sine", 0.9+i*0.13, 0.18));
  },
  escape()  { this.tone(400, 0.15, "sawtooth", 0, 0.1); this.tone(250, 0.25, "sawtooth", 0.12, 0.1); },
  star(i)   { this.tone(880 + i*220, 0.2, "sine", 0, 0.18); },

  // ---- 배틀 BGM: 칩튠 루프 (32스텝, 외부 파일 없음) ----
  bgmTimer: null, bgmStep: 0, bgmNext: 0,
  BGM_MEL: [659,0,784,988, 1319,988,1175,988, 880,784,880,988, 784,0,659,0,
            659,0,784,988, 1319,988,1175,1319, 1047,988,880,784, 659,587,659,0],
  BGM_BASS:[165,0,165,0, 196,0,196,0, 147,0,147,0, 131,0,196,0,
            165,0,165,0, 196,0,196,0, 175,0,175,0, 131,0,147,0],
  BGM_STEP_DUR: 0.19,
  bgmStart() {
    if (!this.ensure()) return;
    this.bgmStop();
    this.bgmStep = 0;
    this.bgmNext = this.ctx.currentTime + 0.08;
    this.bgmTimer = setInterval(() => {
      if (!this.ctx || !SAVE.settings.sfx) { this.bgmStop(); return; }
      while (this.bgmNext < this.ctx.currentTime + 0.3) {
        const i = this.bgmStep % 32;
        const delay = this.bgmNext - this.ctx.currentTime;
        if (this.BGM_MEL[i]) this.tone(this.BGM_MEL[i], 0.17, "triangle", delay, 0.055);
        if (this.BGM_BASS[i]) this.tone(this.BGM_BASS[i], 0.16, "square", delay, 0.035);
        this.bgmNext += this.BGM_STEP_DUR;
        this.bgmStep++;
      }
    }, 90);
  },
  bgmStop() { if (this.bgmTimer) { clearInterval(this.bgmTimer); this.bgmTimer = null; } },
};

const TTS = {
  ok: "speechSynthesis" in window,
  voice: null,
  koVoice: null,
  pickVoice() {
    if (!this.ok) return;
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    this.koVoice = vs.find(v => v.lang && v.lang.toLowerCase().indexOf("ko") === 0) || null;
    this.voice =
      vs.find(v => v.lang === "en-US" && /Google|Microsoft/i.test(v.name)) ||
      vs.find(v => v.lang === "en-US") ||
      vs.find(v => v.lang && v.lang.startsWith("en")) || null;
    if (!this.voice) this.ok = false;
  },
  speak(text, rate) {
    if (!this.ok || !SAVE.settings.tts) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      if (this.voice) u.voice = this.voice;
      u.rate = rate || speakRate(); // 할머니 모드는 더 천천히
      u.pitch = 1.05;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  },
  // 한글 단어 읽어주기 (한국어 목소리가 있을 때만)
  koOk() { return !!(this.ok && this.koVoice && SAVE.settings.tts); },
  speakKo(text) {
    if (!this.koOk()) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ko-KR";
      u.voice = this.koVoice;
      u.rate = 0.85;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) {} },
};
if (TTS.ok) {
  TTS.pickVoice();
  speechSynthesis.onvoiceschanged = () => TTS.pickVoice();
}

// 포켓몬 공식 울음소리 (PokeAPI cries, ogg) — 최신판 실패 시 게임보이 원본(legacy) 폴백
function cryUrl(id, legacy) {
  return "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/" + (legacy ? "legacy" : "latest") + "/" + id + ".ogg";
}
const Cry = {
  audio: null,
  play(id) {
    if (!SAVE.settings.sfx) return;
    this.stop();
    try {
      const a = new Audio(cryUrl(id));
      a.volume = 0.4;
      a.onerror = () => {
        try {
          const b = new Audio(cryUrl(id, true));
          b.volume = 0.4;
          b.play().catch(() => {});
          this.audio = b;
        } catch (e) {}
      };
      a.play().catch(() => {});
      this.audio = a;
    } catch (e) {}
  },
  stop() {
    if (this.audio) { try { this.audio.pause(); } catch (e) {} this.audio = null; }
  },
};

/* ================================================================
   [S8] 공통 유틸 + 화면 관리
================================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pickN = (arr, n) => shuffle(arr).slice(0, n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// 한글 조사 자동 선택: josa("피카츄","이가") → "피카츄가", josa("리자몽","을를") → "리자몽을"
function josa(word, pair) {
  const code = word.charCodeAt(word.length - 1);
  const hasBatchim = code >= 0xAC00 && code <= 0xD7A3 && (code - 0xAC00) % 28 > 0;
  const map = { "이가": ["이", "가"], "을를": ["을", "를"], "은는": ["은", "는"], "이에": ["이에요", "예요"] };
  const [a, b] = map[pair] || ["", ""];
  return word + (hasBatchim ? a : b);
}
const $ = sel => document.querySelector(sel);

// 이모지 or 색 원 렌더
function emojiHtml(w) {
  if (w.color) return '<span class="colorball" style="background:' + w.color + '"></span>';
  return esc(w.emoji);
}

}

// 떠오르는 텍스트 이펙트 (+1 🪙, 볼 아이콘 등 — 내부 고정 문자열만 전달)
function fxFloat(html, x, y) {
  const el = document.createElement("div");
  el.className = "fx-float";
  el.innerHTML = html;
  el.style.left = (x - 20) + "px";

function fxConfetti(emojis, count = 14) {
  const layer = $("#fx-layer");
  for (let i = 0; i < count; i++) {
    const el = document.createElement("div");
    el.className = "fx-confetti";

    setTimeout(() => el.remove(), 2000);

}

// 대화창 타이핑 효과
let _typeInt = null;
function typeText(el, text, speed = 26) {
  if (!el) return;
  if (_typeInt) { clearInterval(_typeInt); _typeInt = null; }
  el.textContent = "";
  let i = 0;
  _typeInt = setInterval(() => {
    el.textContent += text[i++];
    if (i >= text.length) { clearInterval(_typeInt); _typeInt = null; }
  }, speed);
  screenTimers.push(_typeInt); // clearTimeout은 interval id에도 동작
}

================================================================ */
let SAVE = Storage.load();
const saveNow = () => { Storage.save(SAVE); if (typeof Family !== "undefined") Family.queueSync(); };

// 해금 세대 보정 — 저장에 dexGen이 없거나(구버전) 이미 그 세대를 다 모았으면 다음 지역까지 열어줌
function syncDexGen() {
  let g = Math.max(1, Math.min(GENERATIONS.length, SAVE.dexGen || 0));
  if (!SAVE.dexGen) {
    // 구버전 저장: 이미 잡은 포켓몬의 최고 세대까지 해금된 것으로 본다
    Object.keys(SAVE.pokedex).forEach(id => { g = Math.max(g, genOf(Number(id))); });
  }
  while (g < GENERATIONS.length && genComplete(g)) g++;
  if (SAVE.dexGen !== g) { SAVE.dexGen = g; return true; }
  return false;
}

// 이 기기의 누적 카운터
function myEco() {
  let e = SAVE.eco[DEVICE_ID];
  if (!e) e = SAVE.eco[DEVICE_ID] = emptyEco();
  if (!e.bought) e.bought = { poke: 0, super: 0, hyper: 0, master: 0 };
  if (!e.used) e.used = { poke: 0, super: 0, hyper: 0, master: 0 };
  return e;
}
// 모든 기기 카운터 합산 → 실제 코인·볼 재계산 (동기화 병합 후 호출)
function applyEco() {
  let earned = 0, spent = 0;
  const bought = { poke: 0, super: 0, hyper: 0, master: 0 };
  const used = { poke: 0, super: 0, hyper: 0, master: 0 };
  Object.values(SAVE.eco).forEach(e => {
    earned += e.earned || 0;
    spent += e.spent || 0;
    CONFIG.ballOrder.forEach(k => {
      bought[k] += (e.bought && e.bought[k]) || 0;
      used[k] += (e.used && e.used[k]) || 0;
    });
  });
  SAVE.coins = Math.max(0, earned - spent);
  CONFIG.ballOrder.forEach(k => { SAVE.balls[k] = Math.max(0, bought[k] - used[k]); });
}

// ---- 파트너 HP: 기술 1회당 -10%, 마지막 사용 후 24시간 지나면 전체 회복 ----
function partnerHp(id) {
  const e = SAVE.partnerHp[id];
  if (!e) return 100;
  if (Date.now() - e.t >= CONFIG.partnerHealMs) {
    delete SAVE.partnerHp[id];
    saveNow();
    return 100;
  }
  return e.hp;
}
function drainPartner(id) {
  const hp = Math.max(0, partnerHp(id) - CONFIG.partnerDrain);
  SAVE.partnerHp[id] = { hp, t: Date.now() };
  saveNow();
  return hp;
}

// ---- 단어별 오답 기록 → 복습 출제 ----
function noteWordResult(wordId, correct) {
  const s = SAVE.wordStats[wordId] || (SAVE.wordStats[wordId] = { w: 0, c: 0 });
  if (correct) s.c++; else s.w++;
  if (correct) dropRetry(wordId); // 한 번에 맞혔으면 재도전 목록에서 졸업
  saveNow();
}

/* ---- 아이 모드 집중 학습: 난사 방지 + 오답에서 배우기 + 재도전 큐 ----
   ① 문제가 뜨면 잠깐(armMs) 못 누름  ② 틀리면 멈추고 고른 보기의 뜻을 알려줌
   ③ maxTries를 넘기면 정답을 보여주고 넘어간 뒤, 그 단어를 다시 출제 */
const kidFocusOn = () => isKidMode() && CONFIG.kidFocus.on;

// 못 맞힌 단어 → 재도전 목록 (다음 퀴즈 앞부분에 다시 나옴)
function queueRetry(wordId) {
  const q = SAVE.retryWords || (SAVE.retryWords = []);
  if (!q.includes(wordId)) q.push(wordId);
  while (q.length > 30) q.shift();
  saveNow();
}
function dropRetry(wordId) {
  const q = SAVE.retryWords;
  if (!Array.isArray(q)) return;
  const i = q.indexOf(wordId);
  if (i >= 0) q.splice(i, 1);
}
// 지금 모드의 단어 중에서만 (아이/부모/할머니 단어 세트가 섞이지 않게)
function takeRetryWords(n) {
  const q = SAVE.retryWords || [];
  const out = [];
  for (const id of q) {
    const w = activeWords().find(x => x.id === id);
    if (w) out.push(w);
    if (out.length >= n) break;
  }
  return out;
}

// 보기를 잠깐 잠갔다가 열기 (문제를 읽을 시간) — 다른 모드는 바로 열림
function armChoices(container) {
  Session.lock = false;
  if (!container || !kidFocusOn()) return;
  container.classList.add("arming");
  Session.lock = true;
  later(() => { container.classList.remove("arming"); Session.lock = false; }, CONFIG.kidFocus.armMs);
}

// 오답 코치: 잠깐 멈추고 한 줄 알려주기 (정답은 알려주지 않음)
// box: 코치 줄을 넣을 영역 / msg: HTML 한 줄 / replayEn: 다시 들려줄 영어 / done: 잠금 해제 후 콜백
function coachPause(box, msg, replayEn, done) {
  const ms = CONFIG.kidFocus.wrongLockMs;
  const list = box && (box.querySelector(".choices") || box.querySelector(".spell-tiles"));
  Session.lock = true;
  if (list) list.classList.add("arming");
  if (box) {
    const old = box.querySelector(".coach-line");
    if (old) old.remove();
    const el = document.createElement("div");
    el.className = "coach-line";
    el.innerHTML = '<span class="cf">🐾</span><span class="ct">' + msg + "</span>" +
      (replayEn ? '<button type="button" class="coach-speak" aria-label="다시 듣기">🔊</button>' : "") +
      '<i class="cbar" style="animation-duration:' + ms + 'ms"></i>';
    if (list) list.parentNode.insertBefore(el, list); else box.appendChild(el);
    const sp = el.querySelector(".coach-speak");
    if (sp) sp.addEventListener("click", (ev) => { ev.stopPropagation(); SFX.tap(); TTS.speak(replayEn); });
    later(() => el.remove(), ms);
  }
  if (replayEn) TTS.speak(replayEn);
  later(() => {
    if (list) list.classList.remove("arming");
    Session.lock = false;
    if (done) done();
  }, ms);
}
// "elephant = 코끼리" — 아이가 고른 오답 보기에서 배우기 (조사 없이 읽히게)
function coachMsg(picked, tail) {

// 보기가 한글인 문제(듣기·영어→한글)용 — "코끼리 = elephant"

// 아직 흔들리는 단어: 틀린 횟수×2 > 맞힌 횟수
function isWeakWord(wordId) {
  const s = SAVE.wordStats[wordId];
  return !!s && s.w * 2 > s.c;
}
function reviewPool() {
  const score = w => { const s = SAVE.wordStats[w.id]; return s.w * 2 - s.c; };
  return activeWords().filter(w => isWeakWord(w.id)).sort((a, b) => score(b) - score(a));
}

  SAVE.coins += n;

function awardFirstTry(x, y) {
  Session.correctFirst++;
  Session.combo++;
  Session.maxCombo = Math.max(Session.maxCombo, Session.combo);
  SAVE.stats.totalCorrect++;
  SAVE.stats.bestCombo = Math.max(SAVE.stats.bestCombo, Session.combo);
  addCoins(CONFIG.coinPerCorrect, x, y);
  if (Session.combo > 0 && Session.combo % CONFIG.comboEvery === 0) {
    addCoins(CONFIG.comboBonus);
    SFX.combo();
    toast("🔥 " + Session.combo + "콤보! 보너스 코인 +" + CONFIG.comboBonus, 1800);
  } else {

  if (cc) {
    cc.textContent = Session.combo >= 2 ? "🔥" + Session.combo : "";
    cc.classList.remove("hot"); void cc.offsetWidth; cc.classList.add("hot");
  }
}

    }
    return '<line class="tr-rule" x1="6" y1="12" x2="94" y2="12"/>' +
      '<line class="tr-rule mid" x1="6" y1="44" x2="94" y2="44"/>' +
      '<line class="tr-rule base" x1="6" y1="86" x2="94" y2="86"/>' +

  renderPad() {
    const pad = $("#tr-pad");
    if (!pad) return;
    const W = this.penW(), SC = W / 15; // 한글은 얇게 → 표식도 같은 비율로
    let guide = this.rulesHtml();
    let hints = "", ink = "";
    const placed = []; // 이미 찍은 번호 배지 위치 (F·E·B처럼 시작점이 같은 획이 겹치지 않게)
    this.raw.forEach((pts, i) => {
      const d = smoothD(pts);
      guide += '<path class="tr-guide" style="stroke-width:' + W + '" d="' + d + '"/>';
      if (i < this.si) { ink += '<path class="tr-ink done" style="stroke-width:' + W + '" d="' + d + '"/>'; return; }
      // 아직 안 그은 획: 점선 + 시작 번호 + 끝 화살표
      const cur = i === this.si;
      hints += '<path class="tr-dash' + (cur ? " cur" : "") + '" d="' + d + '"/>';
      // 진행 방향 화살표 — 닫힌 원(O·Q·o처럼 시작=끝)은 끝 화살표가 ① 배지에 겹치므로
      // 길 중간(40%·80%)에 찍어서 어느 쪽으로 돌아야 하는지 항상 보이게 한다
      const cps = this.strokes[i];
      const s = pts[0], e = pts[pts.length - 1];
      const closed = Math.hypot(e[0] - s[0], e[1] - s[1]) < 6;
      const marks = closed ? [0.3, 0.6, 0.9] : [0.45, 1];
      marks.forEach(f => {
        const k = Math.min(cps.length - 1, Math.max(1, Math.round((cps.length - 1) * f)));
        const a = cps[k - 1], bb = cps[k];
        const ang = Math.atan2(bb[1] - a[1], bb[0] - a[0]) * 180 / Math.PI;
        hints += '<polygon class="tr-arrow" points="0,-4 8,0 0,4" transform="translate(' +
          bb[0].toFixed(1) + "," + bb[1].toFixed(1) + ") rotate(" + ang.toFixed(1) + ") scale(" + SC.toFixed(2) + ')"/>';
      });
      // 획이 많은 글자(한글 음절)는 번호가 글자를 가리므로 '지금 그을 획'만 번호를 보여준다
      if (this.raw.length > 4 && !cur) return;
      const bp = this.badgeAt(i, placed);
      const br = (8 * SC).toFixed(1);
      hints += '<circle class="tr-num' + (cur ? " cur" : "") + '" cx="' + bp[0].toFixed(1) + '" cy="' + bp[1].toFixed(1) + '" r="' + br + '"/>' +
        '<text class="tr-numt" style="font-size:' + (11 * SC).toFixed(1) + 'px" x="' + bp[0].toFixed(1) + '" y="' + bp[1].toFixed(1) + '">' + (i + 1) + "</text>";
      // 출발 자리는 언제나 진짜 시작점에 표시 (지금 그을 획만)
      if (cur) hints += '<circle class="tr-start" style="stroke-width:' + (2.5 * SC).toFixed(1) + '" cx="' + s[0] + '" cy="' + s[1] + '" r="' + (12 * SC).toFixed(1) + '"/>';
    });
    if (this.ink.length > 1) ink += '<path class="tr-ink" style="stroke-width:' + W + '" d="' + smoothD(this.ink) + '"/>';
    pad.innerHTML = '<svg viewBox="0 0 100 100">' + guide + ink + hints + "</svg>" +
      (this.done ? '<div class="tr-done-badge">✅</div>' : "");
  },

  // 왼쪽 시범: 획 순서대로 그려지는 모습을 계속 반복 재생
  demo() {
    const host = $("#tr-demo");
    if (!host) return;
    if (this.demoTimer) clearInterval(this.demoTimer);
    let rules = this.rulesHtml();
    let g = "", inks = "";
    this.raw.forEach((pts, i) => {
      const d = smoothD(pts);
      g += '<path class="tr-guide" d="' + d + '" style="stroke-width:' + (this.penW() * 0.87).toFixed(1) + '"/>';
      inks += '<path class="tr-demo-ink" id="dm-' + i + '" style="stroke-width:' + (this.penW() * 0.87).toFixed(1) + '" d="' + d + '"/>';
    });
    // 획 번호 (작게) — 그려지는 획에 가려지지 않게 맨 위에 얹는다
    const placed = [];
    let badges = "";
    this.raw.forEach((pts, i) => {
      const bp = this.badgeAt(i, placed);
      const r = this.raw.length > 4 ? 4.2 : 6.5; // 획이 많은 한글 음절은 번호를 작게
      badges += '<circle class="tr-num" cx="' + bp[0].toFixed(1) + '" cy="' + bp[1].toFixed(1) + '" r="' + r + '"/>' +
        '<text class="tr-numt" x="' + bp[0].toFixed(1) + '" y="' + bp[1].toFixed(1) +
        '" style="font-size:' + (r * 1.35).toFixed(1) + 'px">' + (i + 1) + "</text>";
    });
    host.innerHTML = '<svg viewBox="0 0 100 100">' + rules + g + inks + badges +
      '<circle class="tr-pen" id="dm-pen" cx="-10" cy="-10" r="3.6"/></svg>';

    const paths = this.raw.map((_, i) => host.querySelector("#dm-" + i));
    const pen = host.querySelector("#dm-pen");
    const lens = paths.map(p => p.getTotalLength());
    const durs = lens.map(L => Math.max(450, Math.min(1500, L * 16)));
    const gap = 220, hold = 900;
    const cycle = durs.reduce((s, d) => s + d + gap, 0) + hold;
    const t0 = Date.now();
    const draw = () => {
      let t = (Date.now() - t0) % cycle;
      let active = -1, prog = 0;
      for (let i = 0; i < paths.length; i++) {
        const seg = durs[i] + gap;
        if (t < seg) { active = i; prog = Math.min(1, t / durs[i]); break; }
        t -= seg;
      }
      paths.forEach((pa, i) => {
        const L = lens[i];
        const off = active < 0 ? 0 : i < active ? 0 : i > active ? L : L * (1 - prog);
        pa.style.strokeDasharray = L;
        pa.style.strokeDashoffset = off;
      });
      if (active >= 0 && prog < 1) {
        const pt = paths[active].getPointAtLength(lens[active] * prog);
        pen.setAttribute("cx", pt.x); pen.setAttribute("cy", pt.y);
        pen.style.opacity = ".9";
      } else {
        pen.style.opacity = "0";
      }
    };
    draw();
    this.demoTimer = setInterval(draw, 45);
    screenTimers.push(this.demoTimer);
  },

  // 화면 좌표 → 0~100 좌표
  at(pad, e) {
    const r = pad.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100];
  },
  near(p, q) { return Math.hypot(p[0] - q[0], p[1] - q[1]); },
  closed(cps) { return this.near(cps[0], cps[cps.length - 1]) < 6; }, // 시작=끝 (동그라미)

  // 획 굵기 — 한글은 한 칸에 자모 2~4개가 들어가므로 알파벳보다 얇게 (뭉개짐·삐져나옴 방지)
  penW() { return this.stage === 3 ? 8.5 : 15; },

  // 획이 짧으면(한글 자모, i의 점 등) 판정을 조금 좁힌다 — 긴 획은 그대로 넉넉하게
  tolFor(cps) {
    let len = 0;
    for (let i = 1; i < cps.length; i++) len += this.near(cps[i], cps[i - 1]);
    return Math.max(8, Math.min(CONFIG.trace.tol, len * 0.4));
  },
  offFor(cps) { return this.tolFor(cps) * (CONFIG.trace.offMax / CONFIG.trace.tol); },

  // 번호 배지 자리 — 앞 획 배지와 겹치면 획을 따라 이동, 그래도 겹치면 옆으로 살짝
  // (F·E·B처럼 시작점이 같은 글자에서 ① 이 ② 에 가려지던 문제)
  badgeAt(i, placed) {
    const cps = this.strokes[i];
    const hit = q => this.near(bp, q) < 15;
    let bp = cps[0];
    const lim = Math.max(1, Math.floor(cps.length * 0.75));
    for (let k = 1; k < lim && placed.some(hit); k++) bp = cps[k];
    if (placed.some(hit)) {
      const a = cps[0], b = cps[Math.min(2, cps.length - 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], m = Math.hypot(dx, dy) || 1;
      bp = [Math.max(9, Math.min(91, a[0] - dy / m * 13)), Math.max(9, Math.min(91, a[1] + dx / m * 13))];
    }
    placed.push(bp);
    return bp;
  },

  bind(pad) {
    if (!pad) return;
    pad.addEventListener("pointerdown", (e) => {
      if (this.done || Session.lock) return;
      const p = this.at(pad, e);
      const cps = this.strokes[this.si];
      const reach = this.tolFor(cps) * 1.7;
      // 그리다 손을 뗐으면 멈춘 자리에서 이어서 (처음부터 다시 안 해도 됨)
      if (this.ci > 1 && cps[this.ci - 1] && this.near(p, cps[this.ci - 1]) <= reach) {
        pad.setPointerCapture(e.pointerId);
        this.drawing = true; this.stall = 0; this.lastP = p;
        this.ink.push(p);
        SFX.click();
        return;
      }
      if (this.near(p, cps[0]) > reach) { this.nudge("① 번 동그라미에서 출발해요!"); return; }
      pad.setPointerCapture(e.pointerId);
      this.drawing = true; this.ci = 1; this.ink = [cps[0].slice(), p];
      this.stall = 0; this.lastP = p; this.dirSet = false;
      SFX.click();
      this.renderPad();
    });
    pad.addEventListener("pointermove", (e) => {
      if (!this.drawing) return;
      e.preventDefault();
      const p = this.at(pad, e);
      let cps = this.strokes[this.si];
      // 닫힌 원(O·o·a의 동그라미 등)은 어느 쪽으로 돌아도 인정 —
      // 시작점에서 처음 움직인 방향이 안내 방향과 반대면 획을 뒤집어서 그대로 진행
      if (!this.dirSet && this.closed(cps)) {
        const mv = [p[0] - cps[0][0], p[1] - cps[0][1]];
        if (Math.hypot(mv[0], mv[1]) >= 4) {
          const tg = [cps[1][0] - cps[0][0], cps[1][1] - cps[0][1]];
          if (mv[0] * tg[0] + mv[1] * tg[1] < 0) {
            this.strokes[this.si] = cps.slice().reverse();
            cps = this.strokes[this.si];
            this.ci = 1;
          }
          this.dirSet = true;
        }
      }
      // 경로에서 너무 벗어나면 이 획만 다시
      let best = Infinity;
      for (let i = 0; i < cps.length; i++) best = Math.min(best, this.near(p, cps[i]));
      if (best > this.offFor(cps)) { this.fail("점선을 따라가 볼까요? 다시 ① 부터!"); return; }
      // 빨리 그으면 포인터 이벤트 사이에 체크포인트 몇 개를 건너뛴다 →
      // '지금 위치에서 닿은 가장 앞선 체크포인트'까지 한 번에 인정 (앞으로만, jump 개까지)
      const before = this.ci;
      let adv = -1;
      const limit = Math.min(cps.length, this.ci + CONFIG.trace.jump);
      const tol = this.tolFor(cps);
      for (let k = this.ci; k < limit; k++) if (this.near(p, cps[k]) <= tol) adv = k;
      if (adv >= 0) this.ci = adv + 1;
      // 반대 방향으로 돌면(O·Q처럼 닫힌 원에서 자주 생김) 전진이 계속 안 된다
      // → 전진 없이 움직인 거리가 쌓이면 방향을 알려주고 그 획만 다시
      if (this.ci > before) { this.stall = 0; } else {
        this.stall += this.near(p, this.lastP || p);
        if (this.stall > CONFIG.trace.stallMax) {
          this.fail(this.closed(cps) ? "선을 따라 한 바퀴 돌려 볼까요?" : "화살표 방향으로 그어요! ① 부터 다시 해 볼까요?");
          return;
        }
      }
      this.lastP = p;
      this.ink.push(p);
      if (this.ink.length % 2 === 0) this.renderPad();
      if (this.ci >= cps.length) this.strokeDone();
    }, { passive: false });
    // 손을 떼도 그은 만큼은 남긴다 — 멈춘 자리를 다시 짚으면 이어서 (실수로 치지 않음)
    const up = () => {
      if (!this.drawing || this.done) return;
      this.drawing = false;
      if (this.ci <= 1) { this.ci = 0; this.ink = []; this.renderPad(); return; }
      const h = $("#tr-hint");
      if (h) h.textContent = "손을 뗀 자리를 다시 짚고 이어서 그어요! ✍️";
      this.renderPad();
    };
    pad.addEventListener("pointerup", up);
    pad.addEventListener("pointercancel", up);
    // pointerleave는 쓰지 않음 — 손가락이 판을 살짝 벗어나도 경로 이탈(offMax)로만 판정
  },

  nudge(msg) {
    SFX.wrong();
    const pad = $("#tr-pad");
    if (pad) { pad.classList.remove("shake"); void pad.offsetWidth; pad.classList.add("shake"); }
    toast("✍️ " + msg, 1800);
    const h = $("#tr-hint");
    if (h) h.textContent = msg;
  },
  fail(msg) {
    this.drawing = false;
    this.missed = true;
    breakCombo();
    this.ci = 0; this.ink = []; this.stall = 0; this.lastP = null; this.dirSet = false;
    this.renderPad();
    this.nudge(msg);
  },

  strokeDone() {
    this.drawing = false;
    this.si++;
    this.ci = 0; this.ink = []; this.stall = 0; this.lastP = null; this.dirSet = false;
    SFX.correct();
    if (this.si >= this.strokes.length) { this.charDone(); return; }
    this.renderPad();
    toast("좋아요! 다음은 " + (this.si + 1) + "번 획 ✍️", 1200);
  },

  charDone() {
    this.done = true;
    this.renderPad();
    if (this.stage !== 1 && this.li < this.letters.length - 1) { // 단어 모드(영어·한글): 다음 글자로
      this.li++;
      SFX.coin();
      later(() => this.renderAll(), 620);
      return;
    }
    this.award();
  },

  award() {
    Session.lock = true;
    // 1단계는 글자 2개(per1)를 쓸 때마다 🪙1 · 2단계는 단어 1개마다 🪙2
    let coins = CONFIG.trace.coin2;
    if (this.stage === 1) {
      this.pend = (this.pend || 0) + 1;
      if (this.pend >= CONFIG.trace.per1) { this.pend = 0; coins = CONFIG.trace.coin1; }
      else coins = 0;
    }
    SAVE.stats.totalAnswered++;
    if (!this.missed) {
      Session.correctFirst++;
      SAVE.stats.totalCorrect++;
      Session.combo++;
      Session.maxCombo = Math.max(Session.maxCombo, Session.combo);
      SAVE.stats.bestCombo = Math.max(SAVE.stats.bestCombo, Session.combo);
    }
    saveNow();
    if (coins > 0) addCoins(coins, window.innerWidth / 2, window.innerHeight * 0.45);
    else toast("✍️ 잘했어요! 한 글자만 더 쓰면 🪙 +" + CONFIG.trace.coin1, 1700);
    const cc = $("#combo-chip");
    if (cc) {
      cc.textContent = Session.combo >= 2 ? "🔥" + Session.combo : "";
      cc.classList.remove("hot"); void cc.offsetWidth; cc.classList.add("hot");
    }
    let bonus = 0;
    if (!this.missed && Session.combo > 0 && Session.combo % CONFIG.trace.comboEvery === 0) {
      bonus = CONFIG.trace.comboBonus;
      addCoins(bonus);
      SFX.combo();
      toast("🔥 " + Session.combo + "연속! 보너스 코인 +" + bonus, 2000);
    } else {
      SFX.catchOk();
    }
    fxConfetti(["✍️", "⭐", "✨"], 10);
    this.say();
    later(() => {
      Session.lock = false;
      if (Session.round >= Session.total) Result.show();
      else this.question();
    }, bonus ? 2100 : 1500);
  },
};

/* ================================================================
   [S17] 모험 — 조우 & 확률 포획
================================================================ */
const Adventure = {
  mon: null,     // { id, name, rarity }
  busy: false,
  imgOk: true,
  bonus: 0,       // 조우 영어 시험 정답 보너스 (%p, 이번 조우 동안 유지)
  quizWord: null,
  quizWrong: false,
  quizDone: false,
  throwing: false, // 볼 던지는 연출 중 (도망가기 잠금)
  throwsLeft: 3,   // 이번 조우에서 남은 던지기 기회 (등급별, 다 쓰면 도망감)

  ballTotal() { return CONFIG.ballOrder.reduce((s, k) => s + SAVE.balls[k], 0); },

  go() {
    if (this.ballTotal() <= 0) {
      const canBuy = SAVE.coins >= CONFIG.balls.poke.price;
      showModal(
        '<div class="m-emoji">🎒</div>' +
        '<div class="m-title">몬스터볼이 없어요!</div>' +
        '<div class="m-text">' + (canBuy ? "상점에서 몬스터볼을 사고 모험을 떠나요!" : "퀴즈를 풀어 🪙 코인을 모으고<br>상점에서 몬스터볼을 사요!") + "</div>" +
        '<div class="m-btns">' +
          (canBuy
            ? '<button class="btn yellow" data-act="modal-shop">🛍️ 상점 가기</button>'
            : '<button class="btn" data-act="modal-quiz">📖 퀴즈 풀기</button>') +
          '<button class="btn ghost" data-act="close-modal">알겠어요</button>' +
        "</div>"
      );
      return;
    }
    this.encounter({ noRocket: true }); // 홈·상점에서 출발하는 첫 조우는 야생 포켓몬만
  },

  rollRarity() {
    const roll = Math.random() * 100;
    let acc = 0;
    for (const r of ["legendary", "unique", "rare", "common"]) {
      acc += CONFIG.encounterRate[r];
      if (roll < acc) return r;
    }
    return "common";
  },

  // opts.noRocket: 홈·상점에서 새로 출발하는 첫 조우 — 로켓단이 나오지 않음
  // (일반 포켓몬이 나오면 홈으로 나갔다 다시 들어오며 로켓단만 노리는 것을 막기 위함)
  encounter(opts) {
    const noRocket = !!(opts && opts.noRocket);
    // 로켓단 조우 (확률 + pity) — 야생 포켓몬 대신 등장 (모험을 이어갈 때만)
    SAVE.rocketSince = (SAVE.rocketSince || 0) + 1;
    if (!noRocket && Rocket.shouldAppear() && Rocket.stolenPool().length) { Rocket.start(); return; }
    saveNow();
    this.encounterWild();
  },

  encounterWild() {
    let rarity = this.rollRarity();
    // 해금된 탐험 지역(세대) 안에서만 출현
    let pool = rarityPoolInRange(rarity);
    if (!pool.length) { // 그 등급이 아직 없는 지역이면 일반으로 대체
      rarity = "common";
      pool = rarityPoolInRange("common");
    }
    // soft pity: 미보유가 남아 있으면 50% 확률로 미보유 중에서
    const unowned = pool.filter(id => !SAVE.pokedex[id]);
    if (unowned.length && Math.random() < CONFIG.pityRate) pool = unowned;
    const id = pool[Math.floor(Math.random() * pool.length)];
    this.mon = { id, name: POKEMON_KO[id - 1], rarity };
    this.busy = false;
    this.imgOk = true;
    this.bonus = 0;
    this.quizWord = null; this.quizWrong = false; this.quizDone = false;
    this.throwing = false;
    this.throwsLeft = CONFIG.throwLimit[rarity];
    [gifUrl(id), spriteUrl(id)].forEach(u => { const pre = new Image(); pre.src = u; });
    showScreen("adventure");
  },

  // 타입 → 배틀 배경
  TYPE_SCENE: {
    "물": "bg-sea", "얼음": "bg-ice", "불꽃": "bg-fire", "풀": "bg-forest", "벌레": "bg-forest",
    "전기": "bg-electric", "에스퍼": "bg-psychic", "고스트": "bg-night", "악": "bg-night",
    "드래곤": "bg-dragon", "바위": "bg-rock", "땅": "bg-rock", "격투": "bg-rock", "강철": "bg-rock",
    "독": "bg-swamp",
  },
  sceneClass(id) {
    const t = (DEX_INFO[id] ? DEX_INFO[id][0] : "노말").split("·")[0];
    return this.TYPE_SCENE[t] || "bg-meadow";
  },

  // 파트너: 지정한 포켓몬(지치지 않았을 때), 아니면 가장 최근에 잡은 쌩쌩한 포켓몬
  partnerId() {
    if (SAVE.partner && SAVE.pokedex[SAVE.partner] && partnerHp(SAVE.partner) > 0) return SAVE.partner;
    const ids = Object.keys(SAVE.pokedex).map(Number).filter(id => partnerHp(id) > 0);
    if (!ids.length) return null;
    return ids.reduce((a, b) => (SAVE.pokedex[a].first >= SAVE.pokedex[b].first ? a : b));
  },

  catchPct(ballKey) {
    return Math.min(100, CONFIG.baseCatch[this.mon.rarity] + CONFIG.balls[ballKey].bonus + this.bonus);
  },

  // 남은 던지기 기회 표시 (쓴 기회는 흐리게)
  throwsLeftHtml() {
    const total = CONFIG.throwLimit[this.mon.rarity];
    let icons = "";
    for (let i = 0; i < total; i++) {
      icons += '<span style="' + (i < this.throwsLeft ? "" : "opacity:.22;filter:grayscale(1)") + '">' + ballIcon("poke", 20) + "</span>";
    }
    return '<div class="throw-left">던질 수 있는 기회 ' + icons + "</div>";
  },

  ballRowHtml() {
    return this.throwsLeftHtml() + '<div class="ball-row">' + CONFIG.ballOrder.map(k => {
      const b = CONFIG.balls[k];
      const n = SAVE.balls[k];
      const pct = this.catchPct(k);
      const cls = pct >= 70 ? "pct-good" : pct >= 40 ? "pct-mid" : "pct-bad";
      return '<button class="ball-btn' + (n > 0 ? "" : " none") + '" data-throw="' + k + '">' +
        '<span class="bi">' + ballIcon(k, 34) + "</span>" +
        '<span class="bn">' + b.name + " × " + n + "</span>" +
        '<span class="bp ' + cls + '">잡을 확률 ' + pct + "%" + (this.bonus ? ' <span class="pct-up">⬆️</span>' : "") + "</span>" +
        "</button>";
    }).join("") + "</div>";
  },

  // 조우 영어 시험: 첫 시도 정답이면 이번 조우 동안 포획 확률 +15%p (코인 없음)
  // 자주 틀린 단어가 있으면 70% 확률로 그중에서 출제 (자동 복습)
  startQuiz() {
    // 기본은 전체 단어에서 골고루, 일부만 복습 단어 (CONFIG.reviewChance)
    const weak = reviewPool();
    let w, isReview = false;
    if (weak.length && Math.random() < CONFIG.reviewChance) {
      w = weak[Math.floor(Math.random() * weak.length)];
      isReview = true;
    } else {
      const pool = activeWords();
      w = pool[Math.floor(Math.random() * pool.length)];
    }
    const listenMode = TTS.ok && SAVE.settings.tts && Math.random() < 0.4;
    this.quizWord = w; this.quizWrong = false; this.quizDone = false;
    this.quizTries = 0; this.quizListen = listenMode;
    const choices = shuffle([w, ...pickN(activeWords().filter(x => x.id !== w.id), 2)]);
    typeText($("#battle-dialog"), isReview
      ? "야생 " + this.mon.name + "의 복습 시험이다! 📝"
      : "야생 " + this.mon.name + "의 영어 시험이다!");
    const pid = this.partnerId();
    const title = isReview
      ? "📝 전에 틀렸던 단어예요!" + (pid ? " 맞히면 " + josa(POKEMON_KO[pid - 1], "이가") + " 기술을 쓴다 ⬆️" : "")
      : (pid ? "맞히면 " + josa(POKEMON_KO[pid - 1], "이가") + " 기술을 쓴다! ⬆️" : "영어 시험을 통과해 보자!");
    const controls = $("#adv-controls");
    controls.innerHTML =
      '<div class="battle-quiz">' +
        '<div class="bq-title">' + esc(title) + "</div>" +
        '<div class="bq-prompt">' +
          (listenMode
            ? '<button class="speak-btn" id="bq-speak" style="width:54px;height:54px;font-size:25px">🔊</button><span class="bqk">잘 듣고 골라요!</span>'
            : '<span class="bqe">' + emojiHtml(w) + '</span><span class="bqk">' + esc(w.ko) + "</span>") +
        "</div>" +
        '<div class="choices">' + choices.map(c => listenMode
          ? '<button class="choice" data-bq="' + c.id + '"><span class="em" style="font-size:26px">' + emojiHtml(c) + '</span><span class="ko">' + esc(c.ko) + "</span></button>"
          : '<button class="choice" data-bq="' + c.id + '"><span class="en">' + esc(c.en) + "</span></button>"
        ).join("") + "</div>" +
      "</div>";
    controls.classList.remove("hidden");
    $("#adv-flee").classList.remove("hidden"); // 포켓몬이 보이면 언제든 도망 가능 (중복 스킵용)
    armChoices(controls.querySelector(".choices")); // 아이 모드: 문제를 읽을 시간만큼 보기 잠금
    if (listenMode) {
      $("#bq-speak").addEventListener("click", () => { SFX.tap(); TTS.speak(w.en); });
      later(() => TTS.speak(w.en), 350);
    }
  },

  // 조우 시험에서 시도를 다 썼다 → 정답을 보여주고 볼 던지기로 (파트너 기술 보너스는 없음)
  bqReveal() {
    Session.lock = true;
    this.quizDone = true;
    const box = $(".battle-quiz");
    const old = box && box.querySelector(".coach-line");
    if (old) old.remove();
    const right = box && box.querySelector('.choice[data-bq="' + this.quizWord.id + '"]');
    if (right) right.classList.add("right");
    queueRetry(this.quizWord.id);
    TTS.speak(this.quizWord.en);
    typeText($("#battle-dialog"), "정답은 " + this.quizWord.en + " (" + this.quizWord.ko + ")! 다음에 꼭 맞히자 🔁");
    later(() => {
      Session.lock = false;
      typeText($("#battle-dialog"), "어떤 볼을 던질까?");
      $("#adv-controls").innerHTML = this.ballRowHtml();
      this.busy = false;
    }, 2200);
  },

  // 지역 도감 완성 확인 → "탐험 지역이 늘어났습니다!" 축하 + 다음 세대 해금
  checkRegionClear() {
    const cur = unlockedGen();
    if (!genComplete(cur)) return false;
    const info = genInfo(cur);
    const isLast = cur >= GENERATIONS.length;
    if (!isLast) SAVE.dexGen = cur + 1;
    saveNow();
    SFX.fanfare("legendary");
    fxConfetti(["🎉", "🌈", "✨", "🗺️", "👑"], 26);
    this.legendImpact();
    const next = isLast ? null : genInfo(cur + 1);
    showModal(
      '<div class="m-emoji">' + (isLast ? "👑🎊" : "🗺️✨") + "</div>" +
      '<div class="m-title">' + (isLast ? "모든 지역 도감 완성!" : "탐험 지역이 늘어났습니다!") + "</div>" +
      '<div class="region-badge">' + info.emoji + " " + info.region + " 도감 완성 (" +
        (info.to - info.from + 1) + "마리) 🎉</div>" +
      '<div class="m-text">' + (isLast
        ? "축하해요! 포켓몬 <b>" + TOTAL_POKEMON + "마리</b>를 모두 모았어요!<br>다음 세대 출현을 기다려 주세요! 🙌"
        : "새로운 지역 <b>" + next.emoji + " " + next.region + "</b>이 열렸어요!<br>" +
          "이제 <b>" + next.region + "</b>의 포켓몬 " + (next.to - next.from + 1) + "마리를 만날 수 있어요!") +
      "</div>" +
      '<div class="m-btns" style="flex-direction:column">' +
        (isLast ? "" : '<button class="btn red" data-act="modal-adventure">🌿 새 지역으로 모험 가기</button>') +
        '<button class="btn purple" data-act="modal-dex">📕 도감 보기</button>' +
        '<button class="btn ghost" data-act="modal-home">🏠 홈으로</button>' +
      "</div>"
    );
    return true;
  },

  // 전설 등장 임팩트: 화면 흔들림 + 섬광 + 저음 쿵!
  legendImpact() {
    document.body.classList.remove("shake");
    void document.body.offsetWidth;
    document.body.classList.add("shake");
    const flash = document.createElement("div");
    flash.id = "legend-flash";
    document.body.appendChild(flash);
    const cry = document.createElement("div");
    cry.className = "legend-cry";
    cry.textContent = "⚡ 전설의 포켓몬 등장! ⚡";
    document.body.appendChild(cry);
    SFX.tone(70, 0.55, "sine", 0, 0.3);
    SFX.tone(110, 0.4, "square", 0.06, 0.16);
    SFX.tone(52, 0.7, "sine", 0.25, 0.24);
    later(() => document.body.classList.remove("shake"), 900);
    later(() => flash.remove(), 900);
    later(() => cry.remove(), 1700);
  },

  // 도망가기: 짧은 영어 문장을 만들어야 도망칠 수 있음 (틀려도 계속 시도)
  playerFlee() {
    if (this.throwing) return;
    EscapeQuiz.open(() => this.doFlee());
  },

  doFlee() {
    this.quizDone = true;
    this.busy = true;
    SFX.escape();
    SFX.bgmStop();
    Cry.stop();
    const img = $("#adv-mon") && $("#adv-mon").querySelector("img, .fallback");
    if (img) img.classList.add("fleeing");
    typeText($("#battle-dialog"), "무사히 도망쳤다!");
    later(() => {
      // 팝업 없이 바로 다음 포켓몬 (볼이 없으면 상점/퀴즈로 안내)
      if (this.ballTotal() > 0) { this.encounter(); return; }
      const ballsLeft = 0;
      showModal(
        '<div class="m-emoji">🏃💨</div>' +
        '<div class="m-title">무사히 도망쳤다!</div>' +
        '<div class="m-text">볼이 다 떨어졌어요.<br>코인을 모아 볼을 사고 다시 모험을 떠나요!</div>' +
        '<div class="m-btns" style="flex-direction:column">' +
          (SAVE.coins >= CONFIG.balls.poke.price
            ? '<button class="btn yellow" data-act="modal-shop">🛍️ 상점 가기</button>'
            : '<button class="btn" data-act="modal-quiz">📖 퀴즈로 코인 모으기</button>') +
          '<button class="btn ghost" data-act="modal-home">🏠 홈으로</button>' +
        "</div>"
      );
    }, 950); // 도망 애니메이션을 보여준 뒤 바로 다음 포켓몬
  },

  // 파트너 고유 기술 연출: 런지 → 타입 발사체 → 명중(흔들림+💥) → HP 감소
  // opts.targetSel / opts.hpSel 로 대상을 바꿀 수 있음 (로켓단 배틀에서 재활용)
  partnerAttack(pid, totalBonus, done, opts) {
    const o = opts || {};
    const scene = $(o.sceneSel || "#adv-scene");
    const allyEl = $("#adv-ally");
    const monEl = $(o.targetSel || "#adv-mon");
    if (!scene || !monEl) { if (done) done(); return; } // 대상이 없으면 연출 생략
    const dex = DEX_INFO[pid];
    const moveName = dex ? dex[1].split(" · ")[0] : "몸통박치기";
    const fx = TYPE_FX[(dex ? dex[0] : "노말").split("·")[0]] || "💥";
    typeText($("#battle-dialog"), POKEMON_KO[pid - 1] + "의 " + moveName + "!");
    SFX.attack();
    if (allyEl) {
      allyEl.classList.add("ally-attack");
      later(() => allyEl.classList.remove("ally-attack"), 500);
    }
    later(() => {
      const p = document.createElement("div");
      p.className = "fx-projectile";
      p.textContent = fx;
      scene.appendChild(p);
      const sr = scene.getBoundingClientRect();
      const er = monEl.getBoundingClientRect();
      const ar = allyEl ? allyEl.getBoundingClientRect() : null;
      const sx = ar ? (ar.left - sr.left + ar.width * 0.7) : sr.width * 0.2;
      const sy = ar ? (ar.top - sr.top + 8) : sr.height * 0.6;
      p.style.left = sx + "px";
      p.style.top = sy + "px";
      const dx = (er.left - sr.left + er.width / 2) - sx;
      const dy = (er.top - sr.top + er.height / 2) - sy;
      requestAnimationFrame(() => { p.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.4)"; });
      later(() => {
        p.remove();
        SFX.hit();
        const img = monEl.querySelector("img, .fallback");
        if (img) { img.classList.add("enemy-hit"); later(() => img.classList.remove("enemy-hit"), 600); }
        const burst = document.createElement("div");
        burst.className = "hit-burst";
        burst.textContent = "💥";
        monEl.appendChild(burst);
        later(() => burst.remove(), 600);
        if (o.hpSel !== null) { // null이면 HP는 호출한 쪽에서 직접 처리
          const hp = $(o.hpSel || "#enemy-hp");
          if (hp) hp.style.width = Math.max(20, 100 - totalBonus * 3) + "%";
        }
        later(done, 650);
      }, 480);
    }, 400);
  },

  bqAnswer(btn) {
    if (this.quizDone || Session.lock) return;
    const id = Number(btn.dataset.bq);
    const dialog = $("#battle-dialog");
    if (id !== this.quizWord.id) {
      if (!this.quizWrong) {
        this.quizWrong = true;
        SAVE.stats.totalAnswered++;
        noteWordResult(this.quizWord.id, false);
      }
      this.quizTries = (this.quizTries || 0) + 1;
      SFX.wrong();
      btn.classList.add("wrong");
      typeText(dialog, "앗, 빗나갔다! 다시 골라 보자!");
      // 아이 모드: 잠깐 멈추고 고른 보기에서 배우기 → 시도를 다 쓰면 정답을 보여주고 진행
      if (kidFocusOn()) {
        if (this.quizTries >= CONFIG.kidFocus.maxTries) { this.bqReveal(); return; }
        const picked = activeWords().find(x => x.id === id);
        const w = this.quizWord;
        if (picked) coachPause($(".battle-quiz"),
          this.quizListen                                  // 듣기 문제는 보기가 한글
            ? coachMsgKo(picked, "🔊 를 눌러 다시 들어 볼까?")
            : coachMsg(picked, "우리가 찾는 건 <b>" + esc(w.ko) + "</b>!"),
          this.quizListen ? w.en : picked.en);
      }
      return;
    }
    this.quizDone = true;
    btn.classList.add("right");
    TTS.speak(this.quizWord.en);
    const showBallRow = (delay) => later(() => {
      typeText(dialog, "어떤 볼을 던질까?");
      $("#adv-controls").innerHTML = this.ballRowHtml();
      this.busy = false;
    }, delay);

    if (!this.quizWrong) {
      SAVE.stats.totalAnswered++;
      SAVE.stats.totalCorrect++;
      noteWordResult(this.quizWord.id, true);
      SFX.combo();
      const pid = this.partnerId();
      // 보너스는 파트너 등급에서만 (기본 보너스 없음)
      this.bonus = pid ? CONFIG.partnerBonus[rarityOf(pid)] : 0;
      if (pid) {
        // 파트너가 고유 기술 시전! (등급이 높을수록 보너스 큼) → HP -10%
        later(() => this.partnerAttack(pid, this.bonus, () => {
          const hpLeft = drainPartner(pid);
          const fill = $("#ally-hp-fill");
          if (fill) {
            fill.style.width = hpLeft + "%";
            fill.classList.toggle("low", hpLeft <= 30);
          }
          typeText(dialog, "효과는 굉장했다! 잡을 확률 +" + this.bonus + "% ⬆️");
          if (hpLeft <= 0) {
            later(() => toast(josa(POKEMON_KO[pid - 1], "은는") + " 지쳤어요 😴 다음엔 다른 파트너와 함께해요! (내일 회복)", 3200), 1300);
          }
          showBallRow(1400);
        }), 600);
        typeText(dialog, "정답!");
      } else {
        typeText(dialog, "정답! 포켓몬을 잡으면 파트너가 기술로 도와줄 거야!");
        showBallRow(1800);
      }
    } else {
      SFX.correct();
      typeText(dialog, "정답! 다음엔 한 번에 맞혀 보자!");
      showBallRow(1500);
    }
  },

  render(el) {
    const m = this.mon;
    const info = CONFIG.rarityInfo[m.rarity];
    const pid = this.partnerId();
    const stars = m.rarity === "legendary"
      ? '<div class="star-overlay">' +
        [[8,12],[30,6],[55,15],[75,8],[88,22],[18,28]].map((p, i) =>
          '<span style="left:' + p[0] + "%;top:" + p[1] + "%;animation-delay:" + (i * 0.3) + 's">✨</span>').join("") +
        "</div>"
      : "";
    el.innerHTML =
      '<div class="topbar">' +
        '<button class="icon-btn" data-act="go-home">🏠</button>' +
        '<span class="chip">🪙 ' + SAVE.coins + "</span>" +
        '<span class="spacer"></span>' +
        '<span class="chip">야생 포켓몬 출현!</span>' +
      "</div>" +
      '<div class="adv-scene ' + this.sceneClass(m.id) + '" id="adv-scene">' +
        stars +
        '<div class="battle-platform platform-enemy"></div>' +
        '<div class="battle-platform platform-ally"></div>' +
        '<div class="grass-patch" id="grass-patch">🌿</div>' +
        '<div class="adv-enemy hidden" id="adv-mon">' +
          '<img data-mid="' + m.id + '" src="' + gifUrl(m.id) + '" alt="" onerror="advImgFail(this)">' +
        "</div>" +
        '<div class="nameplate hidden" id="nameplate">' +
          '<div class="np-name">' + esc(m.name) + ' <span class="rarity-badge ' + info.badge + '">' + info.ko + "</span>" +
            (SAVE.pokedex[m.id]
              ? ' <span class="rarity-badge rb-common">✔ 있음</span>'
              : ' <span class="rarity-badge rb-unique">NEW!</span>') + "</div>" +
          '<div>' + typeChipsHtml(m.id) + "</div>" +
          '<div class="hpwrap"><span class="hplabel">HP</span><div class="hpbar"><i id="enemy-hp"></i></div></div>' +
        "</div>" +
        (pid
          ? '<div class="adv-ally hidden" id="adv-ally">' +
            '<img data-mid="' + pid + '" src="' + gifBackUrl(pid) + '" alt="" onerror="allyImgFail(this)">' +
            '<div class="ally-label">' + esc(POKEMON_KO[pid - 1]) + "</div>" +
            '<div class="ally-hp"><i id="ally-hp-fill" class="' + (partnerHp(pid) <= 30 ? "low" : "") + '" style="width:' + partnerHp(pid) + '%"></i></div>' +
            "</div>"
          : "") +
        '<div class="battle-dialog" id="battle-dialog"></div>' +
      "</div>" +
      '<div id="adv-controls" class="hidden">' + this.ballRowHtml() + "</div>" +
      '<div id="adv-flee" class="hidden" style="text-align:center;margin-top:10px">' +
        '<button class="btn ghost" data-act="player-flee" style="font-size:15px;padding:10px 18px">🏃 도망가기 (다른 포켓몬 찾기)</button>' +
      "</div>";

    // 인카운터 연출: 부스럭 → 등장 → 볼 선택
    this.busy = true;
    typeText($("#battle-dialog"), "부스럭... 부스럭...");
    later(() => {
      $("#grass-patch").classList.add("hidden");
      $("#adv-mon").classList.remove("hidden");
      $("#nameplate").classList.remove("hidden");
      const ally = $("#adv-ally");
      if (ally) ally.classList.remove("hidden");
      Cry.play(m.id); // 진짜 울음소리로 등장!
      if (m.rarity === "legendary") {
        SFX.fanfare("legendary");
        this.legendImpact(m); // 화면이 흔들리는 등장 임팩트
      }
      SFX.bgmStart();
      typeText($("#battle-dialog"), "앗! 야생 " + josa(m.name, "이가") + " 나타났다!");
    }, 1400);
    later(() => this.startQuiz(), 3000);
    if (!pid && Object.keys(SAVE.pokedex).length) {
      later(() => toast("파트너들이 모두 지쳐서 쉬고 있어요 😴 내일이면 회복돼요!", 3000), 3200);
    }

    el.addEventListener("click", (e) => {
      const bq = e.target.closest("[data-bq]");
      if (bq && !bq.classList.contains("wrong")) { this.bqAnswer(bq); return; }
      const bb = e.target.closest("[data-throw]");
      if (bb && !this.busy) this.throwBall(bb.dataset.throw);
    });
  },

  throwBall(ballKey) {
    if (SAVE.balls[ballKey] <= 0) return;
    this.busy = true;
    this.throwing = true;
    const fleeBtn = $("#adv-flee");
    if (fleeBtn) { fleeBtn.style.opacity = ".35"; fleeBtn.style.pointerEvents = "none"; }
    SAVE.balls[ballKey]--;
    myEco().used[ballKey]++;
    saveNow();
    const pct = this.catchPct(ballKey);
    const success = Math.random() * 100 < pct;
    const m = this.mon;
    const scene = $("#adv-scene");
    const monEl = $("#adv-mon");
    const dialog = $("#battle-dialog");
    const controls = $("#adv-controls");
    controls.style.opacity = ".35";
    controls.style.pointerEvents = "none";
    typeText(dialog, CONFIG.balls[ballKey].name + " 던진다~!");
    SFX.throwBall();

    // 1) 볼 날아가기: 아군 자리 → 상대 위치로 (JS 계산 포물선)
    const ball = document.createElement("div");
    ball.className = "battle-ball";
    ball.innerHTML = ballIcon(ballKey, 34);
    scene.appendChild(ball);
    const sr = scene.getBoundingClientRect();
    const er = monEl.getBoundingClientRect();
    const sx = sr.width * 0.16, sy = sr.height * 0.62;
    ball.style.left = sx + "px";
    ball.style.top = sy + "px";
    const dx = (er.left - sr.left + er.width / 2) - sx - 17;
    const dy = (er.top - sr.top + er.height / 2) - sy - 17;
    requestAnimationFrame(() => { ball.style.transform = "translate(" + dx + "px," + dy + "px) rotate(720deg)"; });

    later(() => {
      // 2) 포켓몬이 볼 속으로 빨려 들어감
      ball.remove();
      const img = monEl.querySelector("img, .fallback");
      if (img) img.classList.add("sucked");
      later(() => {
        const wob = document.createElement("div");
        wob.className = "wobbling";
        wob.innerHTML = ballIcon(ballKey, 54);
        monEl.appendChild(wob);
        typeText(dialog, "두근두근…");
        const shakes = m.rarity === "common" ? 1 : m.rarity === "rare" ? 2 : 3;
        for (let i = 0; i < shakes; i++) later(() => SFX.shake(), 250 + i * 700);
        later(() => {
          wob.remove();
          if (success) this.caught(monEl, dialog);
          else this.escaped(monEl, dialog, controls);
        }, 400 + shakes * 750);
      }, 380);
    }, 700);
  },

  caught(monEl, dialog) {
    const m = this.mon;
    const isNew = !SAVE.pokedex[m.id];
    const wasLineComplete = evoLineComplete(m.id);

    entry.count++;

      (this.lineJustCompleted

        "도감: <b>" + dexCaught() + " / " + dexMax() + "</b></div>" +
      '<div class="m-btns" style="flex-direction:column">' +
        (ballsLeft > 0 ? '<button class="btn red" data-act="modal-adventure">🌿 또 모험가기 (' + ballsLeft + "개)</button>" : "") +
        '<button class="btn purple" data-act="modal-dex">📕 도감 보기</button>' +
        '<button class="btn ghost" data-act="modal-home">🏠 홈으로</button>' +

    );
    // 이 지역(세대) 도감을 다 채웠는지 확인 → 축하 + 다음 지역 해금
    later(() => this.checkRegionClear(), 900);
  },

  escaped(monEl, dialog, controls) {
    const m = this.mon;
    SFX.escape();
    typeText(dialog, "앗! 나와버렸다!");
    const img = monEl.querySelector("img, .fallback");

    this.throwsLeft--; // 던지기 기회 1 소모 — 다 쓰면 도망감
    const flee = this.throwsLeft <= 0;
    later(() => {
      if (img) img.classList.remove("reappear");
      const fleeBtn = $("#adv-flee");
      if (flee) {
        SFX.bgmStop();
        if (fleeBtn) fleeBtn.classList.add("hidden");
        if (img) img.classList.add("fleeing");
        typeText(dialog, "기회를 다 썼다… 야생 " + josa(m.name, "이가") + " 도망갔다! 💨");
        later(() => {
          const ballsLeft = this.ballTotal();
          controls.innerHTML =
            '<div class="result-btns">' +
            (ballsLeft > 0 ? '<button class="btn red big" data-act="modal-adventure">🌿 다시 모험가기 (' + ballsLeft + "개)</button>" : "") +
            (SAVE.coins >= CONFIG.balls.poke.price ? '<button class="btn yellow" data-act="go-shop">🛍️ 상점 가기</button>' : "") +
            '<button class="btn ghost" data-act="go-home">🏠 홈으로</button>' +
            "</div>";
          controls.style.opacity = "1";
          controls.style.pointerEvents = "auto";
        }, 700);
      } else {
        const ballsLeft = this.ballTotal();
        if (ballsLeft <= 0) {
          SFX.bgmStop();
          if (fleeBtn) fleeBtn.classList.add("hidden");
          typeText(dialog, "볼이 다 떨어졌어… " + josa(m.name, "이가") + " 사라졌다 💨");
          controls.innerHTML =
            '<div class="result-btns">' +
            (SAVE.coins >= CONFIG.balls.poke.price ? '<button class="btn yellow big" data-act="go-shop">🛍️ 상점 가기</button>' : '<button class="btn big" data-act="modal-quiz">📖 퀴즈로 코인 모으기</button>') +
            '<button class="btn ghost" data-act="go-home">🏠 홈으로</button>' +
            "</div>";
        } else {
          typeText(dialog, "아직 안 도망갔어! 한 번 더! (기회 " + this.throwsLeft + "번 남음)");
          controls.innerHTML = this.ballRowHtml();

        this.busy = false;
      }

  },
};

Screens.pokedex = (el) => {
  const maxId = dexMax();
  const caughtIds = Object.keys(SAVE.pokedex).map(Number).filter(id => SAVE.pokedex[id].count >= 1);
  const inRange = caughtIds.filter(id => id <= maxId);
  const byRarity = { common: 0, rare: 0, unique: 0, legendary: 0 };
  inRange.forEach(id => byRarity[rarityOf(id)]++);
  const cur = unlockedGen();

  // 해금된 지역만 세대별 섹션으로 표시
  let sections = "";
  for (let g = 1; g <= cur; g++) {
    const info = genInfo(g);
    const done = genCaught(g);
    const total = info.to - info.from + 1;
    const cells = [];
    for (let id = info.from; id <= info.to; id++) {
      const entry = SAVE.pokedex[id];
      if (entry && entry.count >= 1) { // 방어막: 유효한 포획 기록만 '잡음'으로 표시
        cells.push(
          '<button class="dex-cell' + (evoLineComplete(id) ? " prism" : "") + '" data-dex="' + id + '">' +
          (entry.count > 1 ? '<span class="dupe">×' + entry.count + "</span>" : "") +
          '<img loading="lazy" src="' + spriteUrl(id) + '" alt="" onerror="this.outerHTML=\'<div class=qmark>🔴</div>\'">' +
          '<div class="dn">' + esc(POKEMON_KO[id - 1]) + "</div>" +
          '<div class="dno">No.' + id + "</div></button>"
        );
      } else {
        cells.push(
          '<button class="dex-cell unseen" data-dex="' + id + '">' +
          '<img loading="lazy" src="' + spriteUrl(id) + '" alt="" onerror="this.outerHTML=\'<div class=qmark>❓</div>\'">' +
          '<div class="dn">???</div><div class="dno">No.' + id + "</div></button>"
        );
      }
    }
    sections +=
      '<div class="gen-head' + (done >= total ? " done" : "") + '">' +
        "<span>" + info.emoji + " " + info.region + "</span>" +
        '<span class="gen-count">' + done + " / " + total + (done >= total ? " ✅" : "") + "</span>" +
      "</div>" +
      '<div class="dex-grid">' + cells.join("") + "</div>";
  }
  // 아직 열리지 않은 지역 안내
  if (cur < GENERATIONS.length) {
    const nx = genInfo(cur + 1);
    sections += '<div class="gen-locked">🔒 다음 지역 <b>' + nx.emoji + " " + nx.region +
      "</b>은 " + genInfo(cur).region + " 도감을 다 모으면 열려요!</div>";
  } else {
    sections += '<div class="gen-locked">👑 모든 지역을 탐험했어요! 다음 세대 출현을 기다려 주세요!</div>';
  }

  el.innerHTML =
    topbarHtml({ home: true }) +
    '<div class="dex-head">' +
      '<span class="dex-count">📕 ' + inRange.length + " / " + maxId + (maxId >= TOTAL_POKEMON && inRange.length >= TOTAL_POKEMON ? " 👑" : "") + "</span>" +
      '<span class="dex-sub">일반 ' + byRarity.common + " · 레어 " + byRarity.rare + " · 유니크 " + byRarity.unique + " · 전설 " + byRarity.legendary +
        " · 지역 " + cur + "/" + GENERATIONS.length + "</span>" +
    "</div>" +
    sections;

  el.addEventListener("click", (e) => {
    const cell = e.target.closest(".dex-cell");
    if (!cell) return;
    const id = Number(cell.dataset.dex);
    const entry = SAVE.pokedex[id];
    if (!entry) { SFX.tap(); toast("아직 못 잡은 포켓몬이에요! 모험에서 만나봐요 🌿", 1800); return; }
    SFX.tap();
    Cry.play(id); // 도감에서 눌러도 울음소리!
    const info = CONFIG.rarityInfo[rarityOf(id)];
    const dex = DEX_INFO[id];
    const d = new Date(entry.first);
    showModal(
      '<img class="m-img" src="' + spriteUrl(id) + '" onerror="this.outerHTML=\'<div class=m-emoji>🔴</div>\'">' +
      '<div class="m-title">No.' + id + " " + esc(POKEMON_KO[id - 1]) +
        ' <span class="rarity-badge ' + info.badge + '">' + info.ko + "</span></div>" +
      '<div class="m-types">' + typeChipsHtml(id) + "</div>" +
      (EVO_LINE_OF[id]
        ? '<div class="evo-line">🧬 ' +
          EVO_LINE_OF[id].map(x => (SAVE.pokedex[x] ? esc(POKEMON_KO[x - 1]) : "???")).join(" → ") +
          (evoLineComplete(id) ? ' <span class="prism-tag">🌈 진화 완성!</span>' : "") +
          "</div>"
        : "") +
      (dex ? '<div class="dex-story">💥 <b>좋아하는 기술</b> · ' + esc(dex[1]) + "<br><br>📖 " + esc(dex[2]) + "</div>" : "") +
      '<div class="m-text">' + entry.count + "번 만났어요 · 처음 잡은 날: " +
        d.getFullYear() + "년 " + (d.getMonth() + 1) + "월 " + d.getDate() + "일</div>" +
      '<div class="m-btns" style="flex-direction:column">' +
        (partnerHp(id) <= 0
          ? '<button class="btn" disabled>😴 지쳐서 쉬는 중 — 내일 회복돼요</button>'
          : SAVE.partner === id
            ? '<button class="btn green" disabled>🤝 지금 나의 파트너! (HP ' + partnerHp(id) + "%)</button>"
            : '<button class="btn green" data-act="set-partner" data-pid="' + id + '">🤝 파트너로 정하기 (HP ' + partnerHp(id) + "%)</button>") +
        '<button class="btn ghost" data-act="close-modal">닫기</button>' +
      "</div>"
    );
  });
};

/* ================================================================
   [S18.5] 가족 동기화 + 가족 톡
   - 가족 코드 하나로 여러 기기(아이 패드/부모 패드)가 같은 진행을 공유
   - 코인·볼은 기기별 누적 카운터 합산이라 동시에 놀아도 안 꼬임
   - 로컬 저장이 항상 우선: 인터넷이 끊겨도 게임은 정상, 연결되면 자동 병합
================================================================ */
// 가족 톡 보낸 사람 = 현재 모드 (아이/부모/이모/할머니)
function chatRole() { return MODE_LABEL[SAVE.mode] ? SAVE.mode : "kid"; }
const CHAT_WHO = MODE_LABEL;

const Family = {
  LKEY: "engmon_family_v1",
  st: { code: null, chatReadT: 0 },
  pollTimer: null, syncTimer: null, syncing: false, lastUnread: 0,

  enabled() { return !!CLOUD_DB_URL; },
  linked() { return this.enabled() && !!this.st.code; },

  init() {
    try { Object.assign(this.st, JSON.parse(localStorage.getItem(this.LKEY)) || {}); } catch (e) {}
    if (this.linked()) {
      setTimeout(() => this.sync(), 1200);
      this.startPoll();
    }
  },
  saveSt() { try { localStorage.setItem(this.LKEY, JSON.stringify(this.st)); } catch (e) {} },
  url(code) { return CLOUD_DB_URL.replace(/\/+$/, "") + "/families/" + code + ".json"; },
  genCode() {
    const c = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
    let s = "";
    for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * c.length)];
    return s;
  },

  packLocal() {
    return {
      updatedAt: Date.now(),
      eco: SAVE.eco, pokedex: SAVE.pokedex, wordStats: SAVE.wordStats,
      stats: SAVE.stats, partnerHp: SAVE.partnerHp, partner: SAVE.partner, dexGen: SAVE.dexGen || 1,
      showdownStage: SAVE.showdownStage || 1,
      chat: SAVE.chat || [],
    };
  },

  // 클라우드 저장용: 숫자 키에 접두사를 붙여 Firebase의 배열 변환을 원천 차단
  packForCloud(doc) {
    return Object.assign({}, doc, {
      pokedex: prefixMap(doc.pokedex, "p"),
      wordStats: prefixMap(doc.wordStats, "w"),
      partnerHp: prefixMap(doc.partnerHp, "h"),
    });
  },
  // 클라우드에서 읽은 문서 정화: 접두사 해제 + 배열 복원 + 유효 항목만 (과거 손상 문서도 여기서 치유됨)
  normalizeRemote(doc) {
    if (!doc || typeof doc !== "object") return {};
    return Object.assign({}, doc, {
      pokedex: sanitizePokedex(doc.pokedex || {}),
      wordStats: sanitizeWordStats(doc.wordStats || {}),
      partnerHp: sanitizePartnerHp(doc.partnerHp || {}),
      chat: Array.isArray(doc.chat) ? doc.chat : Object.values(doc.chat || {}),
    });
  },

  // 두 저장본 병합 — 카운터는 max(단조증가), 도감·기록은 합집합, 채팅은 중복 제거 합집합
  merge(a, b) {
    const mx = (x, y) => Math.max(x || 0, y || 0);
    const m = { updatedAt: mx(a.updatedAt, b.updatedAt) };
    m.eco = {};
    new Set(Object.keys(a.eco || {}).concat(Object.keys(b.eco || {}))).forEach(d => {
      const ea = (a.eco || {})[d] || emptyEco();
      const eb = (b.eco || {})[d] || emptyEco();
      const e = emptyEco();
      e.earned = mx(ea.earned, eb.earned);
      e.spent = mx(ea.spent, eb.spent);
      CONFIG.ballOrder.forEach(k => {
        e.bought[k] = mx(ea.bought && ea.bought[k], eb.bought && eb.bought[k]);
        e.used[k] = mx(ea.used && ea.used[k], eb.used && eb.used[k]);
      });
      m.eco[d] = e;
    });
    m.pokedex = {};
    new Set(Object.keys(a.pokedex || {}).concat(Object.keys(b.pokedex || {}))).forEach(id => {
      const pa = (a.pokedex || {})[id], pb = (b.pokedex || {})[id];
      const count = mx(pa && pa.count, pb && pb.count);
      if (count < 1) return; // 유령 항목(count 0) 생성 금지 — 재발 방지
      let first = Math.min(pa && pa.first ? pa.first : Infinity, pb && pb.first ? pb.first : Infinity);
      if (!isFinite(first)) first = Date.now();
      m.pokedex[id] = { count, first };
    });
    m.wordStats = {};
    new Set(Object.keys(a.wordStats || {}).concat(Object.keys(b.wordStats || {}))).forEach(id => {
      const wa = (a.wordStats || {})[id] || {}, wb = (b.wordStats || {})[id] || {};
      m.wordStats[id] = { w: mx(wa.w, wb.w), c: mx(wa.c, wb.c) };
    });
    const sa = a.stats || {}, sb = b.stats || {};
    m.stats = {
      totalAnswered: mx(sa.totalAnswered, sb.totalAnswered),
      totalCorrect: mx(sa.totalCorrect, sb.totalCorrect),
      bestCombo: mx(sa.bestCombo, sb.bestCombo),
      caught: mx(sa.caught, sb.caught),
      rocketWins: mx(sa.rocketWins, sb.rocketWins),
      gamesPlayed: {
        quiz: mx(sa.gamesPlayed && sa.gamesPlayed.quiz, sb.gamesPlayed && sb.gamesPlayed.quiz),
        chain: mx(sa.gamesPlayed && sa.gamesPlayed.chain, sb.gamesPlayed && sb.gamesPlayed.chain),
        memory: mx(sa.gamesPlayed && sa.gamesPlayed.memory, sb.gamesPlayed && sb.gamesPlayed.memory),
        puzzle: mx(sa.gamesPlayed && sa.gamesPlayed.puzzle, sb.gamesPlayed && sb.gamesPlayed.puzzle),
        travel: mx(sa.gamesPlayed && sa.gamesPlayed.travel, sb.gamesPlayed && sb.gamesPlayed.travel),
        showdown: mx(sa.gamesPlayed && sa.gamesPlayed.showdown, sb.gamesPlayed && sb.gamesPlayed.showdown),
        trace: mx(sa.gamesPlayed && sa.gamesPlayed.trace, sb.gamesPlayed && sb.gamesPlayed.trace),
      },
    };
    m.partnerHp = {};
    new Set(Object.keys(a.partnerHp || {}).concat(Object.keys(b.partnerHp || {}))).forEach(id => {
      const ha = (a.partnerHp || {})[id], hb = (b.partnerHp || {})[id];
      m.partnerHp[id] = (!hb || (ha && ha.t >= hb.t)) ? ha : hb;
    });
    m.partner = ((a.updatedAt || 0) >= (b.updatedAt || 0) ? (a.partner || b.partner) : (b.partner || a.partner)) || null;
    m.dexGen = mx(a.dexGen, b.dexGen) || 1; // 해금 지역은 더 앞선 쪽으로
    m.showdownStage = mx(a.showdownStage, b.showdownStage) || 1; // 쇼다운 진행도도 더 앞선 쪽으로
    const seen = new Set();
    const chat = [];
    (a.chat || []).concat(b.chat || []).forEach(msg => {
      if (!msg || !msg.t) return;
      const k = msg.t + "|" + msg.f + "|" + msg.x;
      if (!seen.has(k)) { seen.add(k); chat.push(msg); }
    });
    chat.sort((x, y) => x.t - y.t);
    m.chat = chat.slice(-200);
    return m;
  },

  applyDoc(m) {
    SAVE.eco = m.eco;
    SAVE.pokedex = m.pokedex;
    SAVE.wordStats = m.wordStats;
    SAVE.stats = m.stats;
    SAVE.partnerHp = m.partnerHp;
    SAVE.partner = m.partner;
    SAVE.dexGen = Math.max(1, Math.min(GENERATIONS.length, m.dexGen || 1));
    SAVE.showdownStage = Math.max(1, Math.min(CONFIG.showdown.stages + 1, m.showdownStage || 1));
    SAVE.chat = m.chat;
    applyEco();
    Storage.save(SAVE); // saveNow()는 queueSync를 또 부르므로 직접 저장
    const chip = $("#coin-chip");
    if (chip) chip.textContent = SAVE.coins;
    this.updateBadges();
  },

  async sync(showErrors) {
    if (!this.linked() || this.syncing) return false;
    this.syncing = true;
    try {
      const r = await fetch(this.url(this.st.code));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const remote = this.normalizeRemote(await r.json()); // 배열 복원 + 유효 항목만
      const merged = this.merge(this.packLocal(), remote);
      this.applyDoc(merged);
      await fetch(this.url(this.st.code), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(this.packForCloud(merged)), // 접두사 키로 저장 (배열 변환 차단)
      });
      return true;
    } catch (e) {
      if (showErrors) toast("연결이 안 돼요. 인터넷을 확인해 주세요 📶");
      return false;
    } finally {
      this.syncing = false;
    }
  },

  queueSync() {
    if (!this.linked()) return;
    clearTimeout(this.syncTimer);
    this.syncTimer = setTimeout(() => this.sync(), 2500);
  },
  startPoll() {
    clearInterval(this.pollTimer);
    if (this.linked()) this.pollTimer = setInterval(() => this.sync(), 45000);
  },

  async createFamily() {
    const code = this.genCode();
    await fetch(this.url(code), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(this.packForCloud(this.merge(this.packLocal(), {}))),
    });
    this.st.code = code;
    this.saveSt();
    this.startPoll();
    return code;
  },
  async joinFamily(code) {
    const r = await fetch(this.url(code));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const remote = await r.json();
    if (!remote) throw new Error("no such family");
    this.st.code = code;
    this.saveSt();
    await this.sync();
    this.startPoll();
  },
  unlink() {
    this.st.code = null;
    this.saveSt();
    clearInterval(this.pollTimer);
  },

  unread() {
    const my = chatRole();
    return (SAVE.chat || []).filter(msg => msg.t > (this.st.chatReadT || 0) && msg.f !== my).length;
  },
  markRead() {
    this.st.chatReadT = Date.now();
    this.saveSt();
    this.updateBadges();
  },
  updateBadges() {
    const n = this.unread();
    document.querySelectorAll(".chat-badge").forEach(b => {
      b.textContent = "+" + n;
      b.classList.toggle("hidden", n === 0);
    });
    if (n > this.lastUnread && currentScreen === "chat") {
      renderChatList(); // 채팅 화면을 보고 있으면 바로 갱신
      this.markRead();
    } else if (n > this.lastUnread && currentScreen !== "chat") {
      toast("💬 새 가족 톡이 도착했어요!", 2200);
    }
    this.lastUnread = this.unread();
  },
};

function chatMsgsHtml() {
  const my = chatRole();
  if (!(SAVE.chat || []).length) {
    return '<div class="prompt-hint" style="text-align:center;padding:30px 10px">아직 메시지가 없어요.<br>첫 메시지를 남겨 보세요! 💬</div>';
  }
  return SAVE.chat.map(m => {
    const mine = m.f === my;
    const who = CHAT_WHO[m.f] || "👶 아이";
    const d = new Date(m.t);
    const time = (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    return '<div class="bubble ' + (mine ? "me" : "them") + '">' + esc(m.x) +

}
function sendChat(text) {
  const x = String(text || "").trim().slice(0, 120);
  if (!x) return;
  (SAVE.chat = SAVE.chat || []).push({ f: chatRole(), x, t: Date.now() });

  renderChatList();
  Family.markRead();
  Family.sync();
}

/* ================================================================

(function validateData() {
  // 1) 두 단어 세트 공통 검증: 중복 영단어 / 카테고리 키 / 끝말잇기 체인 커버리지
  Object.entries(WORD_SETS).forEach(([name, set]) => {
    const seen = new Set();
    const dups = [];
    set.words.forEach(w => { if (seen.has(w.en)) dups.push(w.en); seen.add(w.en); });
    console.assert(dups.length === 0, "[" + name + "] 중복 영단어:", dups);
    console.log("[잉글리시몬:" + name + "] 단어 " + set.words.length + "개, 카테고리 " + set.categories.length + "개");

    const catKeys = new Set(set.categories.map(c => c.key));
    const badCat = set.words.filter(w => !catKeys.has(w.cat));
    console.assert(badCat.length === 0, "[" + name + "] 잘못된 카테고리:", badCat);

    const endCount = {};
    set.words.forEach(w => { const l = lastLetter(w); endCount[l] = (endCount[l] || 0) + 1; });
    const weak = [];
    Object.keys(endCount).forEach(l => {
      const starters = (set.startIndex[l] || []).length;
      if (starters < 2) weak.push(l + "(끝:" + endCount[l] + "/시작:" + starters + ")");
    });
    if (weak.length) console.warn("[체인:" + name + "] 시작 단어가 적은 끝글자(자동 리셋으로 처리됨):", weak.join(", "));
    const safeCount = set.words.filter(w => chainSafe(w, set.startIndex)).length;
    console.log("[체인:" + name + "] 제시어 가능 단어 " + safeCount + "/" + set.words.length);
  });
  console.assert(WORDS_ADULT.length === 500, "[parent] 단어 수 오류:", WORDS_ADULT.length);
  console.assert(WORDS_ADULT.every(w => w.id >= 1001), "[parent] id 범위 오류");
  console.assert(WORDS_TRAVEL.length === 450, "[travel] 단어 수 오류:", WORDS_TRAVEL.length);
  const tseen = new Set(), tdups = [];
  WORDS_TRAVEL.forEach(w => { if (tseen.has(w.en)) tdups.push(w.en); tseen.add(w.en); });
  console.assert(tdups.length === 0, "[travel] 레벨 간 중복 단어:", tdups);
  console.assert(WORDS_TRAVEL.every(w => w.id >= 3001 && [1, 2, 3].includes(w.lv)), "[travel] id/레벨 오류");
  console.assert(PHRASES_TRAVEL.length === 120, "[phrase] 문장 수 오류:", PHRASES_TRAVEL.length);
  const pseen = new Set(), pdups = [], plong = [];
  PHRASES_TRAVEL.forEach(p => {
    if (pseen.has(p.en)) pdups.push(p.en);
    pseen.add(p.en);
    const n = p.en.replace(/[.,?!]/g, "").split(" ").filter(Boolean).length;
    if (n > 12) plong.push(p.en + "(" + n + ")");
  });
  console.assert(pdups.length === 0, "[phrase] 중복 문장:", pdups);
  console.assert(plong.length === 0, "[phrase] 12토큰 초과(타일 배열 불가):", plong);
  [1, 2, 3].forEach(lv => {
    const n = PHRASES_TRAVEL.filter(p => p.lv === lv).length;
    console.assert(n >= 3, "[phrase] Lv" + lv + " 문장 부족:", n);
  });
  console.log("[여행] 단어 " + WORDS_TRAVEL.length + "개 / 회화 " + PHRASES_TRAVEL.length + "문장 (레벨별 " +
    [1, 2, 3].map(lv => WORDS_TRAVEL.filter(w => w.lv === lv).length + "·" + PHRASES_TRAVEL.filter(p => p.lv === lv).length).join(" / ") + ")");
  console.assert(WORDS_IELTS.length === 450, "[ielts] 단어 수 오류:", WORDS_IELTS.length);
  const iseen = new Set();
  const idups = [];
  WORDS_IELTS.forEach(w => { if (iseen.has(w.en)) idups.push(w.en); iseen.add(w.en); });
  console.assert(idups.length === 0, "[ielts] 레벨 간 중복 단어:", idups);
  console.assert(WORDS_IELTS.every(w => w.id >= 2001 && [1, 2, 3].includes(w.lv)), "[ielts] id/레벨 오류");

  // 4) 포켓몬 데이터
  console.assert(POKEMON_KO.length === TOTAL_POKEMON, "[포켓몬] 이름 수 오류:", POKEMON_KO.length);
  const poolSum = Object.values(RARITY_POOL).reduce((s, a) => s + a.length, 0);
  console.assert(poolSum === TOTAL_POKEMON, "[포켓몬] 희귀도 분류 합계 오류:", poolSum);
  const dexMissing = [];
  for (let i = 1; i <= TOTAL_POKEMON; i++) {
    if (!DEX_INFO[i]) { dexMissing.push(i); continue; }
    DEX_INFO[i][0].split("·").forEach(t => { if (!TYPE_COLORS[t]) dexMissing.push(i + ":" + t); });
  }
  console.assert(dexMissing.length === 0, "[포켓몬] 도감 설명 누락/타입 오타:", dexMissing);
  const evoBad = [];
  const evoSeen = new Set();
  EVO_LINES.forEach(line => line.forEach(id => {
    if (id < 1 || id > TOTAL_POKEMON) evoBad.push(id);
    if (evoSeen.has(id)) evoBad.push("dup:" + id);
    evoSeen.add(id);
  }));
  console.assert(evoBad.length === 0, "[진화] 라인 데이터 오류:", evoBad);
  console.log("[진화] 라인 " + EVO_LINES.length + "개, 포함 포켓몬 " + evoSeen.size + "마리");

  // 세대(탐험 지역) 데이터
  console.assert(GENERATIONS[0].from === 1 && GENERATIONS[GENERATIONS.length - 1].to === TOTAL_POKEMON,
    "[세대] 범위가 도감 전체를 덮지 않음");
  GENERATIONS.forEach((g, i) => {
    if (i > 0) console.assert(g.from === GENERATIONS[i - 1].to + 1, "[세대] 범위 불연속:", g.gen);
  });
  const noName = [];
  for (let i = 1; i <= TOTAL_POKEMON; i++) if (!POKEMON_KO[i - 1]) noName.push(i);
  console.assert(noName.length === 0, "[포켓몬] 한글 이름 누락:", noName.slice(0, 10));
  console.log("[세대] " + GENERATIONS.length + "개 지역 (" +
    GENERATIONS.map(g => g.region + " " + (g.to - g.from + 1)).join(" / ") + ")");
  // 도망 문장 퀴즈
  const badEsc = ESCAPE_PHRASES.filter(p => {
    const n = p[0].split(" ").length;
    return n < 3 || n > 5;
  });
  console.assert(badEsc.length === 0, "[도망] 3~5단어 범위를 벗어난 문장:", badEsc);
  const escDup = [];
  const escSeen = new Set();
  ESCAPE_PHRASES.forEach(p => { if (escSeen.has(p[0])) escDup.push(p[0]); escSeen.add(p[0]); });
  console.assert(escDup.length === 0, "[도망] 중복 문장:", escDup);
  console.log("[도망] 문장 " + ESCAPE_PHRASES.length + "개");
  // 도감 설명 커버리지
  let withStory = 0;
  for (let i = 1; i <= TOTAL_POKEMON; i++) if (DEX_INFO[i] && DEX_INFO[i][2]) withStory++;
  console.log("[도감설명] " + withStory + "/" + TOTAL_POKEMON + "마리");
  console.log("[포켓몬] 일반 " + RARITY_POOL.common.length + " / 레어 " + RARITY_POOL.rare.length +
    " / 유니크 " + RARITY_POOL.unique.length + " / 전설 " + RARITY_POOL.legendary.length);

  // 5) 조우 확률 합계
  const encSum = Object.values(CONFIG.encounterRate).reduce((a, b) => a + b, 0);
  console.assert(encSum === 100, "[확률] 조우 확률 합계 오류:", encSum);
})();
